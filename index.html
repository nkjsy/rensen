  addFriend(a, b, -20); toast(`💔 ${a.d.name} and ${b.d.name} got divorced...`); logNews(`💔 ${a.d.name} and ${b.d.name} fought too much and ended up divorced`); save();
}
function dramaMorning(extra){
  const adults = residents.filter(r=>!r.d.kid && !r.d.isPlayer && r.state!=='away');
  adults.forEach(r=>{
    const d = r.d;
    // the crush has found someone else
    if(d.crush){ const o = byId(d.crush.id); if(!o || o.d.partner){ if(o) extra.push(`💧 ${d.name} had a crush on ${o.d.name} for so long, but before saying anything, ${o.d.name} started dating someone else...`); d.crush = null; d.mood = clamp(d.mood-20,0,100); return; } }
    if(d.partner || hasSocialWant(r)) return;
    // old flames
    const ex = d.ex && byId(d.ex);
    if(ex && canRomance(r, ex) && (d.friends[ex.d.id]||0) >= 60 && Math.random() < .12){ d.want = {type:'love', with:ex.d.id}; extra.push(`💞 ${d.name} keeps hanging out with their ex, ${ex.d.name}, lately... Are the old sparks back?`); return; }
    // secret crush: grows quietly, then they decide to confess
    if(d.crush && S.day - d.crush.since >= 3 && Math.random() < .35){ const o = byId(d.crush.id); d.want = {type:'love', with:o.d.id}; extra.push(`💌 ${d.name} has had a crush on ${o.d.name} for ${S.day - d.crush.since} days, and today finally decided to confess!`); d.crush = null; return; }
    if(!d.crush && Math.random() < .1){ const o = residents.filter(x=>x!==r && canRomance(r,x) && x.d.id!==d.noCrush && (d.friends[x.d.id]||0) >= 40).sort((x,y)=>(d.friends[y.d.id]||0)-(d.friends[x.d.id]||0))[0]; if(o) d.crush = {id:o.d.id, since:S.day}; }
  });
  // kids pick up their parents' catchphrases, best friends rub off on each other
  residents.forEach(r=>{
    const d = r.d; if(d.isPlayer) return;
    if(d.kid && kidAge(d) >= 3 && Math.random() < .12){ const p = (d.parents||[]).map(byId).filter(x=>x && x.d.catch && x.d.catch!==d.catch)[0]; if(p){ d.catch = p.d.catch; d.catchFrom = p.d.id; extra.push(`👶 ${d.name} picked up ${gOf(p)==='f' ? 'Mom' : 'Dad'} ${p.d.name}'s catchphrase "${p.d.catch}"`); } return; }
    if(!d.kid && Math.random() < .03){ const o = residents.filter(x=>x!==r && !x.d.isPlayer && (d.friends[x.d.id]||0) >= 95 && x.d.catch && x.d.catch!==d.catch)[0]; if(o){ d.catch = o.d.catch; d.catchFrom = o.d.id; extra.push(`💬 ${d.name} and ${o.d.name} are always together, and now they're both saying "${o.d.catch}"`); } }
  });
  // residents in a good mood sometimes write their own songs
  residents.forEach(r=>{
    const d = r.d; if(d.isPlayer || (d.kid && kidAge(d) < 6) || d.mood < 60 || Math.random() > .05) return;
    const s = composeSong(r); d.songs = (d.songs||[]).concat(s).slice(-6);
    extra.push(`🎵 ${d.name} wrote a ${GENRES[s.genre].n} song, "${s.title}". Go to the stage and hear ${ta(d)} sing it`);
  });
}
function composeSong(r){
  const d = r.d, fr = residents.filter(o=>o!==r && (d.friends[o.d.id]||0) >= 40), f = fr.length ? pick(fr).d.name : 'everyone', pt = d.partner && byId(d.partner);
  const food = FOODS[d.fav] ? FOODS[d.fav].n : 'cake', sea = ['Spring','Summer','Autumn','Winter'][seasonIdx()];
  const titles = [`${sea}${food}`, `A Song for ${f}`, 'Island Song', `${d.catch||'la la la'} March`, pt ? `I Love ${pt.d.name}` : 'A Night Alone', 'By the Fountain'];
  const pool = [`${sea} comes to the island`, `I love to eat ${food}`, `${f} is my good friend`, 'The sea breeze blows along', 'Let\'s do our best today', `${d.catch||'la la la'}${d.catch||'la la la'}`, 'The stars are twinkling', 'Let\'s go see the sea', 'My tummy rumbles loud', 'The Ferris wheel goes round', pt ? `${pt.d.name}, where are you` : 'Who will knock on my door', 'Tomorrow will be sunny too'];
  return {title:pick(titles), genre:pick(Object.keys(GENRES)), lyrics:shuffle(pool).slice(0,4).join('\n')};
}

function startPlay(P, actors){

  all.forEach(castScript);

  actors.forEach((x,i)=>{ x.dest = spot.clone().add(new T.Vector3(px*(i-1)*1.25, 0, pz*(i-1)*1.25)); x.facePos = front.clone(); });

  let li = 0, lt = 0, ad = 0;

    begin(){ actors.forEach((x,i)=>{ x.p.root.position.y = .35; x.scriptBubble = null; }); aud.forEach(x=>{ x.pose = 'chat'; x.scriptBubble = '🍿'; }); toast(`🎭 The play "${P.n}" begins!`, 'gold'); lt = .5; },
    tick(dt){

      const [ri9, line] = P.lines[li++], x = actors[ri9], d = x.d, funny = d.pers==='funny' ? .3 : .12;
      let text = line, lol = false;
      if(Math.random() < funny){ text = pick(ADLIBS).replace(/\{catch\}/g, d.catch||'hehe').replace(/\{food\}/g, FOODS[d.fav] ? FOODS[d.fav].n : 'cake'); lol = true; ad++; }
      actors.forEach(a=>{ a.pose = null; a.scriptBubble = null; }); x.pose = 'chat'; x.scriptBubble = lol ? '😜' : '💬';
      const el = $('#karaoke'); el.innerHTML = `<small>🎭 ${esc(P.n)} · ${esc(P.roles[ri9])}</small><span class="on">${esc(d.name)}: ${esc(text)}</span>`; el.hidden = false;

      if(lol){ aud.forEach(a=>{ a.scriptBubble = '🤣'; a.pose = 'happy'; }); setTimeout(()=>aud.forEach(a=>{ if(show && show.type==='play'){ a.scriptBubble = '🍿'; a.pose = 'chat'; } }), 1500); }
      lt = 1.4 + text.length*.17;
    },
    finish(){
      this.stage = 2; this.t = 0; karaoke(null, -1);

      aud.forEach(a=>{ a.pose = 'happy'; a.scriptBubble = '👏'; a.d.mood = clamp(a.d.mood+10,0,100); });
      addCoins(coins); applause(); burst(scene, actors[1].p.root.position.clone().setY(3), '🌹', 8, 1.2); task('play');
      toast(ad ? `🤣 The audience cracked up! "${P.n}" ends +${coins} coins` : `👏 "${P.n}" ends with a perfect bow! +${coins} coins`, 'gold');
      logNews(`🎭 ${actors.map(a=>a.d.name).join(', ')} put on the play "${P.n}" on stage ${ad ? `, and ${pick(actors).d.name}'s ad-libs had everyone in stitches` : ''}`);
      setTimeout(()=>autoPhoto(`🎭 The play "${P.n}"`), 600);
    }};
  cam.goal.set(L.x + ux*2.2, 0, L.z + uz*2.2); cam.distGoal = 15; cam.yawGoal = Math.atan2(ux, uz); cam.pitchGoal = .9;
}

function buildArch(){
  const g = new T.Group();
  [-1,1].forEach(s=>g.add(mesh(G.cyl(.08,.08,2.4,8), M('#FFFFFF'), s*1.1,1.2,0)));
  const arc = new T.Mesh(new T.TorusGeometry(1.1,.1,8,24,Math.PI), M('#FFB3C8')); arc.position.y = 2.4; g.add(arc);
  for(let i=0;i<9;i++){ const a = i/8*Math.PI; g.add(mesh(G.sph(.16,8,6), M(['#FF7A8A','#FFFFFF','#FFC94D'][i%3]), Math.cos(a)*1.1, 2.4 + Math.sin(a)*1.1, .05, false)); }
  return g;
}
function startWedding(a, b, venueKey, dress){
  if(mode==='room') leaveRoom(); if(selected) closeSheet();

  const arch = buildArch(); arch.position.copy(C).addScaledVector(toCam, -.8); arch.rotation.y = Math.atan2(toCam.x, toCam.z); scene.add(arch);
  const prev = [a.d.outfit, b.d.outfit];
  if(dress){ [a,b].forEach(x=>{ x.d.outfit = gOf(x)==='f' ? 'princess' : 'suit'; rebuildChar(x); }); }
  const march = [[67,1],[72,.75],[72,.25],[72,2],[67,1],[74,.75],[71,.25],[72,2],[67,1],[72,.75],[77,.25],[77,1],[76,.75],[74,.25],[72,1],[71,.75],[72,.25],[74,2]];
  let mi = 0, mt = 0, kissed = false;
  show = {type:'wedding', host:a, cast:all, stage:0, t:0, cake:arch,

    tick(dt){

      if(!kissed && this.t > 5){ kissed = true; [a,b].forEach(x=>x.scriptBubble = '💋'); burst(scene, C.clone().setY(2.6), '💖', 14, 1.4); sfx.happy(); }
      if(this.t > 8.5) this.finish();
    },
    finish(){
      this.stage = 2; this.t = 0; confetti(scene, C); applause();
      [a,b].forEach(x=>{ x.scriptBubble = '🥰'; x.d.mood = 100; }); guests.forEach(g=>{ g.pose = 'happy'; g.scriptBubble = '🎉'; addFriend(a, g, 4); addFriend(b, g, 4); });
      addCoins(80 + guests.length*10); task('wedding');
      toast(`👰🤵 ${a.d.name} and ${b.d.name} got married at the ${V[1].split(' ').slice(1).join(' ')}!`, 'gold');
      logNews(`👰 ${a.d.name} and ${b.d.name} got married at the ${V[1].split(' ').slice(1).join(' ')}, and ${guests.length} friends came to celebrate`);
      { const cap = `👰 ${a.d.name} and ${b.d.name}'s wedding`; setTimeout(()=>autoPhoto(cap), 500); }

const cam = {yaw:.6, pitch:.7, dist:25, target:new T.Vector3(0,0,0), goal:new T.Vector3(0,0,0)};

canvas.addEventListener('pointerdown', e=>{

  if(pointers.size===1){ dragMoved = false; downAt = {x:e.clientX, y:e.clientY}; }

const ray = new T.Raycaster(), ndc = new T.Vector2();
function onTap(x, y){
  if(pm.on) return;
  ndc.set(x/innerWidth*2-1, -(y/innerHeight)*2+1);
  if(mode==='room'){ roomTap(); return; }
  ray.setFromCamera(ndc, camera);
  const objs = [...residents.filter(r=>r.p.root.visible).map(r=>r.p.hit), ...pets.filter(p=>p.p.root.visible).map(p=>p.p.hit), ...(visitor ? [visitor.p.hit] : []), ...Object.values(houses), ...Object.values(LOC_G), shopStand, ground];
  const hits = ray.intersectObjects(objs, true);
  for(const h of hits){
    let o = h.object; while(o && !o.userData.pick && o!==ground) o = o.parent;
    if(o===ground){
      let near = null, nd = 52;
      residents.forEach(r=>{ if(!r.p.root.visible) return; const v = r.p.root.position.clone(); v.y += 1.5; v.project(camera);
        const dd = Math.hypot((v.x*.5+.5)*innerWidth - x, (-v.y*.5+.5)*innerHeight - y); if(v.z < 1 && dd < nd){ nd = dd; near = r; } });
      if(near){ select(near); return; }
      if(selected) closeSheet(); const pt = h.point; const d = Math.hypot(pt.x,pt.z); const k = d>12 ? 12/d : 1; cam.goal.set(pt.x*k,0,pt.z*k); return; }
    if(!o) continue;
    const pk = o.userData.pick;
    if(pk.type==='res'){ select(pk.r); return; }
    if(pk.type==='house'){ sfx.pop(); enterRoom(pk.r); return; }
    if(pk.type==='shop'){ sfx.pop(); openShop(); return; }
    if(pk.type==='loc'){ openLoc(pk.k); return; }
    if(pk.type==='visitor'){ sfx.pop(); openVisitor(); return; }
    if(pk.type==='pet'){ petSound(pk.pw.d.kind); openPetSheet(pk.pw); return; }
  }
}

/* ---------------- mini game: rock paper scissors ---------------- */
function openRPS(r){
  const st = {me:0, him:0, last:null, done:false};
  if(selected) closeSheet();
  cam.goal.copy(r.p.root.position);
  const talkTo = line => { r.say = line; r.spoken = line; speakWith(r.d.voice, line); };
  const draw = ()=>{
    const L = st.last, name = esc(r.d.name);
    const msg = st.done ? (st.me > st.him ? `You win! ${name} gives you 30 coins` : `${name} wins! You get 15 coins for playing`) : L ? (L.res>0 ? 'You won this round!' : L.res<0 ? `${name} won this round` : 'A tie! Go again') : 'Best two out of three. Throw!';
    openModal(`<div class="modal-head"><h2>Rock-paper-scissors with ${name}</h2><button class="toy close" data-close="1" style="margin-left:auto" aria-label="Close">×</button></div>\n      <div class="rps-board"><div class="side">You<div class="hand">${L ? HANDS[L.mine].e : '❔'}</div><div class="pts">${st.me}</div></div><div class="vs">VS</div><div class="side">${name}<div class="hand">${L ? HANDS[L.his].e : '❔'}</div><div class="pts">${st.him}</div></div></div>
      <div class="rps-msg">${msg}</div>
      ${st.done ? '<button class="toy big-go" data-close="1">So fun!</button>' : `<div class="rps-hands">${HANDS.map((h,i)=>`<button class="toy rps-btn" data-hand="${i}"><span>${h.e}</span>${h.n}</button>`).join('')}</div>`}`, b=>{
      if(!b || !b.dataset.hand || st.done) return;
      const mine = +b.dataset.hand, his = Math.floor(Math.random()*3);
      const res = mine===his ? 0 : ((mine+1)%3===his ? 1 : -1);
      if(res>0) st.me++; else if(res<0) st.him++;
      st.last = {mine, his, res}; sfx.pop();
      if(st.me>=2 || st.him>=2){
        st.done = true; const win = st.me > st.him;
        r.d.mood = clamp(r.d.mood+15,0,100);
        if(r.d.want && r.d.want.type==='play') fulfil(r, win?30:15); else addCoins(win?30:15);
        beHappy(r, win?'😆':'😝', 2); sfx.happy();
        talkTo((win ? 'You\'re so good! I\'ll win next time for sure' : 'Yay! I won! Come play again') + ', ' + r.d.catch);
      } else talkTo(res>0 ? 'Oops!' : res<0 ? 'Hehe!' : 'A tie!');
      draw();
    });
  };
  draw();
}

function loadPhotos(){ try{ return JSON.parse(store('xx_photos')||'[]') || []; }catch(e){ return []; } }
function takePhoto(){
  if(mode==='island') renderer.render(scene, camera); else renderer.render(roomScene, roomCam);
  const src = renderer.domElement, w = 720, h = Math.round(w*src.height/src.width);
  const c = document.createElement('canvas'); c.width = w; c.height = h + 60; const g = c.getContext('2d');
  g.fillStyle = '#FFFBF2'; g.fillRect(0,0,c.width,c.height); g.drawImage(src,0,0,w,h);
  g.fillStyle = '#D95466'; g.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif'; g.fillText('Heart Island', 20, h+40);
  g.fillStyle = '#6E6788'; g.font = '20px "PingFang SC","Microsoft YaHei",sans-serif'; g.fillText(`Day ${S.day}` + (mode==='room' && roomRes ? ` · ${roomRes.d.name}'s home` : ''), 140, h+40);
  let url; try{ url = c.toDataURL('image/jpeg', .8); }catch(e){ toast('That one didn\'t work, try again'); return; }
  const fl = document.createElement('div'); fl.className = 'flash'; document.body.appendChild(fl); setTimeout(()=>fl.remove(), 600);
  tone(1800,.04,'square',.05); tone(1200,.06,'square',.04,.05);
  showPhoto(url, true);
}
function showPhoto(url, fresh, idx){
  const n = loadPhotos().length;
  openModal(`<div class="modal-head"><h2>${fresh ? 'Snap!' : 'Photo'}</h2><button class="toy close" data-close="1" style="margin-left:auto" aria-label="Close">×</button></div>\n    <img class="photo" src="${url}" alt="Island photo">\n    <p class="tip">Long-press or right-click the picture to save it to your device.</p>\n    <div class="row-btns">${fresh ? '<button class="toy pill-btn" data-keep="1">Add to album</button>' : `<button class="toy pill-btn" data-del="${idx}">Delete this one</button>`}<button class="toy pill-btn" data-album="1">Album (${n})</button></div>`, b=>{
    if(!b) return;
    if(b.dataset.keep){ const ph = loadPhotos(); ph.unshift(url); while(ph.length > 30) ph.pop(); try{ localStorage.setItem('xx_photos', JSON.stringify(ph)); toast('Added to the album'); }catch(e){ toast('The album is full. Delete a few first'); } openAlbum(); }
    if(b.dataset.del !== undefined){ const ph = loadPhotos(); ph.splice(+b.dataset.del,1); store('xx_photos', JSON.stringify(ph)); openAlbum(); }
    if(b.dataset.album) openAlbum();
  });
}
function openAlbum(){
  const ph = loadPhotos();
  openModal(`<div class="modal-head"><h2>Album</h2><button class="toy close" data-close="1" style="margin-left:auto" aria-label="Close">×</button></div>\n ${ph.length ? `<div class="album">${ph.map((u,i)=>`<button data-view="${i}" aria-label="View photo ${i+1}"><img src="${u}" alt=""></button>`).join('')}</div>` : '<p class="tip">No photos yet. Tap the camera at the top right to take one!</p>'}`, b=>{
    if(b && b.dataset.view !== undefined){ const i = +b.dataset.view; showPhoto(ph[i], false, i); }
  });
}

function renderEditor(){

}

function editorClick(b, e){
    if(draft && draft.isPet) return petEdClick(b, e);
    if(!b){ const id = e.target.id;
      if(id==='nameInput'){ draft.name = e.target.value; }
      if(id==='nickInput') draft.nick = e.target.value;
      if(id==='catchInput') draft.catch = e.target.value;
      if(id==='pitchIn') draft.voice.pitch = +e.target.value;
      if(id==='rateIn') draft.voice.rate = +e.target.value;
      if(id==='lk_height' || id==='lk_build'){ draft.look[id.slice(3)] = +e.target.value; setupPreview(); }
      if(id.startsWith('tr_')){ draft.traits[id.slice(3)] = +e.target.value; draft.pers = persFromTraits(draft.traits); const po = $('#persOut'); if(po) po.textContent = persName({pers:draft.pers, traits:draft.traits}); const pt = $('#persTalk'); if(pt) pt.textContent = `"${TALK_SUB[draft.pers][persSub(draft.traits)]}"`; }
      return; }
    if(b.dataset.step){ draft.step = +b.dataset.step; sfx.pop(); renderEditor(); return; }
    if(b.dataset.next){ draft.step = Math.min(ED_STEPS.length-1, draft.step+1); sfx.pop(); renderEditor(); if(draft.step===2) speakWith(draft.voice, `I'm ${draft.name||'a new friend'}, ${draft.catch||''}`); return; }
    if(b.dataset.prev){ draft.step = Math.max(0, draft.step-1); sfx.pop(); renderEditor(); return; }
    if(b.dataset.cat){ draft.cat = b.dataset.cat; sfx.pop(); renderEdOpts(); return; }
    if(b.dataset.adj){ const k = b.dataset.adj, mx = ADJ_MAX[k] || 4; draft.look[k] = clamp(av(draft.look,k) + +b.dataset.d, -mx, mx); sfx.pop(); renderEdOpts(); setupPreview(); return; }
    if(b.dataset.adjreset){ (ADJ_UI[b.dataset.adjreset]||[]).forEach(([k])=>delete draft.look[k]); sfx.pop(); renderEdOpts(); setupPreview(); return; }
    if(b.dataset.bday){ draft.bday = +b.dataset.bday; sfx.pop(); renderEdOpts(); return; }
    if(b.dataset.say){ const [,t] = SAY_TESTS[+b.dataset.say], v = Object.assign({}, draft.voice); if(+b.dataset.say===2) v.pitch *= .92; if(+b.dataset.say===1 || +b.dataset.say===5) v.pitch *= 1.08; speakWith(v, t + ', ' + (draft.catch||'')); return; }
    if(b.dataset.gender){
      const g = b.dataset.gender, v = draft.voice; v.g = g; v.name = null;
      if(g==='f' && v.pitch < 1.05) v.pitch = Math.round(rand(1.1,1.5)*10)/10;
      if(g==='m' && v.pitch > 1.1) v.pitch = Math.round(rand(.75,1.05)*10)/10;
      if(g==='f') draft.look.beard = 'none';
      renderEdOpts(); setupPreview(); speakWith(v, `I'm ${draft.name||'a new friend'}, ${draft.catch||''}`); return;
    }
    if(b.dataset.vname !== undefined){ draft.voice.name = b.dataset.vname || null; renderEdOpts(); speakWith(draft.voice, `I'm ${draft.name||'a new friend'}, ${draft.catch||''}`); return; }
    if(b.dataset.go && editing){
      const r = editing, d = r.d; editing = null;
      d.name = ((draft.name||'').trim() || d.name).slice(0,12); d.nick = (draft.nick||'').trim().slice(0,12) || null; d.bday = draft.bday || d.bday;
      d.look = draft.look; d.pers = draft.pers; d.traits = draft.traits; r.speed = 1.7 + d.traits.move*.14; d.catch = (draft.catch||'').trim().slice(0,14) || d.catch; d.voice = draft.voice;
      closeModal(); rebuildChar(r); buildHouse(r); fixCouples(); save(); sfx.happy();
      toast(`${d.name} has a new look!`, 'gold'); cam.goal.copy(r.p.root.position);
      if(r.state!=='home') beHappy(r,'✨',1.8);
      r.say = 'Hehe, do I look good? ' + d.catch; r.spoken = r.say; speakWith(d.voice, r.say);
      return;
    }
    if(b.dataset.go){
      const name = (draft.name||'').trim() || 'New friend';
      const d = makeResData(name.slice(0,12), draft.look, draft.pers, draft.slot); d.traits = draft.traits; d.catch = (draft.catch||'').trim().slice(0,14) || pick(CATCHES); d.voice = draft.voice;
      d.bday = draft.bday || d.bday; d.nick = (draft.nick||'').trim().slice(0,12) || null;
      if(makingPlayer){ d.isPlayer = true; S.playerId = d.id; d.job = null; }
      closeModal(); const r = addResident(d, true);
      save(); sfx.happy(); toast(`Welcome to Heart Island, ${d.name}!`, 'gold'); logNews(`🏠 ${d.name} moved to the island`);
      cam.goal.copy(r.p.root.position); confetti(scene, r.p.root.position); if(!isNight()) beHappy(r,'👋',2);
      r.say = `Hi, I'm ${d.name}! ${d.catch}`; r.spoken = r.say; speakWith(d.voice, r.say);
      checkExpand();

    pvScene.add(new T.HemisphereLight(0xffffff,0xbbbbbb,.75)); const dl = new T.DirectionalLight(0xffffff,.6); dl.position.set(3,5,5); pvScene.add(dl);
