<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>心心小岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
:root{
  --ink:#3B3355; --ink-soft:#6E6788; --panel:#FFFBF2; --panel-2:#FFF3DE; --line:#EADFCB;
  --coral:#FF7A8A; --coral-d:#D95466; --sun:#FFC94D; --sun-d:#D9A12A; --mint:#5CC9A7; --mint-d:#389C7E;
  --blue:#6FA8FF; --blue-d:#4A7FD6; --lilac:#B48CFF; --lilac-d:#8A63D6;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --body:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:#9EE3F5;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;touch-action:none;display:block;width:100%;height:100%}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* chunky toy buttons */
.toy{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.toy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.toy[disabled]{opacity:.45;pointer-events:none}

#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 16px;pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.brand{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:6px 14px 8px}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:.04em;color:var(--coral-d)}
.brand .clock{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:2px}
.hud-right{display:flex;gap:8px;align-items:center}
.coins{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:22px;padding:6px 14px;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:var(--sun);border:3px solid var(--sun-d);box-sizing:border-box;display:inline-block}
.icon-btn{width:48px;height:48px;font-size:22px;display:grid;place-items:center;padding:0;position:relative}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
.say{margin:10px 0 0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:15px;position:relative}
.want-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 12px;font-size:14px;color:var(--ink-soft)}
.pill-btn.hot{background:var(--sun)}
.news h3{font-family:var(--display);font-weight:400;font-size:19px;margin:6px 0 8px}
.news ul{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.news li{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px}
.dream{background:linear-gradient(#3C3F7A,#6B5FA8);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;text-align:center}
.dream .dream-ic{font-size:40px;letter-spacing:6px}
.dream p{font-size:18px;line-height:1.6;margin:10px 0 0}
.dream .bonus{font-size:13px;opacity:.85}
.lvbox{background:#EADFFF;border:2px dashed var(--lilac-d);border-radius:14px;padding:8px 12px;margin:-2px 0 12px;font-size:15px}
.lvbox .want-acts{margin:8px 0 0}
.text-in{flex:1;min-width:0;font-family:var(--display);font-size:18px;padding:7px 12px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
textarea.text-in{width:100%;box-sizing:border-box;min-height:100px;resize:vertical;font-size:17px;line-height:1.5}
.trait{display:grid;grid-template-columns:4.2em 1fr 4.2em;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.trait span:last-child{text-align:right}
.trait input{width:100%;accent-color:var(--coral)}
.pers-name{font-family:var(--display);font-size:18px;color:var(--coral-d);margin:2px 0 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.opts .toy{padding:12px 8px;font-size:17px}
.opts .big{font-size:34px;display:block;line-height:1.2}
.q-say{font-family:var(--display);font-size:20px;text-align:center;margin:6px 0 14px}
.sec{font-family:var(--display);font-size:17px;margin:12px 0 6px}
#karaoke{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(59,51,85,.9);color:#fff;border-radius:16px;padding:8px 18px;font-family:var(--display);font-size:22px;z-index:6;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;letter-spacing:.06em}
#karaoke .on{color:var(--sun)}
#karaoke small{display:block;font-size:13px;opacity:.8;letter-spacing:0}

#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5;max-width:calc(100% - 32px)}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px 6px;min-width:74px;font-size:15px}
.dock-btn .ic{font-size:30px;line-height:1}
.dock-btn.hot{background:var(--sun)}
@media (max-width:420px){.dock-btn{min-width:0;flex:1;padding:8px 6px 6px;font-size:14px}.dock-btn .ic{font-size:26px}#dock{gap:7px;width:calc(100% - 32px)}}

#toasts{position:fixed;top:calc(88px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:30;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:8px 16px;font-family:var(--display);font-size:18px;box-shadow:0 4px 0 var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;text-align:center}
.toast.gold{background:var(--sun)}
.toast.pink{background:#FFD3DA}
.toast.out{animation:fade .4s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(-10px)}}

/* bottom sheet */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:520px;background:var(--panel);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);z-index:10;padding:14px 16px 16px;box-sizing:border-box;max-height:62%;overflow:auto;animation:rise .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet-head{display:flex;align-items:center;gap:12px}
.face-dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);flex:none;position:relative}
.face-dot::after{content:"";position:absolute;left:50%;top:-10px;width:30px;height:18px;transform:translateX(-50%);border-radius:30px 30px 6px 6px;background:var(--hair,#3B2A26)}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:2px solid var(--line);color:var(--ink-soft)}
.close{margin-left:auto;width:42px;height:42px;font-size:24px;border-radius:50%;padding:0;flex:none}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:14px 0 10px;font-size:14px}
.bar{height:14px;border-radius:99px;background:#EFE6D6;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bar.mood i{background:var(--coral)} .bar.full i{background:var(--sun)} .bar.xp i{background:var(--lilac)}
.num{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px;min-width:28px;text-align:right}
.want{display:flex;align-items:center;gap:10px;background:#FFF0C9;border:2px dashed var(--sun-d);border-radius:14px;padding:8px 12px;font-size:15px;margin-bottom:12px}
.want .big{font-size:28px}
.want.none{background:var(--panel-2);border-color:var(--line);color:var(--ink-soft)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;font-size:14px}
.act .ic{font-size:24px;line-height:1}
.act.c1{background:#FFE1B8}.act.c2{background:#FFD3DA}.act.c3{background:#D5F3E8}.act.c4{background:#DCE8FF}.act.c5{background:#EADFFF}
.chooser{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.chooser h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:18px}
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;font-size:14px;position:relative}
.item .ic{font-size:32px;line-height:1.1}
.item .cnt{position:absolute;top:-8px;right:-6px;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:12px;min-width:22px;padding:1px 5px;font-family:var(--body);font-weight:700}
.item.sel{background:var(--sun)}
.item .fav{position:absolute;top:-8px;left:-6px;background:var(--mint);color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:11px;padding:1px 5px;font-family:var(--body)}
.empty{color:var(--ink-soft);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill-btn{padding:8px 14px;font-size:16px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(59,51,85,.35);z-index:20;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.modal{background:var(--panel);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);width:100%;max-width:620px;max-height:calc(100% - 20px);overflow:auto;padding:16px 18px 18px;box-sizing:border-box;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;color:var(--coral-d)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:6px 16px 8px;font-size:17px;border-radius:14px}
.tab.on{background:var(--mint);color:#fff}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.card{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card .ic{font-size:40px;line-height:1.1}
.card .nm{font-family:var(--display);font-size:17px}
.card .own{font-size:12px;color:var(--ink-soft)}
.buy{display:flex;align-items:center;gap:5px;padding:5px 12px 6px;font-size:16px;background:var(--sun);margin-top:4px}
.buy .coin{width:16px;height:16px;border-width:2px}

/* editor */
.editor{display:grid;grid-template-columns:220px 1fr;gap:16px}
@media (max-width:560px){.editor{grid-template-columns:1fr}}
.pv-wrap{align-self:start;background:linear-gradient(#BFEFFF,#E8FAFF);border:3px solid var(--ink);border-radius:20px;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px}
#pv{width:200px;height:200px;max-width:100%;display:block}
.opt{margin-bottom:12px}
.opt label,.opt .lb{display:block;font-family:var(--display);font-size:17px;margin-bottom:6px}
.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);padding:0;box-shadow:0 3px 0 var(--ink)}
.sw.on{outline:4px solid var(--coral);outline-offset:2px}
.chip{padding:6px 12px 7px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.chip.on{background:var(--coral);color:#fff}
.name-row{display:flex;gap:8px}
#nameInput,#catchInput{flex:1;min-width:0;font-family:var(--display);font-size:20px;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
.big-go{width:100%;padding:12px;font-size:22px;background:var(--coral);color:#fff;margin-top:6px}

@media (max-width:440px){.hud-right{gap:6px}.icon-btn{width:40px;height:40px;font-size:18px}.coins{font-size:18px;padding:5px 10px}.brand{padding:5px 10px 6px}.brand h1{font-size:21px}.brand .clock{font-size:12px}}
/* voice / rps / photos */
.voice-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.voice-row label{display:flex;align-items:center;gap:6px}
.voice-row input[type=range]{width:110px;accent-color:var(--coral)}
.rps-board{display:flex;align-items:center;justify-content:space-around;background:linear-gradient(#BFEFFF,#E8FAFF);border:3px solid var(--ink);border-radius:20px;padding:14px 8px}
.side{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:18px}
.hand{font-size:64px;line-height:1.15;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.pts{font-size:28px;color:var(--coral-d);font-variant-numeric:tabular-nums}
.vs{font-family:var(--display);font-size:26px;color:var(--ink-soft)}
.rps-msg{text-align:center;font-family:var(--display);font-size:20px;margin:12px 0}
.rps-hands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rps-btn{display:flex;flex-direction:column;align-items:center;font-size:16px;padding:10px 4px 8px}
.rps-btn span{font-size:40px;line-height:1.1}
.photo{width:100%;border:3px solid var(--ink);border-radius:16px;display:block}
.tip{font-size:13px;color:var(--ink-soft);margin:8px 0 12px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.album button{padding:0;border-radius:12px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);background:#fff}
.album img{width:100%;display:block}
.flash{position:fixed;inset:0;background:#fff;z-index:40;pointer-events:none;animation:fade .5s forwards}
/* friends */
.fr-list{display:flex;flex-direction:column;gap:12px}
.fr{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.fr .who{font-family:var(--display);font-size:20px}
.fr .meta{font-size:12px;color:var(--ink-soft)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lk{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--panel-2);border:2px solid var(--line)}
.lk.r1{background:#E4F6EE;border-color:#A8DEC9}.lk.r2{background:#FFE3E8;border-color:#FFB3C0}.lk.r3{background:#FFE9A8;border-color:var(--sun-d)}
.danger-zone{margin-top:18px;padding-top:12px;border-top:2px dashed var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-soft)}

/* room bar */
#roomBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:620px;background:var(--panel);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);z-index:10;padding:12px 14px 14px;box-sizing:border-box;max-height:48%;overflow:auto}
.room-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.room-top h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.room-top .hint{font-size:13px;color:var(--ink-soft);flex:1;min-width:140px}
.back{padding:6px 14px 8px;font-size:16px;background:var(--mint);color:#fff}
.furn-row{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px}
.furn-row .item{min-width:74px}
.room-colors{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:14px;align-items:center}
.room-colors .sw{width:30px;height:30px}
.sel-bar{display:flex;gap:8px;align-items:center;background:#FFF0C9;border-radius:14px;padding:8px 10px;margin-bottom:8px;font-size:15px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="game" aria-label="3D 小岛"></canvas>

<div id="hud">
  <div class="brand"><h1>心心小岛</h1><div class="clock" id="clock">第1天 · 早上 08:00</div></div>
  <div class="hud-right">
    <div class="coins toy" aria-label="金币"><span class="coin"></span><span id="coinNum">0</span></div>
    <button class="toy icon-btn" id="newsBtn" aria-label="小岛新闻">📰<span class="dot" id="newsDot" hidden></span></button>
    <button class="toy icon-btn" id="photoBtn" aria-label="拍照">📷</button>
    <button class="toy icon-btn" id="soundBtn" aria-label="声音开关">🔊</button>
  </div>
</div>

<div id="toasts"></div>
<div id="karaoke" hidden></div>

<div id="dock">
  <button class="toy dock-btn" id="bNew"><span class="ic">🧑‍🎨</span>新居民</button>
  <button class="toy dock-btn" id="bShop"><span class="ic">🏪</span>小卖部</button>
  <button class="toy dock-btn" id="bFriends"><span class="ic">💞</span>好朋友</button>
  <button class="toy dock-btn hot" id="bSleep" hidden><span class="ic">🌙</span>睡到天亮</button>
</div>

<div class="sheet" id="sheet" hidden></div>
<div id="roomBar" hidden></div>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const T = THREE;
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }

/* ---------------- data ---------------- */
const SKINS = ['#FFE3CC','#F8CDA6','#E6AD85','#C88A60','#8C5A3C'];
const HAIRS = [{id:'short',n:'短发'},{id:'spiky',n:'刺刺头'},{id:'buns',n:'丸子头'},{id:'long',n:'长发'},{id:'curly',n:'卷卷毛'}];
const HAIR_COLORS = ['#3B2A26','#7A4A2A','#E8B94A','#FF8FB1','#6FA8FF','#C9C9D6'];
const SHIRTS = ['#FF7A8A','#FFC94D','#5CC9A7','#6FA8FF','#B48CFF','#FF9F5A','#7ED957','#F4F4F4'];
const EYES = [{id:'round',n:'圆圆眼'},{id:'big',n:'亮晶晶'},{id:'smile',n:'眯眯眼'}];
const PERS = {lively:'活泼', gentle:'温柔', cool:'酷酷', funny:'搞笑'};
const NAMES = ['小桃','豆豆','米粒','阿布','糖糖','乐乐','小舟','团子','可可','皮皮','奶糖','星星','泡芙','果冻','小满','嘟嘟','布丁','小鹿'];
const FOODS = {
  apple:{n:'苹果',e:'🍎',p:10}, onigiri:{n:'饭团',e:'🍙',p:15}, watermelon:{n:'西瓜',e:'🍉',p:15},

let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(f, dur=.12, type='sine', vol=.12, when=0){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
}

};

/* ---------------- voice ---------------- */
function speakWith(voice, text){
  if(!soundOn || !window.speechSynthesis || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN';
    u.pitch = (voice && voice.pitch) || 1; u.rate = (voice && voice.rate) || 1;
    const zh = speechSynthesis.getVoices().find(v=>/zh/i.test(v.lang)); if(zh) u.voice = zh;
    speechSynthesis.speak(u);
  }catch(e){}
}

}

// labels / bubbles textures
const texCache = {};
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function labelTex(text, bg='#FFFBF2', fg='#3B3355'){
  const k = 'L'+text+bg; if(texCache[k]) return texCache[k];
  const c = document.createElement('canvas'); c.width = 256; c.height = 72; const g = c.getContext('2d');
  g.font = 'bold 38px "PingFang SC","Microsoft YaHei",sans-serif';
  const w = Math.min(244, g.measureText(text).width + 40);
  roundRect(g,(256-w)/2,6,w,60,30); g.fillStyle = bg; g.fill(); g.lineWidth = 5; g.strokeStyle = '#3B3355'; g.stroke();
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text,128,38);
  const t = new T.CanvasTexture(c); texCache[k] = t; return t;
}
function bubbleTex(emoji, style){
  const k = 'B'+emoji+style; if(texCache[k]) return texCache[k];
  const c = document.createElement('canvas'); c.width = 128; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = style==='want' ? '#FFF0C9' : '#FFFFFF'; g.strokeStyle = style==='want' ? '#D9A12A' : '#3B3355'; g.lineWidth = 6;
  g.beginPath(); g.arc(64,56,46,0,Math.PI*2); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(52,98); g.lineTo(64,122); g.lineTo(74,98); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.arc(64,56,43,0,Math.PI*2); g.fill();
  g.font = '52px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(emoji,64,60);
  const t = new T.CanvasTexture(c); texCache[k] = t; return t;
}
function sprite(tex, sx, sy){ const s = new T.Sprite(new T.SpriteMaterial({map:tex, depthTest:false, transparent:true})); s.scale.set(sx,sy,1); s.renderOrder = 10; return s; }

function buildHair(look){
  const g = new T.Group(), c = look.hairColor, m = M(c, true);
  const cap = (tilt=-.35, len=Math.PI*.55, r=.67) => { const h = new T.Mesh(new T.SphereGeometry(r,24,16,0,Math.PI*2,0,len), m); h.rotation.x = tilt; h.castShadow = true; return h; };
  const onSphere = (pol, az, r) => new T.Vector3(Math.sin(pol)*Math.cos(az)*r, Math.cos(pol)*r, Math.sin(pol)*Math.sin(az)*r);
  switch(look.hair){
    case 'spiky': {
      g.add(cap(-.3));
      for(let i=0;i<7;i++){ const az = i/7*Math.PI*2, dir = onSphere(.55, az, 1).applyAxisAngle(new T.Vector3(1,0,0),-.3);
        const cn = new T.Mesh(G.cone(.17,.45,8), m); cn.position.copy(dir.clone().multiplyScalar(.66)); cn.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), dir); g.add(cn); }
      const topc = new T.Mesh(G.cone(.18,.5,8), m); topc.position.set(0,.8,-.1); g.add(topc);
      break; }
    case 'buns':
      g.add(cap(-.3));
      [-1,1].forEach(s=>{ const b = new T.Mesh(G.sph(.26), m); b.position.set(s*.5,.45,-.12); b.castShadow = true; g.add(b); });
      break;
    case 'long': {
      g.add(cap(-.22));
      const back = new T.Mesh(new T.CylinderGeometry(.62,.72,1.0,24,1,true,Math.PI/2,Math.PI), m); back.position.set(0,-.4,-.02); g.add(back);
      break; }
    case 'curly':
      g.add(cap(-.35, Math.PI*.45, .64));
      [[0,0],[.5,0],[.5,1.2],[.5,2.4],[.5,3.6],[.5,4.8],[1.0,.6],[1.0,1.8],[1.0,3.0],[1.05,4.2],[1.0,5.4],[1.45,4.0],[1.45,5.0]].forEach(([p,a])=>{
        const d = onSphere(p,a,1).applyAxisAngle(new T.Vector3(1,0,0),-.4); const s = new T.Mesh(G.sph(.24,10,8), m); s.position.copy(d.multiplyScalar(.62)); g.add(s); });
      break;
    default:
      g.add(cap(-.35));
      { const f = new T.Mesh(G.sph(.2,10,8), m); f.position.set(.28,.52,.36); f.scale.set(1.3,.7,.8); g.add(f); }
  }
  return g;
}
function buildAcc(type){
  const g = new T.Group(); if(!type) return g;
  if(type==='strawhat'){ g.add(mesh(G.cyl(.95,.95,.05,24),M('#F2D16B'),0,.52,0)); g.add(mesh(G.cyl(.42,.5,.38,20),M('#F2D16B'),0,.72,0)); g.add(mesh(G.cyl(.51,.51,.1,20),M('#FF7A8A'),0,.58,0)); g.rotation.set(-.15,0,.12); }
  if(type==='crown'){ const b = new T.Mesh(new T.CylinderGeometry(.36,.36,.26,16,1,true), M('#FFD23F',true)); b.position.y=.68; g.add(b); for(let i=0;i<5;i++){ const a=i/5*6.28; g.add(mesh(G.cone(.08,.2,6),M('#FFD23F'),Math.cos(a)*.36,.88,Math.sin(a)*.36)); g.add(mesh(G.sph(.05,6,4),M('#FF7A8A'),Math.cos(a)*.37,.68,Math.sin(a)*.37)); } g.rotation.z=.12; }
  if(type==='bow'){ const p = M('#FF5E8A'); [-1,1].forEach(s=>{ const c = mesh(G.cone(.18,.36,12),p,s*.2,0,0); c.rotation.z = s*Math.PI/2; g.add(c); }); g.add(mesh(G.sph(.1),p)); g.position.set(.38,.5,.12); g.rotation.set(0,.3,.5); }
  if(type==='glasses'){ const d = M('#2A2438'); [-1,1].forEach(s=>{ const l = mesh(G.cyl(.15,.15,.04,20), d, s*.22,.06,.6); l.rotation.x=Math.PI/2; g.add(l); }); g.add(mesh(G.box(.2,.04,.04),d,0,.1,.6)); [-1,1].forEach(s=>g.add(mesh(G.box(.04,.04,.4),d,s*.37,.1,.42))); }
  if(type==='flower'){ const p = M('#FF8FB1'); for(let i=0;i<5;i++){ const a=i/5*6.28; g.add(mesh(G.sph(.1,8,6),p,Math.cos(a)*.12,Math.sin(a)*.12,0)); } g.add(mesh(G.sph(.08,8,6),M('#FFD54D'),0,0,.04)); g.position.set(-.4,.38,.36); g.rotation.y=-.6; }
  if(type==='balloon'){ const bl = mesh(G.sph(.42,16,12), M('#FF5E6E'), .95,1.35,0); bl.scale.y=1.15; g.add(bl); g.add(mesh(G.cyl(.012,.012,1.9,4), B('#3B3355'), .95,.2,0,false)); g.userData.balloon = bl; }
  return g;
}
function buildChar(look, acc, outfit){
  const root = new T.Group(), rig = new T.Group(); root.add(rig);
  const O = outfit || 'tee';
  const topC = {suit:'#2F2B45', chef:'#FFFFFF', pajamas:'#B9C8FF', princess:'#FFB3D1', astronaut:'#F4F4F4', dino:'#7ED957'}[O] || look.shirt;
  const pantsC = {overalls:'#4A7FD6', suit:'#2F2B45', pajamas:'#B9C8FF', astronaut:'#F4F4F4', dino:'#7ED957', kimono:look.shirt}[O] || '#5A4A6E';
  const bareLegs = O==='dress' || O==='princess';
  const shirt = M(topC), skin = M(look.skin), pants = M(bareLegs ? look.skin : pantsC), shoe = bareLegs ? M('#FF7A8A') : pants;
  const body = mesh(G.cyl(.34,.5,.72,20), shirt, 0,.74,0); rig.add(body);
  const belly = mesh(new T.SphereGeometry(.5,20,10,0,Math.PI*2,Math.PI/2,Math.PI/2), O==='overalls' ? M('#4A7FD6') : shirt, 0,.38,0); belly.scale.y=.4; rig.add(belly);
  const ex = (geo, col, x,y,z, rx=0) => { const m = mesh(geo, typeof col==='string' ? M(col) : col, x,y,z); m.rotation.x = rx; rig.add(m); return m; };
  const slope = -.22; // front of the torso leans in
  if(O==='dress') ex(G.cyl(.36,.72,.5,20), topC, 0,.3,0);
  if(O==='princess'){ ex(G.cyl(.36,.88,.62,24), '#FF8FB8', 0,.3,0); ex(G.cyl(.37,.52,.1,20), '#FFFFFF', 0,.6,0); }
  if(O==='kimono'){ ex(G.cyl(.46,.62,.5,20), topC, 0,.3,0); ex(G.cyl(.42,.47,.16,20), '#FFC94D', 0,.8,0); }
  if(O==='overalls'){ ex(G.box(.44,.3,.06), '#4A7FD6', 0,.8,.4, slope); [-1,1].forEach(s=>ex(G.box(.07,.36,.05), '#4A7FD6', s*.18,1.0,.35, slope)); }
  if(O==='suit'){ ex(G.box(.16,.3,.05), '#FFFFFF', 0,.92,.37, slope); ex(G.box(.07,.26,.05), '#FF5E6E', 0,.88,.39, slope); }
  if(O==='hoodie'){ const hd = ex(new T.SphereGeometry(.46,16,12,0,Math.PI*2,0,Math.PI*.5), M(topC,true), 0,1.16,-.3); hd.rotation.x = -.7; hd.scale.set(1,.8,1); [-1,1].forEach(s=>ex(G.cyl(.018,.018,.26,4), '#FFFFFF', s*.09,.98,.37)); }
  if(O==='pajamas') [[-.14,.9],[.16,.72],[-.05,.58]].forEach(([x,y])=>ex(G.sph(.05,8,6), '#FFD54D', x,y,.42));
  if(O==='astronaut'){ ex(G.box(.62,.7,.3), '#DCD6E8', 0,.8,-.46); const cl = ex(new T.TorusGeometry(.36,.07,8,20), '#BDB5C9', 0,1.12,0); cl.rotation.x = Math.PI/2; }
  if(O==='dino'){ const tl = ex(G.cone(.26,.9,10), '#7ED957', 0,.42,-.62); tl.rotation.x = -1.95; for(let i=0;i<4;i++) ex(G.cone(.09,.22,6), '#FFC94D', 0,.5+i*.18,-.47+i*.03, -.3); }
  const legs = [], feet = [];
  [-1,1].forEach(s=>{
    const lg = new T.Group(); lg.position.set(s*.18,.32,0);
    lg.add(mesh(G.cyl(.11,.11,.26,10), pants, 0,-.12,0));
    const ft = mesh(G.sph(.15,12,8), shoe, 0,-.24,.05); ft.scale.set(1,.6,1.35); lg.add(ft);
    rig.add(lg); legs.push(lg);
  });
  const arms = [];
  [-1,1].forEach(s=>{
    const pv = new T.Group(); pv.position.set(s*.42,1.0,0);
    const a = mesh(G.sph(.13,12,10), shirt, 0,-.22,0); a.scale.set(1,2.1,1); pv.add(a);
    pv.add(mesh(G.sph(.12,10,8), skin, 0,-.48,0));
    pv.rotation.z = s*.18; rig.add(pv); arms.push(pv);
  });
  const head = new T.Group(); head.position.y = 1.64; rig.add(head);
  head.add(mesh(G.sph(.62,28,20), skin));
  const eyeMat = M('#2A2438'), white = B('#FFFFFF'), eyes = [];
  [-1,1].forEach(s=>{
    let e;
    if(look.eyes==='smile'){ e = new T.Mesh(new T.TorusGeometry(.085,.028,6,12,Math.PI), eyeMat); e.position.set(s*.22,.02,.575); }
    else {
      const big = look.eyes==='big'; e = new T.Group(); e.position.set(s*.22,.04,.555);
      const ball = new T.Mesh(G.sph(big?.12:.09,14,10), eyeMat); ball.scale.set(1,1.3,.55); e.add(ball);
      const hl = new T.Mesh(G.sph(big?.045:.03,8,6), white); hl.position.set(s*-.03+.02,.05,.05); e.add(hl);
      if(big){ const hl2 = new T.Mesh(G.sph(.02,6,4), white); hl2.position.set(-.03,-.04,.06); e.add(hl2); }
    }
    head.add(e); eyes.push(e);
    const bl = new T.Mesh(G.sph(.1,10,8), M('#FF9AAE')); bl.position.set(s*.36,-.14,.47); bl.scale.set(1,.65,.3); bl.lookAt(bl.position.clone().multiplyScalar(2)); bl.scale.set(1,.65,.3); head.add(bl);
  });
  const mouth = new T.Mesh(new T.TorusGeometry(.1,.028,8,16,Math.PI), eyeMat); mouth.position.set(0,-.2,.575); mouth.rotation.z = Math.PI; head.add(mouth);
  head.add(buildHair(look));
  if(!acc){
    if(O==='chef'){ head.add(mesh(G.cyl(.36,.33,.36,20), M('#FFFFFF'), 0,.74,-.04)); const puff = mesh(G.sph(.44,18,12), M('#FFFFFF'), 0,1.0,-.04); puff.scale.y = .62; head.add(puff); }
    if(O==='pajamas'){ const cap = mesh(G.cone(.42,.95,16), M('#B9C8FF'), .12,.9,-.05); cap.rotation.z = -.45; head.add(cap); head.add(mesh(G.sph(.1,8,6), M('#FFFFFF'), .52,1.25,-.05)); }
    if(O==='princess'){ const tia = buildAcc('crown'); tia.scale.setScalar(.75); tia.position.y = .12; head.add(tia); }
  }
  if(O==='astronaut') head.add(new T.Mesh(G.sph(.84,24,16), new T.MeshBasicMaterial({color:'#BFEFFF', transparent:true, opacity:.22, depthWrite:false})));
  if(O==='dino') [[.66,-.05],[.5,-.42],[.18,-.64]].forEach(([y,z])=>{ const c = mesh(G.cone(.1,.24,6), M('#FFC94D'), 0,y,z); c.rotation.x = -Math.atan2(z,y)*.9; head.add(c); });
  const accSlot = new T.Group(); head.add(accSlot); accSlot.add(buildAcc(acc));
  // invisible hit volume
  const hit = new T.Mesh(G.cyl(.8,.8,2.5,8), new T.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false})); hit.position.y = 1.25; root.add(hit);
  root.traverse(o=>{ if(o.isMesh && o!==hit){ o.castShadow = true; } });
  return {root, rig, head, arms, legs, mouth, eyes, accSlot, hit};
}
function setAcc(parts, acc){ parts.accSlot.clear(); parts.accSlot.add(buildAcc(acc)); parts.accSlot.traverse(o=>{ if(o.isMesh) o.castShadow = true; }); }

const parts = [];
function burst(scn, pos, emoji, n=6, spread=.8){
  for(let i=0;i<n;i++){
    const s = sprite(bubbleTexPlain(emoji), .55, .55); s.position.copy(pos).add(new T.Vector3(rand(-spread,spread), rand(0,.4), rand(-spread,spread)));
    scn.add(s); parts.push({s, scn, v:new T.Vector3(rand(-.4,.4), rand(1.2,2.2), rand(-.4,.4)), life:1.4+Math.random()*.4, max:1.8});
  }
}
function bubbleTexPlain(emoji){ const k='P'+emoji; if(texCache[k]) return texCache[k]; const c=document.createElement('canvas'); c.width=c.height=96; const g=c.getContext('2d'); g.font='72px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(emoji,48,54); return texCache[k]=new T.CanvasTexture(c); }
const CONF_COLS = ['#FF7A8A','#FFC94D','#5CC9A7','#6FA8FF','#B48CFF'];
function confetti(scn, pos){
  for(let i=0;i<40;i++){
    const m = mesh(new T.PlaneGeometry(.18,.28), new T.MeshBasicMaterial({color:pick(CONF_COLS), side:T.DoubleSide, transparent:true}), pos.x, pos.y+2.5, pos.z, false);
    scn.add(m); parts.push({m, scn, v:new T.Vector3(rand(-3,3), rand(3,6), rand(-3,3)), life:2.2, max:2.2, spin:rand(3,9)});
  }
}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt; const o = p.s || p.m;
    if(p.s){ o.position.addScaledVector(p.v, dt); p.v.multiplyScalar(.97); o.material.opacity = clamp(p.life/.6,0,1); }
    else { p.v.y -= 9*dt; o.position.addScaledVector(p.v, dt); o.rotation.x += p.spin*dt; o.rotation.y += p.spin*.7*dt; o.material.opacity = clamp(p.life/.5,0,1); }
    if(p.life<=0){ p.scn.remove(o); if(p.m){ o.geometry.dispose(); o.material.dispose(); } else o.material.dispose(); parts.splice(i,1); }
  }
}

const EXCL = [{x:0,z:0,r:2.9},{x:6.8,z:-4.2,r:2.1},{x:0,z:-7,r:1.6}];
Object.values(LOCS).forEach(l=>{ if(l.r) EXCL.push({x:l.x, z:l.z, r:l.r}); });
// push out of obstacles and slide around them toward dest
function avoidObstacles(pos, dest, step){
  for(const e of EXCL){
    if(Math.hypot(dest.x-e.x, dest.z-e.z) < e.r) continue; // heading inside (e.g. onto the stage)
    const ex = pos.x-e.x, ez = pos.z-e.z, ed = Math.hypot(ex,ez) || .001;
    if(ed < e.r){
      pos.x = e.x + ex/ed*e.r; pos.z = e.z + ez/ed*e.r;
      const tx = -ez/ed, tz = ex/ed, dir = ((dest.x-pos.x)*tx + (dest.z-pos.z)*tz) >= 0 ? 1 : -1;
      pos.x += tx*dir*step; pos.z += tz*dir*step;
    }
  }
}
function randomSpot(){
  for(let k=0;k<30;k++){
    const a = rand(0,6.28), r = rand(3.4,11.2), x = Math.cos(a)*r, z = Math.sin(a)*r;
    if(EXCL.some(e=>Math.hypot(e.x-x,e.z-z)<e.r+.4)) continue;
    if(SLOTS.some(s=>Math.hypot(s.x-x,s.z-z)<3.1)) continue;
    return new T.Vector3(x,0,z);
  }
  return new T.Vector3(4,0,4);
}

function addFriend(a, b, delta){

function compat(a,b){ if(a.d.pers===b.d.pers) return 3; const pr=[a.d.pers,b.d.pers].sort().join(); return ({'funny,lively':3,'cool,gentle':2,'gentle,lively':2,'funny,gentle':2}[pr]||1); }
function byId(id){ return residents.find(x=>x.d.id===id); }

function isFamily(a,b){ const pa = a.d.parents||[], pb = b.d.parents||[]; return pa.includes(b.d.id) || pb.includes(a.d.id) || pa.some(x=>pb.includes(x)); }

function relName(a,b){ if(a.d.partner===b.d.id) return a.d.pType==='spouse' ? '💍 夫妻' : '💑 恋人'; if(isFamily(a,b)) return '👪 家人'; return null; }

function talk(r){
  const d = r.d, c = d.catch || '嘿嘿';
  if(r.state==='home') return `呼……呼……${c}……`;
  const w = d.want, wo = w && w.with ? byId(w.with) : null, lines = [];
  if(w && w.type==='bday') lines.push('今天是我的生日哦！');
  else if(w && w.type==='love' && wo) lines.push(`其实……我有点在意${wo.d.name}`);
  else if(w && w.type==='makeup' && wo) lines.push(`哼，我才不要先理${wo.d.name}`);
  else if(w && w.type==='propose' && wo) lines.push(`我想一辈子和${wo.d.name}在一起`);
  else if(d.full < 38) lines.push('肚子咕咕叫了……');
  else if(d.mood < 30) lines.push('今天有点不开心……');
  else {
    lines.push(...TALK[d.pers], TALK_SUB[d.pers][persSub(d.traits || traitsFor(d.pers))], `最喜欢吃${FOODS[d.fav].n}了`);
    if(d.nick) lines.push(`大家都叫我「${d.nick}」`);
    if(d.outfit && d.outfit!=='tee') lines.push(`你看我的${OUTFITS[d.outfit].n}好看吗`);
    const pt = d.partner && byId(d.partner);
    if(pt) lines.push(d.pType==='spouse' ? `和${pt.d.name}的每一天都很幸福` : `最喜欢${pt.d.name}了`, `今天想和${pt.d.name}去约会`);

    if(best && (d.friends[best.d.id]||0) >= 50) lines.push(`${best.d.name}是我的好朋友`);

}
function withCatch(line, c){ return line + (/[！？!?…~。]$/.test(line) ? '' : '，') + c; }

function startChat(a,b){

  a.chatT = 0; b.chatT = .55; sfx.chat();
}
function endChat(r, natural){
  const o = r.target; r.target = null;
  if(o && o.state==='chat' && o.target===r){
    o.target = null; o.state = 'idle'; o.timer = rand(1,2);
    const fv0 = r.d.friends[o.d.id]||0;
    if(fv0 >= 15 && (r.d.partner!==o.d.id || Math.random() < .5) && !isFamily(r,o) && !hasSocialWant(r) && !hasSocialWant(o) && Math.random() < (compat(r,o)===1 ? .1 : .04)){
      quarrel(r, o); r.state = 'idle'; r.timer = rand(1,2.5); return;
    }
    addFriend(r, o, 4 + compat(r,o) + Math.floor(rand(0,3)));
    r.d.mood = clamp(r.d.mood+4,0,100); o.d.mood = clamp(o.d.mood+4,0,100);
    if((r.d.friends[o.d.id]||0) >= 15){ const mid = r.p.root.position.clone().add(o.p.root.position).multiplyScalar(.5); mid.y = 2.6; burst(scene, mid, r.d.partner===o.d.id ? '💕' : '❤️', 2, .3); }
    // made up on their own
    const mk = (x,y)=>x.d.want && x.d.want.type==='makeup' && x.d.want.with===y.d.id;
    if(mk(r,o) || mk(o,r)){ if(mk(r,o)) r.d.want = null; if(mk(o,r)) o.d.want = null; toast(`${r.d.name} 和 ${o.d.name} 自己和好啦`); logNews(`🤝 ${r.d.name} 和 ${o.d.name} 聊着聊着就和好了`); }
    // a crush
    if((r.d.friends[o.d.id]||0) >= 80 && canRomance(r,o) && Math.random() < .3){
      const [a,b] = Math.random()<.5 ? [r,o] : [o,r];
      if(!hasSocialWant(a)){ a.d.want = {type:'love', with:b.d.id}; toast(`${a.d.name} 好像喜欢上了 ${b.d.name}！去问问吧 💘`, 'pink'); logNews(`💘 ${a.d.name} 偷偷喜欢上了 ${b.d.name}`); save(); }
    }
    if(natural && r.d.partner===o.d.id && S.hour < 18.5 && !isNight() && Math.random() < .35){ const k = pick(['cafe','park','beach','tower']); startDate(r, o, k); logNews(`💕 ${r.d.name} 和 ${o.d.name} 去${LOCS[k].n}约会了`); return; }
  }
  r.state = 'idle'; r.timer = rand(1,2.5);
}
function decide(r){
  if(isNight()){ r.state = 'walk'; r.dest = doorPoint(r.d.slot); r.onArrive = 'home'; return; }
  if(r === selected){ r.state = 'idle'; r.timer = 1; return; }
  if(festivalNow()){
    if(!r.watching){ r.watching = true; r.state = 'walk'; r.dest = plazaSpot(); r.onArrive = null; r.target = null; return; }
    r.state = 'idle'; r.timer = rand(3,5); return;
  }
  r.watching = false;
  if(Math.random() < .13){ goHang(r, pick(HANG_LOCS)); return; }
  const roll = Math.random(), chatty = .22 + ((r.d.traits && r.d.traits.social) ?? 4)*.035;
  if(roll < chatty){
    const pt = r.d.partner && byId(r.d.partner);
    if(pt && isFree(pt) && Math.random() < .5){ r.state='walk'; r.target = pt; r.dest = pt.p.root.position.clone(); r.onArrive = 'chat'; return; }
    const others = residents.filter(o=>o!==r && isFree(o));
    if(others.length){ r.state='walk'; r.target = pick(others); r.dest = r.target.p.root.position.clone(); r.onArrive = 'chat'; return; }
  }
  if(roll < .8){ r.state='walk'; r.dest = randomSpot(); r.onArrive = null; r.target = null; return; }

function plazaSpot(){ for(let k=0;k<20;k++){ const a = rand(0,6.28), rr = rand(5,7.5); const v = new T.Vector3(Math.cos(a)*rr,0,Math.sin(a)*rr); if(!EXCL.some(e=>Math.hypot(e.x-v.x,e.z-v.z)<e.r+.3)) return v; } return new T.Vector3(0,0,6); }
function angleTo(from, to){ return Math.atan2(to.x-from.x, to.z-from.z); }
function turnTo(obj, ang, k){ let d = ang - obj.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); obj.rotation.y += d*Math.min(1,k); }

function animate(r, dt, t){
  const p = r.p; const st = r.state==='script' ? (r.moving ? 'walk' : (r.pose || 'idle')) : r.state;
  let bob = 0, armA = 0, legA = 0, headTilt = 0, raise = 0;

  else if(st==='chat'){ bob = Math.abs(Math.sin(t*6+r.d.slot))*.05; headTilt = Math.sin(t*3+r.d.slot)*.12; armA = Math.sin(t*5)*.25; }
  else if(st==='happy'){ bob = Math.abs(Math.sin(t*9))*.55; raise = 2.5; }
  else if(st==='sing'){ bob = Math.abs(Math.sin(t*6))*.06; headTilt = Math.sin(t*3)*.16; }
  else if(st==='eat'){ headTilt = 0; bob = Math.abs(Math.sin(t*10))*.03; p.mouth.scale.y = 1 + Math.abs(Math.sin(t*12))*1.4; }
  else { headTilt = Math.sin(t*1.3+r.d.slot)*.06; bob = Math.sin(t*2.2+r.d.slot)*.015; }
  if(st!=='eat') p.mouth.scale.y = 1;
  p.rig.position.y = bob;
  p.head.rotation.z = headTilt;
  p.legs[0].rotation.x = legA; p.legs[1].rotation.x = -legA;
  p.arms[0].rotation.x = -armA; p.arms[1].rotation.x = armA;
  p.arms[0].rotation.z = lerp(p.arms[0].rotation.z, -.18 - raise, .2);
  p.arms[1].rotation.z = lerp(p.arms[1].rotation.z, .18 + raise, .2);
  if(st==='sing'){ p.arms[1].rotation.x = -1.9; p.mouth.scale.y = 1 + Math.abs(Math.sin(t*9))*1.3; }
  const happyFace = r.d.mood >= 35 || st==='happy' || st==='sing';
  p.mouth.rotation.z = happyFace ? Math.PI : 0; p.mouth.position.y = happyFace ? -.2 : -.27;
  const bl = p.accSlot.children[0] && p.accSlot.children[0].userData.balloon; if(bl) bl.position.y = 1.35 + Math.sin(t*2)*.08;
}
function updateResident(r, dt, t){
  const pos = r.p.root.position;
  if(r.state==='home'){ return; }
  r.timer -= dt;
  if(r.angryT > 0) r.angryT -= dt;
  if(r.state==='script'){
    r.moving = false;
    if(r.dest){
      const dx = r.dest.x-pos.x, dz = r.dest.z-pos.z, dist = Math.hypot(dx,dz);
      if(dist < .1) r.dest = null;
      else { const step = Math.min(dist, r.speed*dt); pos.x += dx/dist*step; pos.z += dz/dist*step; avoidObstacles(pos, r.dest, step); turnTo(r.p.root, Math.atan2(dx,dz), dt*8); r.moving = true; }
    } else if(r.face) turnTo(r.p.root, angleTo(pos, r.face.p.root.position), dt*6);
    else if(r.facePos) turnTo(r.p.root, angleTo(pos, r.facePos), dt*6);
  } else if(r.state==='hang'){
    const dw = r.dateWith && r.dateWith.state==='hang' ? r.dateWith : null, L = LOCS[r.hangLoc];
    if(dw) turnTo(r.p.root, angleTo(pos, dw.p.root.position), dt*5); else if(L) turnTo(r.p.root, angleTo(pos, L), dt*3);
    if(r.timer<=0) endHang(r);
  } else if(r.state==='idle'){
    if(r===selected) turnTo(r.p.root, angleTo(pos, camera.position), dt*6);
    if(r.timer<=0) decide(r);
  } else if(r.state==='walk'){
    if(r.onArrive==='chat'){
      if(!r.target || !isFree(r.target) || isNight()){ r.state='idle'; r.timer=.5; r.target=null; }
      else r.dest.copy(r.target.p.root.position);
    }
    if(r.state==='walk'){
      const dx = r.dest.x-pos.x, dz = r.dest.z-pos.z, dist = Math.hypot(dx,dz);
      const stopAt = r.onArrive==='chat' ? 1.35 : .15;
      if(dist < stopAt){
        if(r.onArrive==='chat' && r.target){ startChat(r, r.target); }
        else if(r.onArrive==='hang'){ r.state = 'hang'; r.timer = rand(6,10); r.onArrive = null; }
        else if(r.onArrive==='home'){ r.state='home'; r.p.root.visible=false; if(selected===r) closeSheet(); }
        else { r.state='idle'; r.timer = rand(1.5,4); }
      } else {
        const step = Math.min(dist, r.speed*dt); pos.x += dx/dist*step; pos.z += dz/dist*step;

        turnTo(r.p.root, Math.atan2(dx,dz), dt*8);
      }
    }
  } else if(r.state==='chat'){
    if(r.target) turnTo(r.p.root, angleTo(pos, r.target.p.root.position), dt*8);
    r.chatT -= dt; if(r.chatT<=0){ r.chatT = 1.1; r.topic = pick(CHAT_TOPICS); }
    if(r.timer<=0 || !r.target) endChat(r, true);
  } else if(r.state==='happy' || r.state==='eat'){
    if(r===selected) turnTo(r.p.root, angleTo(pos, camera.position), dt*6);
    if(r.timer<=0){ if(r.state==='eat' && r.after){ const a = r.after; r.after = null; a(); } else { r.state='idle'; r.timer = rand(1,2); } }
  }
  // bubble
  if(r.state==='script') setBubble(r, r.scriptBubble || null);
  else if(r.angryT > 0) setBubble(r, '💢');
  else if(r.state==='chat') setBubble(r, r.topic || '💬');
  else if(r.state==='happy') setBubble(r, r.happyEmoji || '💖');
  else if(r.state==='eat') setBubble(r, r.eatEmoji || '😋');
  else if(r.state==='hang') setBubble(r, r.dateWith && r.dateWith.state==='hang' ? '💕' : (LOCS[r.hangLoc]||{}).e || '💬');
  else if(r.d.lvPending) setBubble(r, '⭐', 'want');
  else if(r.d.want) setBubble(r, wantEmoji(r.d.want), 'want');
  else if(r.d.mood < 30) setBubble(r, '💧');
  else if(festivalNow() && r.state==='idle') setBubble(r, '🎆');
  else setBubble(r, null);
  r.bubble.position.y = 3.55 + Math.sin(t*3 + r.d.slot)*.08;
  animate(r, dt, t);
}
function needsTick(r, secs){
  const d = r.d;
  if(d.want && d.want.with){ const o = byId(d.want.with); if(!o || (d.want.type==='love' && !canRomance(r,o)) || (d.want.type==='propose' && d.partner!==o.d.id)) d.want = null; }
  if(r.state==='home'){ d.full = clamp(d.full - secs*.08, 0, 100); return; }
  d.full = clamp(d.full - secs*.3, 0, 100);
  const target = d.full < 25 ? 25 : (d.want ? 50 : 70);
  d.mood += (target - d.mood) * .01 * secs;
  if(d.full < 38 && (!d.want || ['pat','acc','furn','friend','play','cloth','ask'].includes(d.want.type))){ d.want = {type:'food', item: Math.random()<.5 ? d.fav : null}; }

}

function bdayText(d){ const n = (d.bday - (((S.day-1) % YEAR) + 1) + YEAR) % YEAR; return n===0 ? '今天生日' : `${n}天后生日`; }
function faceDotHtml(d, size=34){ return `<span class="face-dot" style="width:${size}px;height:${size}px;margin-top:8px;background:${d.look.skin};--hair:${d.look.hairColor}"></span>`; }

function locSpot(k){
  const L = LOCS[k];
  if(k==='beach') return new T.Vector3(13.3+rand(-1,1), 0, -13.3+rand(-1,1));
  const d = Math.hypot(L.x,L.z), ux = -L.x/d, uz = -L.z/d, px = -uz, pz = ux, off = L.r + (k==='cafe' ? 1.7 : 1.1), side = rand(-1.2,1.2);
  return new T.Vector3(L.x + ux*off + px*side, 0, L.z + uz*off + pz*side);
}
function goHang(r, k){ r.state = 'walk'; r.target = null; r.onArrive = 'hang'; r.hangLoc = k; r.dest = locSpot(k); }
function startDate(a, b, k){
  k = k || pick(['cafe','park','beach','tower']);
  [a,b].forEach(x=>{ if(x.state==='chat'){ const o = x.target; x.target = null; if(o && o.target===x && o!==a && o!==b){ o.target = null; o.state = 'idle'; o.timer = 1; } } });
  goHang(a, k); goHang(b, k); b.dest = a.dest.clone().add(new T.Vector3(rand(-1,1),0,rand(-1,1)).setLength(1));
  a.dateWith = b; b.dateWith = a;
}
function endHang(r){
  if(r.dateWith){ addFriend(r, r.dateWith, 3); r.dateWith = null; }
  r.state = 'idle'; r.timer = rand(1,2); r.hangLoc = null;
}

let show = null, musicHold = false;
const PARTY_C = new T.Vector3(0,0,7.2);
const HB = [[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],[67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2]];
function busy(){ if(ev || show){ toast('岛上正在发生一件大事，等一下哦'); return true; } return false; }
function castScript(x){
  if(x.state==='chat'){ const o = x.target; x.target = null; if(o && o.target===x){ o.target = null; o.state = 'idle'; o.timer = 1; } }
  x.state = 'script'; x.after = null; x.pose = null; x.scriptBubble = null; x.onArrive = null; x.target = null; x.angryT = 0; x.dateWith = null; x.face = null; x.facePos = null;
}
function freeCast(except){ return residents.filter(o=>!except.includes(o) && o.p.root.visible && o.state!=='home' && !inEvent(o)); }
function buildCake(){
  const g = new T.Group(), c = new T.Group(); c.position.y = .74; g.add(c);
  g.add(mesh(G.cyl(.8,.8,.08,24), M('#FFF6E6'), 0,.7,0)); g.add(mesh(G.cyl(.08,.08,.7,8), M('#C98B62'), 0,.35,0));
  c.add(mesh(G.cyl(.5,.5,.35,24), M('#FFE3EA'), 0,.18,0)); c.add(mesh(G.cyl(.36,.36,.28,24), M('#FFFFFF'), 0,.48,0)); c.add(mesh(G.cyl(.37,.37,.05,24), M('#FF8FB1'), 0,.63,0));
  const flames = [];
  ['#6FA8FF','#FFC94D','#7ED957','#B48CFF','#FF7A8A'].forEach((col,i)=>{ const a = i/5*Math.PI*2; c.add(mesh(G.cyl(.025,.025,.22,6), M(col), Math.cos(a)*.22,.74,Math.sin(a)*.22)); const f = mesh(G.sph(.05,8,6), B('#FFB347'), Math.cos(a)*.22,.9,Math.sin(a)*.22, false); f.scale.y = 1.5; c.add(f); flames.push(f); });
  g.userData.flames = flames; g.position.copy(PARTY_C); return g;
}
function partySong(){
  const words = ['祝你生日快乐','祝你生日快乐','祝你生日快乐呀','祝你生日快乐'], beat = .4, seq = [], lines = words.map(w=>[...w]);
  let at = 0, k = 0;
  lines.forEach((ln, li)=>ln.forEach((ch, pos)=>{ const [m, b] = HB[k++]; seq.push({ch, m, dur:b*beat, at, line:li, pos}); at += b*beat; }));
  return {title:'生日快乐歌', seq, lines, beat, total:at, genre:GENRES.pop};
}
function songSeq(song, d){
  const g = GENRES[song.genre] || GENRES.pop, beat = 60/g.bpm;
  const title = fillLyrics(song.title, d);
  const lines = fillLyrics(song.lyrics, d).split('\n').map(l=>[...l].filter(c=>!/[\s，。、！？,.!?~～…“”"']/.test(c)).slice(0,14)).filter(l=>l.length).slice(0,6);
  let seed = [...title].reduce((a,c)=>(a*31 + c.charCodeAt(0))>>>0, 7);
  const sr = ()=>{ seed = (seed*1103515245 + 12345)>>>0; return seed/4294967296; };
  const seq = []; let at = 0, idx = 3;
  lines.forEach((ln, li)=>{
    ln.forEach((ch, pos)=>{
      const last = pos===ln.length-1;
      idx = clamp(idx + Math.round((sr()-.5)*4), 0, g.scale.length-1);
      const dur = beat * (last ? 2 : sr() < .25 ? 1.5 : 1) * (song.genre==='rap' ? .7 : 1);
      seq.push({ch, m:60 + g.scale[last ? (li%2 ? 0 : 4) : idx], dur, at, line:li, pos}); at += dur;
    });
    at += beat;
  });
  return {title, seq, lines, beat, total:at, genre:g};
}
function playSungNote(n, voice){
  tone(mf(n.m), Math.min(.6, n.dur*.95), 'triangle', .05);
  if(!soundOn || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(n.ch); u.lang = 'zh-CN';
    u.pitch = clamp(((voice && voice.pitch) || 1) * (.55 + (n.m-60)/20), .1, 2); u.rate = clamp(((voice && voice.rate) || 1)*1.5, .5, 2.5);
    const zh = speechSynthesis.getVoices().find(v=>/zh/i.test(v.lang)); if(zh) u.voice = zh;
    speechSynthesis.speak(u);
  }catch(e){}
}
function accompany(bi, song){
  const root = [48,45,41,43][Math.floor(bi/4)%4], saw = song.genre.wave==='sawtooth';
  tone(mf(root - 12 + (bi%4===2 ? 7 : 0)), song.beat*.9, saw ? 'sawtooth' : 'triangle', saw ? .035 : .05);
  if(bi%2===0) tone(65,.12,'sine',.14); else tone(3200,.03,'square',.012);
}
function applause(){ for(let i=0;i<30;i++) tone(rand(1500,4200), .03, 'square', .012, rand(0,1.6)); }
function karaoke(lines, li, pos, title){
  const el = $('#karaoke'); if(li < 0){ el.hidden = true; return; }
  el.innerHTML = `<small>♪ ${esc(title)}</small>${(lines[li]||[]).map((c,i)=>`<span class="${i<=pos?'on':''}">${esc(c)}</span>`).join('')}`; el.hidden = false;
}
function startParty(host){
  if(busy()) return;
  if(isNight() || host.state==='home'){ toast('大家都睡了，明天再办吧'); return; }
  if(mode==='room') leaveRoom(); closeSheet(); closeModal();
  const guests = freeCast([host]).slice(0,7), all = [host, ...guests];
  all.forEach(castScript);
  const toCam = new T.Vector3(Math.sin(cam.yaw),0,Math.cos(cam.yaw)), phi = Math.atan2(toCam.z, toCam.x);
  host.dest = PARTY_C.clone().addScaledVector(toCam, -1.2); host.facePos = PARTY_C.clone();
  guests.forEach((g,i)=>{ const a = phi + Math.PI + (i+1)*Math.PI*2/(guests.length+1); g.dest = new T.Vector3(PARTY_C.x + Math.cos(a)*2.1, 0, PARTY_C.z + Math.sin(a)*2.1); g.facePos = PARTY_C.clone(); });
  const cake = buildCake(); scene.add(cake);
  show = {type:'party', host, cast:all, stage:0, t:0, cake, song:partySong(), voice:(guests[0]||host).d.voice};
  cam.goal.copy(PARTY_C); cam.distGoal = 16;
  toast(`大家都来给 ${host.d.name} 过生日啦！🎂`, 'pink');
}
function stageSpot(){ const st = LOC_G.stage; st.updateMatrixWorld(); const v = st.localToWorld(new T.Vector3(0,0,-.1)); v.y = 0; return v; }
function startConcert(host, song){
  if(busy()) return;
  if(isNight() || host.state==='home'){ toast('晚上舞台关门啦，明天再来吧'); return; }
  if(mode==='room') leaveRoom(); closeSheet();
  const aud = freeCast([host]).slice(0,6), all = [host, ...aud];
  all.forEach(castScript);
  const L = LOCS.stage, dd = Math.hypot(L.x,L.z), ux = -L.x/dd, uz = -L.z/dd, px = -uz, pz = ux, spot = stageSpot();
  host.dest = spot.clone(); host.facePos = new T.Vector3(L.x + ux*6, 0, L.z + uz*6);
  aud.forEach((x,i)=>{ const k = aud.length > 1 ? i/(aud.length-1) - .5 : 0, row = i%2; x.dest = new T.Vector3(L.x + ux*(4.3+row*1.1) + px*k*4.4, 0, L.z + uz*(4.3+row*1.1) + pz*k*4.4); x.facePos = spot.clone(); });
  show = {type:'concert', host, cast:all, stage:0, t:0, song:songSeq(song, host.d), voice:host.d.voice};
  cam.goal.set(L.x + ux*2.2, 0, L.z + uz*2.2); cam.distGoal = 17; cam.yawGoal = Math.atan2(ux, uz); cam.pitchGoal = 1.02;
  toast(`${host.d.name} 的演唱会马上开始！观众们快来 🎤`, 'gold');
}
function updateShow(dt){
  const sh = show; if(!sh) return; sh.t += dt;
  if(sh.stage===0){
    if(!sh.cast.some(x=>x.dest) || sh.t > 9){
      sh.cast.forEach(x=>{ if(x.dest){ x.p.root.position.copy(x.dest); x.dest = null; } });
      sh.stage = 1; sh.t = 0; sh.next = 0; sh.beatI = -1; musicHold = true;
      if(sh.type==='party'){ sh.host.scriptBubble = '🎂'; sh.cast.forEach(x=>{ if(x!==sh.host){ x.pose = 'chat'; x.scriptBubble = '🎵'; } }); toast('大家一起唱生日歌！🎵'); }
      else { sh.host.p.root.position.y = .35; sh.host.pose = 'sing'; sh.host.scriptBubble = '🎤'; sh.cast.forEach(x=>{ if(x!==sh.host){ x.pose = 'chat'; x.scriptBubble = '🎶'; } }); }
    }
  } else if(sh.stage===1){
    const seq = sh.song.seq;
    while(sh.next < seq.length && seq[sh.next].at <= sh.t){
      const n = seq[sh.next++]; playSungNote(n, sh.voice); karaoke(sh.song.lines, n.line, n.pos, sh.song.title);
      if(sh.type==='concert' && Math.random() < .3) burst(scene, sh.host.p.root.position.clone().setY(3.1), pick(['🎵','🎶','✨']), 1, .4);
    }
    if(sh.type==='concert'){
      const bi = Math.floor(sh.t / sh.song.beat);
      if(bi !== sh.beatI){ sh.beatI = bi; accompany(bi, sh.song); sh.cast.forEach((x,i)=>{ if(x!==sh.host){ x.scriptBubble = (bi+i)%6===0 ? '👏' : '🎶'; x.pose = (bi+i)%6===0 ? 'happy' : 'chat'; } }); }
    }
    if(sh.t > sh.song.total + .4){ sh.stage = 2; sh.t = 0; karaoke(null, -1); finishShow(); }
  } else if(sh.stage===2 && sh.t > 3.2) endShow();
}
function finishShow(){
  const sh = show, host = sh.host, others = sh.cast.filter(x=>x!==host);
  if(sh.type==='party'){
    sh.cake.userData.flames.forEach(f=>f.visible = false); confetti(scene, PARTY_C); sfx.happy(); applause();
    host.pose = 'happy'; host.scriptBubble = '🥳';
    others.forEach(g=>{ g.pose = 'happy'; g.scriptBubble = '🎁'; addFriend(host, g, 5); });

    host.pose = 'happy'; host.scriptBubble = '🌟'; host.d.mood = clamp(host.d.mood+20,0,100);
    addCoins(coins); applause(); burst(scene, host.p.root.position.clone().setY(3), '🌟', 6, 1);

  }
}
function endShow(){
  const sh = show; if(!sh) return;
  sh.cast.forEach(x=>{ x.state = 'idle'; x.timer = rand(1,2.5); x.pose = null; x.scriptBubble = null; x.face = null; x.facePos = null; x.dest = null; x.p.root.position.y = 0; });

function makeVisitor(){

const MEL = [72,0,76,79,76,0,74,72, 69,0,72,76,74,72,69,0, 65,69,72,0,74,72,69,65, 67,0,71,74,79,0,77,74,

function mnote(m, t, dur, type, vol){
  const c = actx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(mf(m), t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.015); g.gain.exponentialRampToValueAtTime(.0008, t+dur);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+dur+.05);

function musicTick(){
  const c = actx;
  if(!c || c.state!=='running' || !musicOn || !soundOn || musicHold || document.hidden || festivalNow()){ mNext = 0; return; }
  if(!musicGain){ musicGain = c.createGain(); musicGain.gain.value = .55; musicGain.connect(c.destination); }
  const h = S.hour, night = h >= 21 || h < 6, eve = h >= 18 && !night, e8 = 60/(night ? 64 : eve ? 92 : 112)/2;
  if(mNext < c.currentTime) mNext = c.currentTime + .05;
  while(mNext < c.currentTime + .35){
    const i = mStep % 64, [root, minor] = CHORDS[Math.floor(i/8) % 4], third = minor ? 3 : 4;
    if(night){
      mnote(root + 24 + [0,third,7,12,7,third,0,7][i%8], mNext, e8*2.2, 'sine', .03);
      if(i%8===0) mnote(root + 12, mNext, e8*7, 'sine', .028);
    } else {
      if(i%2===0) mnote(root + (i%4===0 ? 0 : 7), mNext, e8*1.6, 'triangle', eve ? .05 : .06);
      if(i%4===2) [0,third,7].forEach(o=>mnote(root + 12 + o, mNext, e8*.8, 'triangle', .016));

}

const pointers = new Map(); let dragMoved = false, pinchD = 0, downAt = null;

  ac(); canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragMoved = false; downAt = {x:e.clientX, y:e.clientY}; }
  if(pointers.size===2){ const [a,b] = [...pointers.values()]; pinchD = Math.hypot(a.x-b.x, a.y-b.y); dragMoved = true; }
});
canvas.addEventListener('pointermove', e=>{
  const prev = pointers.get(e.pointerId); if(!prev) return;

  if(pointers.size===1){

    if(dragMoved && mode==='island'){ cam.yawGoal = null; cam.pitchGoal = null; cam.yaw -= (cur.x-prev.x)*.008; cam.pitch = clamp(cam.pitch + (cur.y-prev.y)*.005, .35, 1.3); }

  ray.setFromCamera(ndc, camera);
  const objs = [...residents.filter(r=>r.p.root.visible).map(r=>r.p.hit), ...(visitor ? [visitor.p.hit] : []), ...Object.values(houses), ...Object.values(LOC_G), shopStand, ground];
  const hits = ray.intersectObjects(objs, true);
  for(const h of hits){
    let o = h.object; while(o && !o.userData.pick && o!==ground) o = o.parent;
    if(o===ground){ if(selected) closeSheet(); const pt = h.point; const d = Math.hypot(pt.x,pt.z); const k = d>12 ? 12/d : 1; cam.goal.set(pt.x*k,0,pt.z*k); return; }
    if(!o) continue;
    const pk = o.userData.pick;
    if(pk.type==='res'){ select(pk.r); return; }
    if(pk.type==='house'){ sfx.pop(); enterRoom(pk.r); return; }
    if(pk.type==='shop'){ sfx.pop(); openShop(); return; }
    if(pk.type==='loc'){ openLoc(pk.k); return; }
    if(pk.type==='visitor'){ sfx.pop(); openVisitor(); return; }
  }
}

/* ---------------- UI: toasts ---------------- */
function toast(msg, kind){
  const el = document.createElement('div'); el.className = 'toast' + (kind==='gold'?' gold':kind==='pink'?' pink':''); el.textContent = msg;
  const box = $('#toasts'); box.appendChild(el); while(box.children.length > 3) box.firstChild.remove();
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 400); }, 2800);
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#sheet').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || !selected) return; const r = selected, d = r.d;

  if(b.dataset.party){ sfx.pop(); startParty(r); return; }

    if(r.state!=='home') beHappy(r, wanted?'😍':'😊', 2); sfx.happy();

  }
  if(b.dataset.undress){ if(d.outfit && d.outfit!=='tee'){ S.inv.cloth[d.outfit] = (S.inv.cloth[d.outfit]||0) + 1; d.outfit = 'tee'; rebuildChar(r); save(); renderSheet(); } return; }
  if(b.dataset.confess || b.dataset.propose || b.dataset.makeup){

      if(d.want && d.want.type==='pat') fulfil(r, 15);
      renderSheet(); return;
    }
    if(a==='home'){ enterRoom(r); return; }
    if(a==='edit'){ closeSheet(); openEditor(r); return; }
    if(a==='ask'){ if(r.state==='home'){ toast(`${d.name} 在睡觉，明天再聊吧`); return; } openAsk(r, d.want && d.want.type==='ask' ? d.want.q : null); return; }
    if(a==='rps'){ if(r.state==='home'){ toast(`${d.name} 在睡觉，明天再玩吧`); return; } openRPS(r); return; }
    chooser = chooser===a ? null : a; renderSheet(); return;
  }
  if(b.dataset.feed){

    sfx.happy();
    if(wanted) fulfil(r, 40); else { toast(`${d.name} 戴上了${ACCS[k].n}`); save(); }

  if(b.dataset.intro){
    const o = residents[+b.dataset.intro]; if(!o || o.state==='home') return;
    if(r.state==='home'){ toast(`${d.name} 在睡觉，明天再介绍吧`); return; }
    chooser = null;

    toast(`${d.name} 去找 ${o.d.name} 聊天啦`);
    if(wanted) fulfil(r, 30); else save();
  }
});

/* ---------------- modals ---------------- */
function openModal(html, onClick){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog">${html}</div></div>`;
  const bg = root.firstChild;
  bg.addEventListener('click', e=>{ if(e.target===bg){ closeModal(); return; } const b = e.target.closest('button'); if(b){ if(b.dataset.close){ closeModal(); return; } onClick && onClick(b, e); } });
  bg.addEventListener('input', e=>onClick && onClick(null, e));
}
function closeModal(){ $('#modalRoot').innerHTML = ''; editorOpen = false; editing = null; }

let shopTab = 'food';
function openShop(tab){
  if(tab) shopTab = tab;
  const cat = shopTab==='food' ? FOODS : shopTab==='acc' ? ACCS : shopTab==='cloth' ? OUTFITS : FURN;
  const inv = S.inv[shopTab] = S.inv[shopTab] || {};
  const html = `<div class="modal-head"><h2>小卖部</h2><div class="coins toy" style="margin-left:auto"><span class="coin"></span>${S.coins}</div><button class="toy close" data-close="1" aria-label="关闭">×</button></div>
    <div class="tabs">${[['food','好吃的'],['acc','礼物装扮'],['cloth','衣服'],['furn','家具']].map(([k,n])=>`<button class="toy tab ${k===shopTab?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>
    <div class="shop-grid">${Object.entries(cat).filter(([k,v])=>!v.cafe && k!=='tee').map(([k,v])=>`<div class="card"><span class="ic">${v.e}</span><span class="nm">${v.n}</span><span class="own">已有 ${inv[k]||0} 个</span><button class="toy buy" data-buy="${k}" ${S.coins<v.p?'disabled':''}><span class="coin"></span>${v.p}</button></div>`).join('')}</div>
    <p style="font-size:13px;color:var(--ink-soft);margin:14px 0 0">${shopTab==='cloth' ? '买来的衣服可以在「送礼物」里给居民换上。' : shopTab==='food' ? '咖啡和奶茶要去咖啡店买哦。' : '帮居民实现愿望、交到新朋友、每天早上都能拿到金币。'}</p>`;
  openModal(html, b=>{
    if(!b) return;
    if(b.dataset.tab){ sfx.pop(); openShop(b.dataset.tab); }
    if(b.dataset.buy){ const k = b.dataset.buy, it = cat[k]; if(S.coins < it.p) return; S.coins -= it.p; inv[k] = (inv[k]||0)+1; updateCoins(); sfx.coin(); toast(`买到了${it.n}！`); save(); openShop(); }
  });
}

function openFriends(confirming){
  const cards = residents.map(r=>{
    const links = residents.filter(o=>o!==r).map(o=>({o, v:r.d.friends[o.d.id]||0})).sort((a,b)=>b.v-a.v);

      <div class="links">${links.length ? links.map(({o,v})=>{ const fl = friendLevel(v), rel = relName(r,o); if(rel) return `<span class="lk r3">${rel} · ${esc(o.d.name)}</span>`; return `<span class="lk r${fl.rank}">${fl.rank>=2?'💖 ':fl.rank===1?'🤝 ':''}${esc(o.d.name)} · ${fl.n}</span>`; }).join('') : '<span class="lk">还没有邻居</span>'}</div></div></div>`;
  }).join('');
  const html = `<div class="modal-head"><h2>好朋友</h2><button class="toy close" data-close="1" style="margin-left:auto" aria-label="关闭">×</button></div>

/* ---------------- mini game: rock paper scissors ---------------- */
function openRPS(r){
  const st = {me:0, him:0, last:null, done:false};
  if(selected) closeSheet();
  cam.goal.copy(r.p.root.position);
  const talkTo = line => { r.say = line; r.spoken = line; speakWith(r.d.voice, line); };
  const draw = ()=>{
    const L = st.last, name = esc(r.d.name);
    const msg = st.done ? (st.me > st.him ? `你赢啦！${name} 送你 30 金币` : `${name} 赢啦！陪玩奖励 15 金币`) : L ? (L.res>0 ? '这一局你赢了！' : L.res<0 ? `这一局 ${name} 赢了` : '一样的！再来一次') : '三局两胜，出拳吧！';
    openModal(`<div class="modal-head"><h2>和${name}猜拳</h2><button class="toy close" data-close="1" style="margin-left:auto" aria-label="关闭">×</button></div>

    ${sel}
    <div class="furn-row">${owned.length ? owned.map(([k,v])=>`<button class="toy item ${roomSelFurn===k?'sel':''}" data-furn="${k}"><span class="ic">${FURN[k].e}</span>${FURN[k].n}<span class="cnt">${v}</span></button>`).join('') : ''}<button class="toy item" data-shop="1"><span class="ic">🏪</span>买家具</button></div>
    <div class="room-colors"><span>墙纸</span><span class="sw-row">${WALLS.map(c=>`<button class="sw ${d.room.wall===c?'on':''}" style="background:${c}" data-wall="${c}" aria-label="墙纸 ${c}"></button>`).join('')}</span>
    <span>地板</span><span class="sw-row">${FLOORS.map(c=>`<button class="sw ${d.room.floor===c?'on':''}" style="background:${c}" data-floor="${c}" aria-label="地板 ${c}"></button>`).join('')}</span></div>`;
  el.hidden = false;
}
$('#roomBar').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || !roomRes) return; const d = roomRes.d; sfx.pop();
  if(b.dataset.back){ leaveRoom(); return; }
  if(b.dataset.dream){ showDream(roomRes); return; }
  if(b.dataset.shop){ openShop('furn'); return; }
  if(b.dataset.furn){ roomSelFurn = roomSelFurn===b.dataset.furn ? null : b.dataset.furn; roomSelItem = null; buildRoomKeepChar(); renderRoomBar(); return; }
  if(b.dataset.wall){ d.room.wall = b.dataset.wall; buildRoomKeepChar(); renderRoomBar(); save(); return; }
  if(b.dataset.floor){ d.room.floor = b.dataset.floor; buildRoomKeepChar(); renderRoomBar(); save(); return; }
  if(b.dataset.rot && roomSelItem){ roomSelItem.rot = (roomSelItem.rot+1)%4; buildRoomKeepChar(); save(); return; }
  if(b.dataset.pick && roomSelItem){ d.room.items.splice(d.room.items.indexOf(roomSelItem),1); S.inv.furn[roomSelItem.type] = (S.inv.furn[roomSelItem.type]||0)+1; roomSelItem = null; buildRoomKeepChar(); renderRoomBar(); save(); return; }
  if(b.dataset.desel){ roomSelItem = null; buildRoomKeepChar(); renderRoomBar(); }
});
function buildRoomKeepChar(){ const p = roomChar ? roomChar.root.position.clone() : null; const ry = roomChar ? roomChar.root.rotation.y : 0; buildRoom(); if(p){ roomChar.root.position.copy(p); roomChar.root.rotation.y = ry; } }
function roomTap(){
  ray.setFromCamera(ndc, roomCam);
  const hits = ray.intersectObjects(roomGroup.children, true);
  const d = roomRes.d;
  for(const h of hits){
    let o = h.object; while(o && o!==roomGroup && !o.userData.item && !o.userData.tile && !(roomChar && o===roomChar.root)) o = o.parent;
    if(!o || o===roomGroup) continue;
    if(roomChar && o===roomChar.root && roomSleeping){ showDream(roomRes); return; }
    if(roomChar && o===roomChar.root){ sfx.boing(); d.mood = clamp(d.mood+4,0,100); roomWalk.happy = 1.2; burst(roomScene, roomChar.root.position.clone().setY(2.3), '💗', 4); if(d.want && d.want.type==='pat') fulfil(roomRes, 15); return; }
    if(o.userData.item){ if(roomSelFurn) { toast('这里已经有东西啦，换一块地板吧'); return; } sfx.pop(); roomSelItem = o.userData.item; buildRoomKeepChar(); renderRoomBar(); return; }
    if(o.userData.tile){
      const {i,j} = o.userData.tile;
      if(roomSelItem && !roomSelFurn){ const occ = d.room.items.some(it=>it!==roomSelItem && it.x===i && it.z===j && (it.type==='rug')===(roomSelItem.type==='rug')); if(!occ){ roomSelItem.x = i; roomSelItem.z = j; sfx.pop(); buildRoomKeepChar(); save(); } return; }
      if(!roomSelFurn) return;
      const isRug = roomSelFurn==='rug';
      if(d.room.items.some(it=>it.x===i && it.z===j && (it.type==='rug')===isRug)){ toast('这里已经有东西啦，换一块地板吧'); return; }
      if(!(S.inv.furn[roomSelFurn] > 0)) return;
      S.inv.furn[roomSelFurn]--;
      const it = {type:roomSelFurn, x:i, z:j, rot:0}; d.room.items.push(it);
      const placed = roomSelFurn;
      if(!(S.inv.furn[roomSelFurn] > 0)) roomSelFurn = null;
      buildRoomKeepChar(); sfx.pop();
      burst(roomScene, tileOf(it).setY(1), '✨', 4, .3);
      if(d.want && d.want.type==='furn' && d.want.item===placed){ d.mood = clamp(d.mood+20,0,100); roomWalk.happy = 2; fulfil(roomRes, 40); }
      else { d.mood = clamp(d.mood+5,0,100); save(); }
      renderRoomBar();
      return;
    }
  }
}
function updateRoom(dt, t){
  if(!roomChar) return;
  const p = roomChar, w = roomWalk, pos = p.root.position;
  if(roomSleeping){ p.rig.position.y = p.sleepY + Math.sin(t*1.6)*.03; p.mouth.rotation.z = 0; if(p.zz) p.zz.position.y = p.sleepY + 1.3 + Math.sin(t*2)*.12; return; }
  let bob = Math.sin(t*2.2)*.015, legA = 0, raise = 0;
  if(w.happy > 0){ w.happy -= dt; bob = Math.abs(Math.sin(t*9))*.45; raise = 2.5; }
  else if(w.dest){
    const dx = w.dest.x-pos.x, dz = w.dest.z-pos.z, dist = Math.hypot(dx,dz);
    if(dist < .05){ w.dest = null; w.t = rand(2,5); }
    else { const st = Math.min(dist, 1.3*dt); pos.x += dx/dist*st; pos.z += dz/dist*st; turnTo(p.root, Math.atan2(dx,dz), dt*8); w.ph = (w.ph||0) + dt*6; legA = Math.sin(w.ph)*.5; bob = Math.abs(Math.sin(w.ph))*.07; }
  } else {
    w.t -= dt; turnTo(p.root, angleTo(pos, roomCam.position), dt*3);
    if(w.t<=0){ const f = freeTiles(); if(f.length){ const tt = pick(f); w.dest = new T.Vector3(tt.i-3,0,tt.j-3); } else w.t = 3; }
  }
  p.rig.position.y = bob; p.legs[0].rotation.x = legA; p.legs[1].rotation.x = -legA; p.arms[0].rotation.x = -legA; p.arms[1].rotation.x = legA;
  p.arms[0].rotation.z = lerp(p.arms[0].rotation.z, -.18-raise, .2); p.arms[1].rotation.z = lerp(p.arms[1].rotation.z, .18+raise, .2);
  const hf = roomRes.d.mood >= 35 || w.happy>0; p.mouth.rotation.z = hf ? Math.PI : 0; p.mouth.position.y = hf ? -.2 : -.27;
}
function placeRoomCam(){
  const asp = roomCam.aspect; const k = asp < 1.1 ? clamp(1.15/asp, 1, 2.1) : 1;
  const dist = 14*k; roomCam.position.set(Math.sin(roomYaw)*dist*.72, dist*.62, Math.cos(roomYaw)*dist*.72);
  roomCam.lookAt(0, asp<1.1 ? -1.4 : -.6, 0);
}

/* ---------------- world lifecycle ---------------- */
function resetWorld(state){
  residents.forEach(r=>scene.remove(r.p.root)); residents = [];
  Object.values(houses).forEach(h=>scene.remove(h)); for(const k in houses) delete houses[k];
  if(show){ if(show.cake) scene.remove(show.cake); show = null; karaoke(null,-1); musicHold = false; }
  selected = null; ev = null; cam.distGoal = null; $('#sheet').hidden = true; if(mode==='room') leaveRoom();
  S = state; S.residents.forEach(d=>addResident(d,false)); spawnVisitor(); updateCoins(); updateNewsDot(); applySky(); save();
}

function onResize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();
  roomCam.aspect = w/h; roomCam.updateProjectionMatrix();
  if(w < 600 && !onResize.done){ cam.dist = 33; }
  onResize.done = true;
}
addEventListener('resize', onResize);

/* ---------------- loop ---------------- */
const clock = new T.Clock(); let acc = 0, saveT = 0, barT = 0;
let simT = 0;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05); simT += dt; frame(dt, simT);
}
function frame(dt, t){
  tickTime(dt);
  acc += dt; if(acc >= 1){ residents.forEach(r=>needsTick(r, acc)); acc = 0; }
  saveT += dt; if(saveT > 6){ save(); saveT = 0; }
  barT += dt; if(barT > .4){ refreshBars(); barT = 0; }
  residents.forEach(r=>updateResident(r, dt, t));
  updateEvent(dt); updateShow(dt);
  wheel.rotation.z += dt*.25; cabins.forEach(c=>c.rotation.z = -wheel.rotation.z);
  if(boat.visible){ boat.position.y = -.55 + Math.sin(t*1.4)*.06; boat.rotation.z = Math.sin(t*1.1)*.05; }
  if(visitor){ visitor.p.rig.position.y = Math.sin(t*2.2)*.02; visitor.p.head.rotation.z = Math.sin(t*1.3)*.06; visitor.bubble.position.y = 3.55 + Math.sin(t*3)*.08; }
  updateParticles(dt); updateFireworks(dt);
  if(mode==='island'){
    if(selected) cam.goal.copy(selected.p.root.position);
    cam.target.lerp(cam.goal, Math.min(1, dt*3));
    if(cam.distGoal) cam.dist = lerp(cam.dist, cam.distGoal, Math.min(1, dt*2));
    if(cam.yawGoal != null){ const dy = Math.atan2(Math.sin(cam.yawGoal-cam.yaw), Math.cos(cam.yawGoal-cam.yaw)); cam.yaw += dy*Math.min(1, dt*2); if(Math.abs(dy) < .01) cam.yawGoal = null; }
    if(cam.pitchGoal != null){ cam.pitch = lerp(cam.pitch, cam.pitchGoal, Math.min(1, dt*2)); if(Math.abs(cam.pitch-cam.pitchGoal) < .01) cam.pitchGoal = null; }
    placeCamera();
    ring.visible = !!selected && selected.p.root.visible; if(ring.visible){ ring.position.x = selected.p.root.position.x; ring.position.z = selected.p.root.position.z; ring.rotation.z += dt; }
    clouds.forEach(c=>{ c.userData.a += c.userData.sp*dt; c.position.x = Math.cos(c.userData.a)*c.userData.r; c.position.z = Math.sin(c.userData.a)*c.userData.r; });
    foam.scale.setScalar(1 + Math.sin(t*1.2)*.012);
    const f = window.__fountain; f.userData.top.position.y = 2.2 + Math.sin(t*4)*.05;
    drops.forEach((d,i)=>{ d.t = (d.t + dt*.9) % 1; const a = i/drops.length*Math.PI*2; const r = d.t*1.5; d.m.position.set(Math.cos(a)*r, 2.3 + d.t*1.2 - d.t*d.t*2.4, Math.sin(a)*r); });
    renderer.render(scene, camera);
  } else {
    updateRoom(dt, t); placeRoomCam(); renderer.render(roomScene, roomCam);
  }
  if(editorOpen && pvRenderer && pvModel && document.getElementById('pv')){ pvModel.rotation.y += dt*.8; pvModel.children[0].position.y = Math.abs(Math.sin(t*2.5))*.05; pvRenderer.render(pvScene, pvCam); }
}
