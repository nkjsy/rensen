<title>心心小岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#3B3355; --ink-soft:#6E6788; --panel:#FFFBF2; --panel-2:#FFF3DE; --line:#EADFCB;
  --coral:#FF7A8A; --coral-d:#D95466; --sun:#FFC94D; --sun-d:#D9A12A; --mint:#5CC9A7; --mint-d:#389C7E;

  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:#9EE3F5;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;touch-action:none;display:block;width:100%;height:100%}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* chunky toy buttons */
.toy{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.toy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.toy[disabled]{opacity:.45;pointer-events:none}

#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 16px;pointer-events:none;z-index:5}

.brand{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:6px 14px 8px}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:.04em;color:var(--coral-d)}
.brand .clock{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:2px}
.hud-right{display:flex;gap:8px;align-items:center}
.coins{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:22px;padding:6px 14px;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:var(--sun);border:3px solid var(--sun-d);box-sizing:border-box;display:inline-block}
.icon-btn{width:48px;height:48px;font-size:22px;display:grid;place-items:center;padding:0;position:relative}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
.say{margin:10px 0 0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:15px;position:relative}
.want-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 12px;font-size:14px;color:var(--ink-soft)}
.pill-btn.hot{background:var(--sun)}
.news h3{font-family:var(--display);font-weight:400;font-size:19px;margin:6px 0 8px}
.news ul{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.news li{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px}
.dream{background:linear-gradient(#3C3F7A,#6B5FA8);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;text-align:center}
.dream .dream-ic{font-size:40px;letter-spacing:6px}
.dream p{font-size:18px;line-height:1.6;margin:10px 0 0}
.dream .bonus{font-size:13px;opacity:.85}

#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5;max-width:calc(100% - 32px)}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px 6px;min-width:74px;font-size:15px}
.dock-btn .ic{font-size:30px;line-height:1}
.dock-btn.hot{background:var(--sun)}
@media (max-width:420px){.dock-btn{min-width:0;flex:1;padding:8px 6px 6px;font-size:14px}.dock-btn .ic{font-size:26px}#dock{gap:7px;width:calc(100% - 32px)}}

#toasts{position:fixed;top:calc(88px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:30;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:8px 16px;font-family:var(--display);font-size:18px;box-shadow:0 4px 0 var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;text-align:center}
.toast.gold{background:var(--sun)}
.toast.pink{background:#FFD3DA}
.toast.out{animation:fade .4s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(-10px)}}

/* bottom sheet */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:520px;background:var(--panel);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);z-index:10;padding:14px 16px 16px;box-sizing:border-box;max-height:62%;overflow:auto;animation:rise .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet-head{display:flex;align-items:center;gap:12px}
.face-dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);flex:none;position:relative}
.face-dot::after{content:"";position:absolute;left:50%;top:-10px;width:30px;height:18px;transform:translateX(-50%);border-radius:30px 30px 6px 6px;background:var(--hair,#3B2A26)}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:2px solid var(--line);color:var(--ink-soft)}
.close{margin-left:auto;width:42px;height:42px;font-size:24px;border-radius:50%;padding:0;flex:none}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:14px 0 10px;font-size:14px}
.bar{height:14px;border-radius:99px;background:#EFE6D6;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bar.mood i{background:var(--coral)} .bar.full i{background:var(--sun)} .bar.xp i{background:var(--lilac)}
.num{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px;min-width:28px;text-align:right}
.want{display:flex;align-items:center;gap:10px;background:#FFF0C9;border:2px dashed var(--sun-d);border-radius:14px;padding:8px 12px;font-size:15px;margin-bottom:12px}
.want .big{font-size:28px}
.want.none{background:var(--panel-2);border-color:var(--line);color:var(--ink-soft)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;font-size:16px}
.act .ic{font-size:28px;line-height:1}
.act.c1{background:#FFE1B8}.act.c2{background:#FFD3DA}.act.c3{background:#D5F3E8}.act.c4{background:#DCE8FF}.act.c5{background:#EADFFF}
.chooser{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.chooser h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:18px}
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;font-size:14px;position:relative}
.item .ic{font-size:32px;line-height:1.1}

.item.sel{background:var(--sun)}
.item .fav{position:absolute;top:-8px;left:-6px;background:var(--mint);color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:11px;padding:1px 5px;font-family:var(--body)}
.empty{color:var(--ink-soft);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill-btn{padding:8px 14px;font-size:16px}

.modal-bg{position:fixed;inset:0;background:rgba(59,51,85,.35);z-index:20;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.modal{background:var(--panel);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);width:100%;max-width:620px;max-height:calc(100% - 20px);overflow:auto;padding:16px 18px 18px;box-sizing:border-box;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;color:var(--coral-d)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:6px 16px 8px;font-size:17px;border-radius:14px}
.tab.on{background:var(--mint);color:#fff}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.card{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card .ic{font-size:40px;line-height:1.1}
.card .nm{font-family:var(--display);font-size:17px}
.card .own{font-size:12px;color:var(--ink-soft)}
.buy{display:flex;align-items:center;gap:5px;padding:5px 12px 6px;font-size:16px;background:var(--sun);margin-top:4px}
.buy .coin{width:16px;height:16px;border-width:2px}

/* editor */
.editor{display:grid;grid-template-columns:220px 1fr;gap:16px}

.pv-wrap{align-self:start;background:linear-gradient(#BFEFFF,#E8FAFF);border:3px solid var(--ink);border-radius:20px;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px}
#pv{width:200px;height:200px;max-width:100%;display:block}
.opt{margin-bottom:12px}
.opt label,.opt .lb{display:block;font-family:var(--display);font-size:17px;margin-bottom:6px}
.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);padding:0;box-shadow:0 3px 0 var(--ink)}
.sw.on{outline:4px solid var(--coral);outline-offset:2px}
.chip{padding:6px 12px 7px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.chip.on{background:var(--coral);color:#fff}
.name-row{display:flex;gap:8px}
#nameInput,#catchInput{flex:1;min-width:0;font-family:var(--display);font-size:20px;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
.big-go{width:100%;padding:12px;font-size:22px;background:var(--coral);color:#fff;margin-top:6px}

.fr-list{display:flex;flex-direction:column;gap:12px}
.fr{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.fr .who{font-family:var(--display);font-size:20px}
.fr .meta{font-size:12px;color:var(--ink-soft)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lk{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--panel-2);border:2px solid var(--line)}
.lk.r1{background:#E4F6EE;border-color:#A8DEC9}.lk.r2{background:#FFE3E8;border-color:#FFB3C0}.lk.r3{background:#FFE9A8;border-color:var(--sun-d)}
.danger-zone{margin-top:18px;padding-top:12px;border-top:2px dashed var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-soft)}

/* room bar */
#roomBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:620px;background:var(--panel);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);z-index:10;padding:12px 14px 14px;box-sizing:border-box;max-height:48%;overflow:auto}
.room-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.room-top h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.room-top .hint{font-size:13px;color:var(--ink-soft);flex:1;min-width:140px}
.back{padding:6px 14px 8px;font-size:16px;background:var(--mint);color:#fff}
.furn-row{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px}
.furn-row .item{min-width:74px}
.room-colors{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:14px;align-items:center}
.room-colors .sw{width:30px;height:30px}
.sel-bar{display:flex;gap:8px;align-items:center;background:#FFF0C9;border-radius:14px;padding:8px 10px;margin-bottom:8px;font-size:15px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(f, dur=.12, type='sine', vol=.12, when=0){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
}
const sfx = {
  pop(){ tone(660,.08,'triangle',.12); tone(990,.1,'triangle',.08,.05); },
  coin(){ tone(988,.08,'square',.05); tone(1319,.18,'square',.05,.07); },
  happy(){ [523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.1,i*.08)); },
  chat(){ tone(rand(500,800),.06,'sine',.04); tone(rand(500,900),.06,'sine',.04,.08); },
  munch(){ tone(220,.05,'square',.04); tone(180,.05,'square',.04,.1); tone(240,.05,'square',.04,.2); },
  boing(){ const c=ac(); if(!soundOn||!c) return; const o=c.createOscillator(), g=c.createGain(), t=c.currentTime; o.type='sine'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(700,t+.15); g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.22); }
};

function makeGradient(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 1; const g = c.getContext('2d');
  ['#8c8c8c','#bdbdbd','#e9e9e9','#ffffff'].forEach((col,i)=>{ g.fillStyle = col; g.fillRect(i,0,1,1); });
  const t = new T.CanvasTexture(c); t.minFilter = t.magFilter = T.NearestFilter; t.generateMipmaps = false; return t;
}

// labels / bubbles textures
const texCache = {};
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function labelTex(text, bg='#FFFBF2', fg='#3B3355'){
  const k = 'L'+text+bg; if(texCache[k]) return texCache[k];
  const c = document.createElement('canvas'); c.width = 256; c.height = 72; const g = c.getContext('2d');
  g.font = 'bold 38px "PingFang SC","Microsoft YaHei",sans-serif';
  const w = Math.min(244, g.measureText(text).width + 40);
  roundRect(g,(256-w)/2,6,w,60,30); g.fillStyle = bg; g.fill(); g.lineWidth = 5; g.strokeStyle = '#3B3355'; g.stroke();
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text,128,38);
  const t = new T.CanvasTexture(c); texCache[k] = t; return t;
}
function bubbleTex(emoji, style){
  const k = 'B'+emoji+style; if(texCache[k]) return texCache[k];
  const c = document.createElement('canvas'); c.width = 128; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = style==='want' ? '#FFF0C9' : '#FFFFFF'; g.strokeStyle = style==='want' ? '#D9A12A' : '#3B3355'; g.lineWidth = 6;
  g.beginPath(); g.arc(64,56,46,0,Math.PI*2); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(52,98); g.lineTo(64,122); g.lineTo(74,98); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.arc(64,56,43,0,Math.PI*2); g.fill();
  g.font = '52px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(emoji,64,60);
  const t = new T.CanvasTexture(c); texCache[k] = t; return t;
}

/* ---------------- character builder ---------------- */
function buildHair(look){
  const g = new T.Group(), c = look.hairColor, m = M(c, true);
  const cap = (tilt=-.35, len=Math.PI*.55, r=.67) => { const h = new T.Mesh(new T.SphereGeometry(r,24,16,0,Math.PI*2,0,len), m); h.rotation.x = tilt; h.castShadow = true; return h; };
  const onSphere = (pol, az, r) => new T.Vector3(Math.sin(pol)*Math.cos(az)*r, Math.cos(pol)*r, Math.sin(pol)*Math.sin(az)*r);
  switch(look.hair){
    case 'spiky': {
      g.add(cap(-.3));
      for(let i=0;i<7;i++){ const az = i/7*Math.PI*2, dir = onSphere(.55, az, 1).applyAxisAngle(new T.Vector3(1,0,0),-.3);
        const cn = new T.Mesh(G.cone(.17,.45,8), m); cn.position.copy(dir.clone().multiplyScalar(.66)); cn.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), dir); g.add(cn); }
      const topc = new T.Mesh(G.cone(.18,.5,8), m); topc.position.set(0,.8,-.1); g.add(topc);
      break; }
    case 'buns':
      g.add(cap(-.3));
      [-1,1].forEach(s=>{ const b = new T.Mesh(G.sph(.26), m); b.position.set(s*.5,.45,-.12); b.castShadow = true; g.add(b); });
      break;
    case 'long': {
      g.add(cap(-.22));
      const back = new T.Mesh(new T.CylinderGeometry(.62,.72,1.0,24,1,true,Math.PI/2,Math.PI), m); back.position.set(0,-.4,-.02); g.add(back);
      break; }
    case 'curly':
      g.add(cap(-.35, Math.PI*.45, .64));
      [[0,0],[.5,0],[.5,1.2],[.5,2.4],[.5,3.6],[.5,4.8],[1.0,.6],[1.0,1.8],[1.0,3.0],[1.05,4.2],[1.0,5.4],[1.45,4.0],[1.45,5.0]].forEach(([p,a])=>{
        const d = onSphere(p,a,1).applyAxisAngle(new T.Vector3(1,0,0),-.4); const s = new T.Mesh(G.sph(.24,10,8), m); s.position.copy(d.multiplyScalar(.62)); g.add(s); });
      break;
    default:
      g.add(cap(-.35));
      { const f = new T.Mesh(G.sph(.2,10,8), m); f.position.set(.28,.52,.36); f.scale.set(1.3,.7,.8); g.add(f); }
  }
  return g;
}
function buildAcc(type){
  const g = new T.Group(); if(!type) return g;
  if(type==='strawhat'){ g.add(mesh(G.cyl(.95,.95,.05,24),M('#F2D16B'),0,.52,0)); g.add(mesh(G.cyl(.42,.5,.38,20),M('#F2D16B'),0,.72,0)); g.add(mesh(G.cyl(.51,.51,.1,20),M('#FF7A8A'),0,.58,0)); g.rotation.set(-.15,0,.12); }
  if(type==='crown'){ const b = new T.Mesh(new T.CylinderGeometry(.36,.36,.26,16,1,true), M('#FFD23F',true)); b.position.y=.68; g.add(b); for(let i=0;i<5;i++){ const a=i/5*6.28; g.add(mesh(G.cone(.08,.2,6),M('#FFD23F'),Math.cos(a)*.36,.88,Math.sin(a)*.36)); g.add(mesh(G.sph(.05,6,4),M('#FF7A8A'),Math.cos(a)*.37,.68,Math.sin(a)*.37)); } g.rotation.z=.12; }
  if(type==='bow'){ const p = M('#FF5E8A'); [-1,1].forEach(s=>{ const c = mesh(G.cone(.18,.36,12),p,s*.2,0,0); c.rotation.z = s*Math.PI/2; g.add(c); }); g.add(mesh(G.sph(.1),p)); g.position.set(.38,.5,.12); g.rotation.set(0,.3,.5); }
  if(type==='glasses'){ const d = M('#2A2438'); [-1,1].forEach(s=>{ const l = mesh(G.cyl(.15,.15,.04,20), d, s*.22,.06,.6); l.rotation.x=Math.PI/2; g.add(l); }); g.add(mesh(G.box(.2,.04,.04),d,0,.1,.6)); [-1,1].forEach(s=>g.add(mesh(G.box(.04,.04,.4),d,s*.37,.1,.42))); }
  if(type==='flower'){ const p = M('#FF8FB1'); for(let i=0;i<5;i++){ const a=i/5*6.28; g.add(mesh(G.sph(.1,8,6),p,Math.cos(a)*.12,Math.sin(a)*.12,0)); } g.add(mesh(G.sph(.08,8,6),M('#FFD54D'),0,0,.04)); g.position.set(-.4,.38,.36); g.rotation.y=-.6; }
  if(type==='balloon'){ const bl = mesh(G.sph(.42,16,12), M('#FF5E6E'), .95,1.35,0); bl.scale.y=1.15; g.add(bl); g.add(mesh(G.cyl(.012,.012,1.9,4), B('#3B3355'), .95,.2,0,false)); g.userData.balloon = bl; }
  return g;
}
function buildChar(look, acc){
  const root = new T.Group(), rig = new T.Group(); root.add(rig);
  const shirt = M(look.shirt), skin = M(look.skin), pants = M('#5A4A6E');
  const body = mesh(G.cyl(.34,.5,.72,20), shirt, 0,.74,0); rig.add(body);
  const belly = mesh(new T.SphereGeometry(.5,20,10,0,Math.PI*2,Math.PI/2,Math.PI/2), shirt, 0,.38,0); belly.scale.y=.4; rig.add(belly);
  const legs = [], feet = [];
  [-1,1].forEach(s=>{
    const lg = new T.Group(); lg.position.set(s*.18,.32,0);
    lg.add(mesh(G.cyl(.11,.11,.26,10), pants, 0,-.12,0));
    const ft = mesh(G.sph(.15,12,8), pants, 0,-.24,.05); ft.scale.set(1,.6,1.35); lg.add(ft);
    rig.add(lg); legs.push(lg);
  });
  const arms = [];
  [-1,1].forEach(s=>{
    const pv = new T.Group(); pv.position.set(s*.42,1.0,0);
    const a = mesh(G.sph(.13,12,10), shirt, 0,-.22,0); a.scale.set(1,2.1,1); pv.add(a);
    pv.add(mesh(G.sph(.12,10,8), skin, 0,-.48,0));
    pv.rotation.z = s*.18; rig.add(pv); arms.push(pv);
  });
  const head = new T.Group(); head.position.y = 1.64; rig.add(head);
  head.add(mesh(G.sph(.62,28,20), skin));
  const eyeMat = M('#2A2438'), white = B('#FFFFFF'), eyes = [];
  [-1,1].forEach(s=>{
    let e;
    if(look.eyes==='smile'){ e = new T.Mesh(new T.TorusGeometry(.085,.028,6,12,Math.PI), eyeMat); e.position.set(s*.22,.02,.575); }
    else {
      const big = look.eyes==='big'; e = new T.Group(); e.position.set(s*.22,.04,.555);
      const ball = new T.Mesh(G.sph(big?.12:.09,14,10), eyeMat); ball.scale.set(1,1.3,.55); e.add(ball);
      const hl = new T.Mesh(G.sph(big?.045:.03,8,6), white); hl.position.set(s*-.03+.02,.05,.05); e.add(hl);
      if(big){ const hl2 = new T.Mesh(G.sph(.02,6,4), white); hl2.position.set(-.03,-.04,.06); e.add(hl2); }
    }
    head.add(e); eyes.push(e);
    const bl = new T.Mesh(G.sph(.1,10,8), M('#FF9AAE')); bl.position.set(s*.36,-.14,.47); bl.scale.set(1,.65,.3); bl.lookAt(bl.position.clone().multiplyScalar(2)); bl.scale.set(1,.65,.3); head.add(bl);
  });
  const mouth = new T.Mesh(new T.TorusGeometry(.1,.028,8,16,Math.PI), eyeMat); mouth.position.set(0,-.2,.575); mouth.rotation.z = Math.PI; head.add(mouth);
  head.add(buildHair(look));
  const accSlot = new T.Group(); head.add(accSlot); accSlot.add(buildAcc(acc));
  // invisible hit volume
  const hit = new T.Mesh(G.cyl(.8,.8,2.5,8), new T.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false})); hit.position.y = 1.25; root.add(hit);
  root.traverse(o=>{ if(o.isMesh && o!==hit){ o.castShadow = true; } });
  return {root, rig, head, arms, legs, mouth, eyes, accSlot, hit};
}
function setAcc(parts, acc){ parts.accSlot.clear(); parts.accSlot.add(buildAcc(acc)); parts.accSlot.traverse(o=>{ if(o.isMesh) o.castShadow = true; }); }

const houses = {}; // slot -> group

function buildHouse(r){
  const s = SLOTS[r.d.slot]; if(houses[r.d.slot]) scene.remove(houses[r.d.slot]);
  const h = new T.Group();

const EXCL = [{x:0,z:0,r:2.9},{x:6.8,z:-4.2,r:2.1},{x:-6.2,z:4.2,r:1.7}];
// push out of obstacles and slide around them toward dest
function avoidObstacles(pos, dest, step){
  for(const e of EXCL){
    const ex = pos.x-e.x, ez = pos.z-e.z, ed = Math.hypot(ex,ez) || .001;
    if(ed < e.r){
      pos.x = e.x + ex/ed*e.r; pos.z = e.z + ez/ed*e.r;
      const tx = -ez/ed, tz = ex/ed, dir = ((dest.x-pos.x)*tx + (dest.z-pos.z)*tz) >= 0 ? 1 : -1;
      pos.x += tx*dir*step; pos.z += tz*dir*step;
    }
  }
}

  for(let k=0;k<30;k++){
    const a = rand(0,6.28), r = rand(3.4,11.2), x = Math.cos(a)*r, z = Math.sin(a)*r;
    if(EXCL.some(e=>Math.hypot(e.x-x,e.z-z)<e.r+.4)) continue;
    if(SLOTS.some(s=>Math.hypot(s.x-x,s.z-z)<3.1)) continue;
    return new T.Vector3(x,0,z);

function decide(r){

  if(roll < chatty){
    const pt = r.d.partner && byId(r.d.partner);
    if(pt && isFree(pt) && Math.random() < .5){ r.state='walk'; r.target = pt; r.dest = pt.p.root.position.clone(); r.onArrive = 'chat'; return; }
    const others = residents.filter(o=>o!==r && isFree(o));
    if(others.length){ r.state='walk'; r.target = pick(others); r.dest = r.target.p.root.position.clone(); r.onArrive = 'chat'; return; }
  }

  r.state = 'idle'; r.timer = rand(2,4);
}
function angleTo(from, to){ return Math.atan2(to.x-from.x, to.z-from.z); }
function turnTo(obj, ang, k){ let d = ang - obj.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); obj.rotation.y += d*Math.min(1,k); }

function animate(r, dt, t){
  const p = r.p; const st = r.state==='script' ? (r.moving ? 'walk' : (r.pose || 'idle')) : r.state;
  let bob = 0, armA = 0, legA = 0, headTilt = 0, raise = 0;
  if(st==='walk'){ r.phase += dt*r.speed*4.2; bob = Math.abs(Math.sin(r.phase))*.09; legA = Math.sin(r.phase)*.55; armA = Math.sin(r.phase)*.6; }
  else if(st==='chat'){ bob = Math.abs(Math.sin(t*6+r.d.slot))*.05; headTilt = Math.sin(t*3+r.d.slot)*.12; armA = Math.sin(t*5)*.25; }
  else if(st==='happy'){ bob = Math.abs(Math.sin(t*9))*.55; raise = 2.5; }
  else if(st==='eat'){ headTilt = 0; bob = Math.abs(Math.sin(t*10))*.03; p.mouth.scale.y = 1 + Math.abs(Math.sin(t*12))*1.4; }
  else { headTilt = Math.sin(t*1.3+r.d.slot)*.06; bob = Math.sin(t*2.2+r.d.slot)*.015; }
  if(st!=='eat') p.mouth.scale.y = 1;
  p.rig.position.y = bob;
  p.head.rotation.z = headTilt;
  p.legs[0].rotation.x = legA; p.legs[1].rotation.x = -legA;
  p.arms[0].rotation.x = -armA; p.arms[1].rotation.x = armA;
  p.arms[0].rotation.z = lerp(p.arms[0].rotation.z, -.18 - raise, .2);
  p.arms[1].rotation.z = lerp(p.arms[1].rotation.z, .18 + raise, .2);

  p.mouth.rotation.z = happyFace ? Math.PI : 0; p.mouth.position.y = happyFace ? -.2 : -.27;
  const bl = p.accSlot.children[0] && p.accSlot.children[0].userData.balloon; if(bl) bl.position.y = 1.35 + Math.sin(t*2)*.08;
}
function updateResident(r, dt, t){
  const pos = r.p.root.position;
  if(r.state==='home'){ return; }
  r.timer -= dt;
  if(r.angryT > 0) r.angryT -= dt;
  if(r.state==='script'){
    r.moving = false;
    if(r.dest){
      const dx = r.dest.x-pos.x, dz = r.dest.z-pos.z, dist = Math.hypot(dx,dz);
      if(dist < .1) r.dest = null;
      else { const step = Math.min(dist, r.speed*dt); pos.x += dx/dist*step; pos.z += dz/dist*step; avoidObstacles(pos, r.dest, step); turnTo(r.p.root, Math.atan2(dx,dz), dt*8); r.moving = true; }
    } else if(r.face) turnTo(r.p.root, angleTo(pos, r.face.p.root.position), dt*6);
  } else if(r.state==='idle'){
    if(r===selected) turnTo(r.p.root, angleTo(pos, camera.position), dt*6);
    if(r.timer<=0) decide(r);
  } else if(r.state==='walk'){
    if(r.onArrive==='chat'){
      if(!r.target || !isFree(r.target) || isNight()){ r.state='idle'; r.timer=.5; r.target=null; }
      else r.dest.copy(r.target.p.root.position);
    }
    if(r.state==='walk'){
      const dx = r.dest.x-pos.x, dz = r.dest.z-pos.z, dist = Math.hypot(dx,dz);
      const stopAt = r.onArrive==='chat' ? 1.35 : .15;
      if(dist < stopAt){
        if(r.onArrive==='chat' && r.target){ startChat(r, r.target); }
        else if(r.onArrive==='home'){ r.state='home'; r.p.root.visible=false; if(selected===r) closeSheet(); }
        else { r.state='idle'; r.timer = rand(1.5,4); }
      } else {
        const step = Math.min(dist, r.speed*dt); pos.x += dx/dist*step; pos.z += dz/dist*step;
        avoidObstacles(pos, r.dest, step);
        turnTo(r.p.root, Math.atan2(dx,dz), dt*8);
      }
    }
  } else if(r.state==='chat'){
    if(r.target) turnTo(r.p.root, angleTo(pos, r.target.p.root.position), dt*8);
    r.chatT -= dt; if(r.chatT<=0){ r.chatT = 1.1; r.topic = pick(CHAT_TOPICS); }
    if(r.timer<=0 || !r.target) endChat(r);
  } else if(r.state==='happy' || r.state==='eat'){
    if(r===selected) turnTo(r.p.root, angleTo(pos, camera.position), dt*6);
    if(r.timer<=0){ if(r.state==='eat' && r.after){ const a = r.after; r.after = null; a(); } else { r.state='idle'; r.timer = rand(1,2); } }

/* ---------------- time of day ---------------- */
function isNight(){ return S.hour >= 21 || S.hour < 6; }
const KEYS = [[0,SKY_NIGHT,.1,.25],[5,SKY_NIGHT,.1,.25],[6.5,SKY_DUSK,.55,.5],[8,SKY_DAY,.75,.65],[17,SKY_DAY,.75,.65],[19,SKY_DUSK,.5,.5],[20.5,SKY_NIGHT,.12,.28],[24,SKY_NIGHT,.1,.25]];
const tmpC = new T.Color();
function applySky(){
  const h = S.hour; let i=0; while(i<KEYS.length-2 && h>=KEYS[i+1][0]) i++;
  const a = KEYS[i], b = KEYS[i+1], k = (h-a[0])/(b[0]-a[0]);
  tmpC.copy(a[1]).lerp(b[1], k); scene.background.copy(tmpC); scene.fog.color.copy(tmpC);
  sun.intensity = lerp(a[2],b[2],k); hemi.intensity = lerp(a[3],b[3],k);
  const night = 1 - clamp((sun.intensity-.12)/.5,0,1);
  stars.material.opacity = night;
  windowMat.color.set(night > .5 ? '#FFD27A' : '#BFE8FF');
  const ang = (h-6)/15*Math.PI; sun.position.set(Math.cos(ang)*30, Math.max(8,Math.sin(ang)*35), 15);
}
let lastHourInt = null;
function tickTime(dt){
  const prev = S.hour;
  S.hour += dt * (isNight() ? .05 : .1); // 1 game hour = 10s day, 20s night
  if(S.hour >= 24) S.hour -= 24;
  if(prev < 6 && S.hour >= 6) morning();
  if(prev < 21 && S.hour >= 21) toast('天黑啦，大家都回家睡觉了。可以去他们家里看看哦', 'n');
  const night = isNight(); $('#bSleep').hidden = !night || mode!=='island';
  const hh = Math.floor(S.hour), mm = Math.floor((S.hour-hh)*60/10)*10;
  const per = hh<6?'深夜':hh<11?'早上':hh<13?'中午':hh<18?'下午':hh<21?'傍晚':'晚上';
  $('#clock').textContent = `第${S.day}天 · ${per} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  applySky();
}
function morning(){

/* ---------------- camera ---------------- */
const cam = {yaw:.6, pitch:.7, dist:25, target:new T.Vector3(0,0,0), goal:new T.Vector3(0,0,0)};
function placeCamera(){
  camera.position.set(cam.target.x + Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.dist, cam.target.y + Math.sin(cam.pitch)*cam.dist, cam.target.z + Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.dist);
  camera.lookAt(cam.target.x, cam.target.y+1, cam.target.z);
}
const pointers = new Map(); let dragMoved = false, pinchD = 0, downAt = null;
canvas.addEventListener('pointerdown', e=>{
  ac(); canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragMoved = false; downAt = {x:e.clientX, y:e.clientY}; }
  if(pointers.size===2){ const [a,b] = [...pointers.values()]; pinchD = Math.hypot(a.x-b.x, a.y-b.y); dragMoved = true; }
});
canvas.addEventListener('pointermove', e=>{
  const prev = pointers.get(e.pointerId); if(!prev) return;
  const cur = {x:e.clientX, y:e.clientY}; pointers.set(e.pointerId, cur);
  if(pointers.size===1){
    if(downAt && Math.hypot(cur.x-downAt.x, cur.y-downAt.y) > 7) dragMoved = true;
    if(dragMoved && mode==='island'){ cam.yaw -= (cur.x-prev.x)*.008; cam.pitch = clamp(cam.pitch + (cur.y-prev.y)*.005, .35, 1.3); }
    if(dragMoved && mode==='room'){ roomYaw = clamp(roomYaw - (cur.x-prev.x)*.006, .15, 1.42); }
  } else if(pointers.size===2){
    const [a,b] = [...pointers.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinchD>0 && mode==='island'){ cam.distGoal = null; cam.dist = clamp(cam.dist * pinchD/d, 12, 60); }
    pinchD = d;
  }
});
function endPointer(e){
  if(!pointers.has(e.pointerId)) return;
  const wasSingle = pointers.size===1; pointers.delete(e.pointerId);
  if(wasSingle && !dragMoved) onTap(e.clientX, e.clientY);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel', e=>{ e.preventDefault(); if(mode==='island'){ cam.distGoal = null; cam.dist = clamp(cam.dist * (1 + Math.sign(e.deltaY)*.1), 12, 60); } }, {passive:false});

const ray = new T.Raycaster(), ndc = new T.Vector2();
function onTap(x, y){
  ndc.set(x/innerWidth*2-1, -(y/innerHeight)*2+1);
  if(mode==='room'){ roomTap(); return; }
  ray.setFromCamera(ndc, camera);
  const objs = [...residents.filter(r=>r.p.root.visible).map(r=>r.p.hit), ...Object.values(houses), shopStand, ground];
  const hits = ray.intersectObjects(objs, true);
  for(const h of hits){
    let o = h.object; while(o && !o.userData.pick && o!==ground) o = o.parent;
    if(o===ground){ if(selected) closeSheet(); const pt = h.point; const d = Math.hypot(pt.x,pt.z); const k = d>12 ? 12/d : 1; cam.goal.set(pt.x*k,0,pt.z*k); return; }
    if(!o) continue;
    const pk = o.userData.pick;
    if(pk.type==='res'){ select(pk.r); return; }
    if(pk.type==='house'){ sfx.pop(); enterRoom(pk.r); return; }
    if(pk.type==='shop'){ sfx.pop(); openShop(); return; }
  }
}

function buildRoom(){
  roomGroup.clear();
  const d = roomRes.d, fl = new T.Color(d.room.floor), fl2 = fl.clone().multiplyScalar(.9);
  for(let i=0;i<7;i++) for(let j=0;j<7;j++){
    const t = mesh(G.box(1,.1,1), M('#'+((i+j)%2?fl2:fl).getHexString()), i-3,-.05,j-3, false); t.receiveShadow = true; t.userData.tile = {i,j}; roomGroup.add(t);
  }
  const wc = M(d.room.wall);
  roomGroup.add(mesh(G.box(7.2,3.4,.2), wc, 0,1.6,-3.6, false));
  roomGroup.add(mesh(G.box(.2,3.4,7.2), wc, -3.6,1.6,0, false));
  roomGroup.add(mesh(G.box(7.2,.25,.26), M('#FFFFFF'), 0,.12,-3.5, false)); roomGroup.add(mesh(G.box(.26,.25,7.2), M('#FFFFFF'), -3.5,.12,0, false));
  const win = new T.Group(); win.add(mesh(G.box(1.8,1.3,.08), M('#FFFFFF'),0,0,0,false)); win.add(mesh(G.box(1.6,1.1,.1), B(isNight()?'#3C3F7A':'#AEE6FF'),0,0,.01,false)); win.add(mesh(G.box(.06,1.1,.12), M('#FFFFFF'),0,0,.02,false)); win.add(mesh(G.box(1.6,.06,.12), M('#FFFFFF'),0,0,.02,false)); win.position.set(.6,1.9,-3.48); roomGroup.add(win);
  const frame = new T.Group(); frame.add(mesh(G.box(.08,.9,1.1),M('#C98B62'),0,0,0,false)); frame.add(mesh(G.box(.1,.75,.95),M(d.look.shirt),0,0,0,false)); frame.add(mesh(G.sph(.18,12,8),M(d.look.skin),.02,.05,0,false)); frame.position.set(-3.48,2,-.8); roomGroup.add(frame);
  d.room.items.forEach(it=>{
    const m = FB[it.type](); m.position.copy(tileOf(it)); m.rotation.y = it.rot*Math.PI/2; m.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
    m.userData.item = it; roomGroup.add(m);
    if(it===roomSelItem){ const rr = new T.Mesh(new T.RingGeometry(.5,.62,28), B('#FFC94D')); rr.rotation.x=-Math.PI/2; rr.position.copy(tileOf(it)).setY(.03); roomGroup.add(rr); }
  });
  roomChar = buildChar(d.look, d.acc); roomChar.root.scale.setScalar(.8);
  const free = freeTiles(); const sp = free.length ? pick(free) : {i:3,j:5};
  roomChar.root.position.set(sp.i-3,0,sp.j-3); roomGroup.add(roomChar.root);
  const lb = sprite(labelTex(d.name), 1.5, .42); lb.position.y = 2.7; roomChar.root.add(lb);
  roomWalk = {t:rand(1,3), dest:null};
  roomSleeping = roomRes.state==='home';
  if(roomSleeping){
    const bed = d.room.items.find(i=>i.type==='bed');
    roomChar.rig.rotation.x = -Math.PI/2; roomChar.rig.position.z = 1.05;
    if(bed){ roomChar.root.position.copy(tileOf(bed)); roomChar.root.rotation.y = bed.rot*Math.PI/2; roomChar.sleepY = .75; } else roomChar.sleepY = .3;
    const zz = sprite(bubbleTexPlain('💤'), .8, .8); zz.position.set(0, roomChar.sleepY+1.3, -.6); roomChar.root.add(zz); roomChar.zz = zz;
    lb.position.y = roomChar.sleepY + 2.1;
  }
}
function freeTiles(){ const occ = new Set(roomRes.d.room.items.filter(i=>i.type!=='rug').map(i=>i.x+','+i.z)); const out=[]; for(let i=0;i<7;i++) for(let j=0;j<7;j++) if(!occ.has(i+','+j)) out.push({i,j}); return out; }
function enterRoom(r){
  if(selected) closeSheet();
  mode = 'room'; roomRes = r; roomSelFurn = null; roomSelItem = null; roomYaw = .785;
  buildRoom(); $('#dock').hidden = true; $('#sheet').hidden = true; $('#bSleep').hidden = true; renderRoomBar(); onResize();
}
function leaveRoom(){ mode = 'island'; roomRes = null; roomGroup.clear(); $('#roomBar').hidden = true; $('#dock').hidden = false; onResize(); }
function renderRoomBar(){
  const d = roomRes.d, inv = S.inv.furn;
  const owned = Object.entries(inv).filter(([k,v])=>v>0);
  const wantF = d.want && d.want.type==='furn' ? d.want.item : null;
  let hint = roomSelFurn ? `点一块地板，把${FURN[roomSelFurn].n}放上去` : '选一件家具，再点地板摆放。拖动可以转视角';
  const sel = roomSelItem ? `<div class="sel-bar"><span>${FURN[roomSelItem.type].e} ${FURN[roomSelItem.type].n}</span><button class="toy pill-btn" data-rot="1">转一转</button><button class="toy pill-btn" data-pick="1">收起来</button><button class="toy pill-btn" data-desel="1">好了</button></div>` : '';
  const el = $('#roomBar');
  el.innerHTML = `<div class="room-top"><h2>${esc(d.name)}的家</h2><span class="hint">${roomSleeping?`${esc(d.name)} 睡得正香，点一下偷看梦境`:wantF?`${d.name} 想要一个${FURN[wantF].e}${FURN[wantF].n}！`:hint}</span>${roomSleeping?'<button class="toy pill-btn" data-dream="1">💭 偷看梦境</button>':''}<button class="toy back" data-back="1">回小岛</button></div>
    ${sel}
    <div class="furn-row">${owned.length ? owned.map(([k,v])=>`<button class="toy item ${roomSelFurn===k?'sel':''}" data-furn="${k}"><span class="ic">${FURN[k].e}</span>${FURN[k].n}<span class="cnt">${v}</span></button>`).join('') : ''}<button class="toy item" data-shop="1"><span class="ic">🏪</span>买家具</button></div>
    <div class="room-colors"><span>墙纸</span><span class="sw-row">${WALLS.map(c=>`<button class="sw ${d.room.wall===c?'on':''}" style="background:${c}" data-wall="${c}" aria-label="墙纸 ${c}"></button>`).join('')}</span>
    <span>地板</span><span class="sw-row">${FLOORS.map(c=>`<button class="sw ${d.room.floor===c?'on':''}" style="background:${c}" data-floor="${c}" aria-label="地板 ${c}"></button>`).join('')}</span></div>`;
  el.hidden = false;
}
$('#roomBar').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || !roomRes) return; const d = roomRes.d; sfx.pop();
  if(b.dataset.back){ leaveRoom(); return; }
  if(b.dataset.dream){ showDream(roomRes); return; }
  if(b.dataset.shop){ openShop('furn'); return; }
  if(b.dataset.furn){ roomSelFurn = roomSelFurn===b.dataset.furn ? null : b.dataset.furn; roomSelItem = null; buildRoomKeepChar(); renderRoomBar(); return; }
  if(b.dataset.wall){ d.room.wall = b.dataset.wall; buildRoomKeepChar(); renderRoomBar(); save(); return; }
  if(b.dataset.floor){ d.room.floor = b.dataset.floor; buildRoomKeepChar(); renderRoomBar(); save(); return; }
  if(b.dataset.rot && roomSelItem){ roomSelItem.rot = (roomSelItem.rot+1)%4; buildRoomKeepChar(); save(); return; }
  if(b.dataset.pick && roomSelItem){ d.room.items.splice(d.room.items.indexOf(roomSelItem),1); S.inv.furn[roomSelItem.type] = (S.inv.furn[roomSelItem.type]||0)+1; roomSelItem = null; buildRoomKeepChar(); renderRoomBar(); save(); return; }
  if(b.dataset.desel){ roomSelItem = null; buildRoomKeepChar(); renderRoomBar(); }
});
function buildRoomKeepChar(){ const p = roomChar ? roomChar.root.position.clone() : null; const ry = roomChar ? roomChar.root.rotation.y : 0; buildRoom(); if(p){ roomChar.root.position.copy(p); roomChar.root.rotation.y = ry; } }
function roomTap(){
  ray.setFromCamera(ndc, roomCam);
  const hits = ray.intersectObjects(roomGroup.children, true);
  const d = roomRes.d;
  for(const h of hits){
    let o = h.object; while(o && o!==roomGroup && !o.userData.item && !o.userData.tile && !(roomChar && o===roomChar.root)) o = o.parent;
    if(!o || o===roomGroup) continue;
    if(roomChar && o===roomChar.root && roomSleeping){ showDream(roomRes); return; }
    if(roomChar && o===roomChar.root){ sfx.boing(); d.mood = clamp(d.mood+4,0,100); roomWalk.happy = 1.2; burst(roomScene, roomChar.root.position.clone().setY(2.3), '💗', 4); if(d.want && d.want.type==='pat') fulfil(roomRes, 15); return; }
    if(o.userData.item){ if(roomSelFurn) { toast('这里已经有东西啦，换一块地板吧'); return; } sfx.pop(); roomSelItem = o.userData.item; buildRoomKeepChar(); renderRoomBar(); return; }
    if(o.userData.tile){
      const {i,j} = o.userData.tile;
      if(roomSelItem && !roomSelFurn){ const occ = d.room.items.some(it=>it!==roomSelItem && it.x===i && it.z===j && (it.type==='rug')===(roomSelItem.type==='rug')); if(!occ){ roomSelItem.x = i; roomSelItem.z = j; sfx.pop(); buildRoomKeepChar(); save(); } return; }
      if(!roomSelFurn) return;
      const isRug = roomSelFurn==='rug';
      if(d.room.items.some(it=>it.x===i && it.z===j && (it.type==='rug')===isRug)){ toast('这里已经有东西啦，换一块地板吧'); return; }
      if(!(S.inv.furn[roomSelFurn] > 0)) return;
      S.inv.furn[roomSelFurn]--;
      const it = {type:roomSelFurn, x:i, z:j, rot:0}; d.room.items.push(it);
      const placed = roomSelFurn;
      if(!(S.inv.furn[roomSelFurn] > 0)) roomSelFurn = null;
      buildRoomKeepChar(); sfx.pop();
      burst(roomScene, tileOf(it).setY(1), '✨', 4, .3);
      if(d.want && d.want.type==='furn' && d.want.item===placed){ d.mood = clamp(d.mood+20,0,100); roomWalk.happy = 2; fulfil(roomRes, 40); }
      else { d.mood = clamp(d.mood+5,0,100); save(); }
      renderRoomBar();
      return;
    }
  }
}
function updateRoom(dt, t){
  if(!roomChar) return;
  const p = roomChar, w = roomWalk, pos = p.root.position;
  if(roomSleeping){ p.rig.position.y = p.sleepY + Math.sin(t*1.6)*.03; p.mouth.rotation.z = 0; if(p.zz) p.zz.position.y = p.sleepY + 1.3 + Math.sin(t*2)*.12; return; }
  let bob = Math.sin(t*2.2)*.015, legA = 0, raise = 0;
  if(w.happy > 0){ w.happy -= dt; bob = Math.abs(Math.sin(t*9))*.45; raise = 2.5; }
  else if(w.dest){
    const dx = w.dest.x-pos.x, dz = w.dest.z-pos.z, dist = Math.hypot(dx,dz);
    if(dist < .05){ w.dest = null; w.t = rand(2,5); }
    else { const st = Math.min(dist, 1.3*dt); pos.x += dx/dist*st; pos.z += dz/dist*st; turnTo(p.root, Math.atan2(dx,dz), dt*8); w.ph = (w.ph||0) + dt*6; legA = Math.sin(w.ph)*.5; bob = Math.abs(Math.sin(w.ph))*.07; }
  } else {
    w.t -= dt; turnTo(p.root, angleTo(pos, roomCam.position), dt*3);
    if(w.t<=0){ const f = freeTiles(); if(f.length){ const tt = pick(f); w.dest = new T.Vector3(tt.i-3,0,tt.j-3); } else w.t = 3; }
  }
  p.rig.position.y = bob; p.legs[0].rotation.x = legA; p.legs[1].rotation.x = -legA; p.arms[0].rotation.x = -legA; p.arms[1].rotation.x = legA;
  p.arms[0].rotation.z = lerp(p.arms[0].rotation.z, -.18-raise, .2); p.arms[1].rotation.z = lerp(p.arms[1].rotation.z, .18+raise, .2);
  const hf = roomRes.d.mood >= 35 || w.happy>0; p.mouth.rotation.z = hf ? Math.PI : 0; p.mouth.position.y = hf ? -.2 : -.27;
}
function placeRoomCam(){
  const asp = roomCam.aspect; const k = asp < 1.1 ? clamp(1.15/asp, 1, 2.1) : 1;
  const dist = 14*k; roomCam.position.set(Math.sin(roomYaw)*dist*.72, dist*.62, Math.cos(roomYaw)*dist*.72);
  roomCam.lookAt(0, asp<1.1 ? -1.4 : -.6, 0);
}

/* ---------------- dock ---------------- */
$('#bNew').onclick = ()=>openEditor();
$('#bShop').onclick = ()=>{ sfx.pop(); openShop(); };
$('#bFriends').onclick = ()=>{ sfx.pop(); openFriends(false); };
$('#newsBtn').onclick = ()=>{ sfx.pop(); openNews(); };
$('#bSleep').onclick = ()=>{ sfx.pop(); S.hour = 5.99; };
$('#soundBtn').onclick = ()=>{ soundOn = !soundOn; store('xx_sound', soundOn?'1':'0'); $('#soundBtn').textContent = soundOn?'🔊':'🔈'; ac(); if(soundOn) sfx.pop(); };
$('#soundBtn').textContent = soundOn ? '🔊' : '🔈';

/* ---------------- world lifecycle ---------------- */
function resetWorld(state){
  residents.forEach(r=>scene.remove(r.p.root)); residents = [];
  Object.values(houses).forEach(h=>scene.remove(h)); for(const k in houses) delete houses[k];
  selected = null; ev = null; cam.distGoal = null; $('#sheet').hidden = true; if(mode==='room') leaveRoom();
  S = state; S.residents.forEach(d=>addResident(d,false)); updateCoins(); updateNewsDot(); applySky(); save();
}

function onResize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();
  roomCam.aspect = w/h; roomCam.updateProjectionMatrix();
  if(w < 600 && !onResize.done){ cam.dist = 33; }
  onResize.done = true;
}
addEventListener('resize', onResize);

/* ---------------- loop ---------------- */
const clock = new T.Clock(); let acc = 0, saveT = 0, barT = 0;
let simT = 0;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05); simT += dt; frame(dt, simT);
}
function frame(dt, t){
  tickTime(dt);
  acc += dt; if(acc >= 1){ residents.forEach(r=>needsTick(r, acc)); acc = 0; }
  saveT += dt; if(saveT > 6){ save(); saveT = 0; }
  barT += dt; if(barT > .4){ refreshBars(); barT = 0; }
  residents.forEach(r=>updateResident(r, dt, t));
  updateEvent(dt);
  updateParticles(dt);
  if(mode==='island'){
    if(selected) cam.goal.copy(selected.p.root.position);
    cam.target.lerp(cam.goal, Math.min(1, dt*3));
    if(cam.distGoal) cam.dist = lerp(cam.dist, cam.distGoal, Math.min(1, dt*2));
    placeCamera();
    ring.visible = !!selected && selected.p.root.visible; if(ring.visible){ ring.position.x = selected.p.root.position.x; ring.position.z = selected.p.root.position.z; ring.rotation.z += dt; }
    clouds.forEach(c=>{ c.userData.a += c.userData.sp*dt; c.position.x = Math.cos(c.userData.a)*c.userData.r; c.position.z = Math.sin(c.userData.a)*c.userData.r; });
    foam.scale.setScalar(1 + Math.sin(t*1.2)*.012);
    const f = window.__fountain; f.userData.top.position.y = 2.2 + Math.sin(t*4)*.05;
    drops.forEach((d,i)=>{ d.t = (d.t + dt*.9) % 1; const a = i/drops.length*Math.PI*2; const r = d.t*1.5; d.m.position.set(Math.cos(a)*r, 2.3 + d.t*1.2 - d.t*d.t*2.4, Math.sin(a)*r); });
    renderer.render(scene, camera);
  } else {
    updateRoom(dt, t); placeRoomCam(); renderer.render(roomScene, roomCam);
  }
  if(editorOpen && pvRenderer && pvModel && document.getElementById('pv')){ pvModel.rotation.y += dt*.8; pvModel.children[0].position.y = Math.abs(Math.sin(t*2.5))*.05; pvRenderer.render(pvScene, pvCam); }
}

/* ---------------- boot ---------------- */
S = loadState();
S.inv = Object.assign({food:{},acc:{},furn:{}}, S.inv||{});
if(!S.log) S.log = [];
S.residents.forEach(d=>{ if(!d.catch) d.catch = pick(CATCHES); if(d.partner===undefined) d.partner = null; });
S.residents.forEach(d=>addResident(d,false));
updateCoins(); updateNewsDot(); onResize(); applySky(); loop();
if(/[?&]debug\b/.test(location.search)) window.__isle = {get S(){ return S; }, get residents(){ return residents; }, get ev(){ return ev; }, step(secs){ for(let i=0;i<secs*30;i++){ simT += 1/30; frame(1/30, simT); } }, select, startEvent, morning, enterRoom, openNews, showDream, byId};
setTimeout(()=>toast('点一点小人，看看他们想要什么吧！'), 600);
setTimeout(()=>toast('点房子可以进屋装扮哦'), 3800);
setTimeout(()=>toast('居民会交朋友、吵架、谈恋爱……多留意他们的心愿 💘'), 7000);
})();
