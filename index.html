<title>Heart Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --ink:#3B3355; --ink-soft:#6E6788; --panel:#FFFBF2; --panel-2:#FFF3DE; --line:#EADFCB;
  --coral:#FF7A8A; --coral-d:#D95466; --sun:#FFC94D; --sun-d:#D9A12A; --mint:#5CC9A7; --mint-d:#389C7E;

  --display:"Fredoka","ZCOOL KuaiLe","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --body:"Nunito","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:#9EE3F5;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;touch-action:none;display:block;width:100%;height:100%}

button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* chunky toy buttons */

#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 16px;pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.brand{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:6px 14px 8px}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:.04em;color:var(--coral-d)}
.brand .clock{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:2px}
.hud-right{display:flex;gap:8px;align-items:center}
.coins{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:22px;padding:6px 14px;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:var(--sun);border:3px solid var(--sun-d);box-sizing:border-box;display:inline-block}

.tbtn{font-size:14px;white-space:nowrap;min-width:38px;padding:2px 8px 3px;border:2px solid var(--ink);border-radius:10px;background:#fff;box-shadow:0 2px 0 var(--ink)}
.tbtn.on{background:var(--sun)}
#pauseBar{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;background:var(--panel);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:15px;text-align:center;width:min(360px,calc(100% - 32px));box-sizing:border-box}
#pauseBar b{font-family:var(--display);font-weight:400;font-size:26px}

.apt{background:linear-gradient(#FFE9D6,#FFD9C2);border:3px solid var(--ink);border-radius:18px;padding:10px 10px 0;display:flex;flex-direction:column;gap:8px}
.apt.night{background:linear-gradient(#3C3F7A,#2B2D5C)}
.apt-roof{text-align:center;font-family:var(--display);font-size:18px;background:#D95466;color:#fff;border-radius:12px;padding:4px}
.apt-floor{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;border-bottom:4px solid #C98B62;padding-bottom:8px}
.apt-win{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:3px solid var(--ink);border-radius:12px;background:#BFE8FF;font-size:12px;min-width:0}
.apt.night .apt-win{background:#4A4E8A;color:#fff}
.apt.night .apt-win.lit{background:#FFD27A;color:var(--ink)}
.apt-win img{width:100%;max-width:64px;aspect-ratio:1;border-radius:10px;display:block}
.apt-name{font-family:var(--display);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.apt-need{position:absolute;top:-10px;right:-6px;font-size:20px;background:#FFF0C9;border:2px solid var(--sun-d);border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.apt-door{text-align:center;font-size:28px;line-height:1}
@media (max-width:480px){.apt-floor{grid-template-columns:repeat(3,1fr)}}
.tv{background:#3B3355;border-radius:22px;padding:14px;border:3px solid var(--ink)}
.tv-screen{position:relative;background:linear-gradient(#9EE3F5,#E8FAFF);border-radius:14px;min-height:220px;overflow:hidden;display:flex;align-items:flex-end}
.tv-anchor{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;border:4px solid #fff}

.tv-logo{position:absolute;top:10px;right:12px;background:#E8392F;color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px}
.sale{position:absolute;top:-10px;left:-6px;background:#E8392F;color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:11px;padding:1px 7px}
.card{position:relative}
.dz-wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.dz-grid{display:grid;grid-template-columns:repeat(16,1fr);width:min(320px,100%);aspect-ratio:1;border:3px solid var(--ink);border-radius:8px;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/20px 20px}

.tagbtn{cursor:pointer;font-family:var(--body)}

.dreambox{background:#FFF6D6;border:2px dashed var(--sun-d);border-radius:14px;padding:8px 12px;margin:-2px 0 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}

.book-cell.off{background:#EFE6D6;color:var(--ink-soft);border-style:dashed}

.ft-unit{display:flex;flex-direction:column;align-items:center;gap:6px}
.ft-couple{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px}

.pot{background:#fff;border:3px dashed var(--line);border-radius:14px;padding:10px 12px;margin:12px 0 4px;font-size:15px}
.card .row-btns{gap:4px}.card .pill-btn{padding:4px 8px;font-size:13px}
#updBar{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;background:#FFF6D6;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-size:17px;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.mail-list{display:grid;gap:8px}
.mail{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;background:#FFFBF2;border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;cursor:pointer}
.mail .ic{font-size:26px}.mail small{display:block;color:#6E6788}.mail.new{background:#FFE3EA}
.letter{display:flex;gap:12px;align-items:flex-start;background:repeating-linear-gradient(#FFFDF6 0 30px,#F2E3C9 30px 31px);border:2.5px solid var(--ink);border-radius:14px;padding:14px}
.letter img{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;flex:none}
.letter-body p{margin:0;line-height:31px}.letter-body .sign{text-align:right;color:#6E6788}
.modal-bg.low{place-items:end center;background:transparent;pointer-events:none}.modal-bg.low .modal{pointer-events:auto;max-height:46vh;overflow:auto}
body.photo-on #hud,body.photo-on #guide,body.photo-on #dock,body.photo-on #toasts,body.photo-on #sheet,body.photo-on #pauseBar,body.photo-on #roomBar,body.photo-on #updBar{display:none!important}
#photoMode{position:fixed;inset:0;z-index:30;pointer-events:none}
.pm-layer{position:absolute;inset:0;pointer-events:none}.pm-layer.placing{pointer-events:auto;cursor:crosshair}
.pm-st{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;line-height:1;user-select:none}
.pm-frame{position:absolute;inset:0;pointer-events:none}.pm-frame.polaroid{border:14px solid #fff;border-bottom-width:46px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.1)}.pm-frame.heart{border:12px solid #FFB3C8}
.pm-bar{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100% - 20px));box-sizing:border-box;background:rgba(255,251,242,.95);border:3px solid var(--ink);border-radius:18px;padding:8px 10px;display:grid;gap:6px;pointer-events:auto}
.pm-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pm-sk{font-size:22px;width:38px;height:38px;border-radius:10px;border:2px solid transparent;background:#fff;cursor:pointer;padding:0}.pm-sk.on{border-color:var(--ink);background:#FFE3EA}
.task-list{display:grid;gap:8px}.task{display:flex;gap:10px;align-items:center;background:#FFFBF2;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px}.task.off{opacity:.55}.task .ic{font-size:26px}.task .tx{flex:1;display:grid;gap:3px}.task small{color:#6E6788}.task .bar{display:block;height:8px;background:#EEE3D0;border-radius:6px;overflow:hidden}.task .bar i{display:block;height:100%;background:var(--coral)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}.cal-day{background:#FFFBF2;border:2px solid var(--ink);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;font-size:12px}.cal-day.today{background:#FFE3EA}.cal-day b{font-size:14px}.cal-day small{color:#6E6788}.cal-day .none{color:#A9A2BD}
.stall{margin-bottom:12px}.stall-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}.stall-head .face-dot{margin-top:0!important}.card.off{opacity:.5}
.crystal{text-align:center;padding:10px}.crystal .ball{width:130px;height:130px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#C9B6FF 40%,#7A5CD6);border:3px solid var(--ink);display:grid;place-items:center;font-size:54px;animation:orb 1.6s ease-in-out infinite;box-shadow:0 0 30px #B48CFF}.crystal .ball.done{animation:none;box-shadow:0 0 40px #FFD23F}@keyframes orb{50%{transform:scale(1.06);filter:hue-rotate(40deg)}}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
.say{margin:10px 0 0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:15px;position:relative}
.want-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 12px;font-size:14px;color:var(--ink-soft)}
.pill-btn.hot{background:var(--sun)}
.news h3{font-family:var(--display);font-weight:400;font-size:19px;margin:6px 0 8px}
.news ul{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.news li{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px}
.dream{background:linear-gradient(#3C3F7A,#6B5FA8);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;text-align:center}
.dream .dream-ic{font-size:40px;letter-spacing:6px}

.dream .bonus{font-size:13px;opacity:.85}
.lvbox{background:#EADFFF;border:2px dashed var(--lilac-d);border-radius:14px;padding:8px 12px;margin:-2px 0 12px;font-size:15px}

.text-in{flex:1;min-width:0;font-family:var(--display);font-size:18px;padding:7px 12px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
textarea.text-in{width:100%;box-sizing:border-box;min-height:100px;resize:vertical;font-size:17px;line-height:1.5}
.trait{display:grid;grid-template-columns:4.2em 1fr 4.2em;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:6px}

.pers-name{font-family:var(--display);font-size:18px;color:var(--coral-d);margin:2px 0 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}

.q-say{font-family:var(--display);font-size:20px;text-align:center;margin:6px 0 14px}
.sec{font-family:var(--display);font-size:17px;margin:12px 0 6px}
#karaoke{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(59,51,85,.9);color:#fff;border-radius:16px;padding:8px 18px;font-family:var(--display);font-size:22px;z-index:6;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;letter-spacing:.06em}

@media (max-width:420px){.dock-btn{min-width:0;flex:1;padding:8px 6px 6px;font-size:14px}.dock-btn .ic{font-size:26px}#dock{gap:7px;width:calc(100% - 32px)}}

.sheet{max-width:580px}.sheet-head > div:nth-child(2){min-width:0;flex:1}.sheet .tags{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}.sheet .tags::-webkit-scrollbar{display:none}.sheet .tag{flex:none}
.sheet .acts{gap:6px}.sheet .act{font-size:12px;padding:6px 1px 4px}.sheet .act .ic{font-size:21px}

@media (max-width:520px){.sheet-head h2{font-size:22px}}
body:has(#sheet:not([hidden])) #toasts,body:has(#roomBar:not([hidden])) #toasts{top:auto;bottom:var(--toastB,50%)}body:has(#sheet:not([hidden])) .toast,body:has(#roomBar:not([hidden])) .toast{font-size:15px;padding:5px 12px}
#guide{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);box-sizing:border-box;padding:7px 14px 8px;font-family:var(--display);font-size:16px;background:#FFF6D6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
#guide .gx{flex:none;font-size:22px;line-height:1}

@keyframes gpulse{50%{transform:translateX(-50%) scale(1.05)}}
@media (max-width:420px){#guide{bottom:calc(106px + env(safe-area-inset-bottom,0px));font-size:14px;padding:6px 12px 7px}}
.welcome-list{display:grid;gap:8px;margin:0 0 12px}.welcome-list li{list-style:none;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 12px}.streak span{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);border-radius:12px;padding:6px 2px;font-size:20px;background:#fff}.streak small{font-size:10px;color:var(--ink-soft)}.streak .got{background:#FFE9A8;border-color:var(--sun-d)}.streak .now{outline:3px solid var(--coral);outline-offset:1px}
.set-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--ink-soft)}.set-row .tbtn{font-family:var(--display);color:var(--ink)}

let actx = null;
let audioOut = null;
function ac(){
  if(!actx){ try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    // soft master chain: gentle low-pass + compressor + a touch of room echo, so nothing sounds harsh
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200; lp.Q.value = .5;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
    const dl = actx.createDelay(); dl.delayTime.value = .09; const fb = actx.createGain(); fb.gain.value = .18; const wet = actx.createGain(); wet.gain.value = .16;
    lp.connect(comp); comp.connect(actx.destination);
    lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(comp);
    audioOut = lp;
  }catch(e){} }
  if(actx && actx.state==='suspended' && !document.hidden && document.hasFocus()) try{ actx.resume(); }catch(e){}
  return actx;
}
function tone(f, dur=.12, type='sine', vol=.12, when=0, glide=0){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f*glide), t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.012); g.gain.exponentialRampToValueAtTime(.001, t+dur);

  if(!soundOn) return; const c = ac(); if(!c) return;
  const t = c.currentTime + when, n = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, n, c.sampleRate), ch = buf.getChannelData(0);

let zhVoices = [];
const GOOD_VOICE = /natural|neural|online|enhanced|premium/i, CANTONESE = /^$/;
function loadVoices(){
  if(!window.speechSynthesis) return;
  const zh = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const score = v => (GOOD_VOICE.test(v.name) ? 0 : 10) + (/en[-_]US/i.test(v.lang) ? 0 : /en[-_](GB|AU|CA)/i.test(v.lang) ? 1 : 3) + (CANTONESE.test(v.lang + v.name) ? 5 : 0);
  zhVoices = zh.sort((a,b)=>score(a)-score(b));
}

  const key = Object.keys(VOICE_CN).find(k=>v.name.toLowerCase().includes(k));
  if(key) return VOICE_CN[key];
  const n = v.name.replace(/Microsoft|Google|Apple|Online|Natural|Enhanced|Premium|\(.*?\)|- ?English.*$/gi,' ').replace(/\s+/g,' ').trim();
  return n || ('Voice ' + (i+1));
}
// known male voices (Microsoft / Edge neural / Apple); everything else is treated as female, which most Chinese voices are
const MALE_VOICE = /david|mark|guy|davis|tony|jason|eric|roger|steffan|christopher|andrew|brian|ryan|thomas|william|liam|daniel|alex|fred|ralph|aaron|arthur|oliver|george|\bmale\b/i;
function voiceGender(v){ return MALE_VOICE.test(v.name) ? 'm' : 'f'; }
function voicesFor(g){ const m = zhVoices.filter(v=>voiceGender(v)===g); return m; }
function pickVoice(voice){
  if(!zhVoices.length) return null;
  const g = (voice && voice.g) || 'f';
  if(voice && voice.name){ const v = zhVoices.find(x=>x.name===voice.name); if(v && voiceGender(v)===g) return v; }
  // no explicit choice: spread residents over the good Mandarin voices of their gender by their voice seed
  const mand = zhVoices.filter(v=>!CANTONESE.test(v.lang + v.name));
  let pool = mand.filter(v=>voiceGender(v)===g);
  if(!pool.length) pool = mand.length ? mand : zhVoices; // no voice of that gender on this device: fall back, natPitch shifts it
  const best = pool.filter(v=>GOOD_VOICE.test(v.name)), use = best.length >= 2 ? best : pool;

function natPitch(v){

function speakWith(voice, text){
  if(!soundOn || !window.speechSynthesis || !text || document.hidden || !document.hasFocus()) return;
  const clean = speechText(text); if(!clean) return;

function makeGradient(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 1; const g = c.getContext('2d');
  ['#8c8c8c','#bdbdbd','#e9e9e9','#ffffff'].forEach((col,i)=>{ g.fillStyle = col; g.fillRect(i,0,1,1); });
  const t = new T.CanvasTexture(c); t.minFilter = t.magFilter = T.NearestFilter; t.generateMipmaps = false; return t;
}
const GRAD = makeGradient();
const matCache = {};
function M(color, double){ const k = color + (double?'d':''); if(!matCache[k]) matCache[k] = new T.MeshToonMaterial({color, gradientMap:GRAD, side: double?T.DoubleSide:T.FrontSide}); return matCache[k]; }
function B(color){ const k='b'+color; if(!matCache[k]) matCache[k] = new T.MeshBasicMaterial({color}); return matCache[k]; }
function mesh(geo, mat, x=0,y=0,z=0, shadow=true){ const m = new T.Mesh(geo, mat); m.position.set(x,y,z); if(shadow){ m.castShadow = true; m.receiveShadow = true; } return m; }

// merge static decoration into one mesh per material: hundreds of trees become a few draw calls
const STATIC = [];
function mergeStatic(){
  if(!STATIC.length) return;
  const byMat = new Map();
  STATIC.splice(0).forEach(o=>{
    o.updateMatrixWorld(true);
    o.traverse(m=>{ if(!m.isMesh) return;
      const g = (m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone()); g.applyMatrix4(m.matrixWorld);
      const k = m.material.uuid + (m.castShadow ? 's' : '');
      if(!byMat.has(k)) byMat.set(k, {mat:m.material, cast:m.castShadow, geos:[]}); byMat.get(k).geos.push(g); });
    if(o.parent) o.parent.remove(o);
  });
  byMat.forEach(({mat, cast, geos})=>{
    let n = 0; geos.forEach(g=>n += g.attributes.position.count);
    const pos = new Float32Array(n*3), nor = new Float32Array(n*3); let off = 0;
    geos.forEach(g=>{ pos.set(g.attributes.position.array, off*3); nor.set(g.attributes.normal.array, off*3); off += g.attributes.position.count; g.dispose(); });
    const mg = new T.BufferGeometry(); mg.setAttribute('position', new T.BufferAttribute(pos,3)); mg.setAttribute('normal', new T.BufferAttribute(nor,3)); mg.computeBoundingSphere();
    const mm = new T.Mesh(mg, mat); mm.castShadow = cast; mm.receiveShadow = true; scene.add(mm);
  });
}
function mergeLocal(group){
  const byMat = new Map(), keep = [];
  group.children.slice().forEach(m=>{
    if(!m.isMesh || m.userData.noMerge){ keep.push(m); return; }
    m.updateMatrix(); const g = (m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone()); g.applyMatrix4(m.matrix);
    const k = m.material.uuid + (m.castShadow ? 's' : '');
    if(!byMat.has(k)) byMat.set(k, {mat:m.material, cast:m.castShadow, geos:[]}); byMat.get(k).geos.push(g); group.remove(m);
  });
  byMat.forEach(({mat, cast, geos})=>{
    let n = 0; geos.forEach(g=>n += g.attributes.position.count);
    const pos = new Float32Array(n*3), nor = new Float32Array(n*3); let off = 0;
    geos.forEach(g=>{ pos.set(g.attributes.position.array, off*3); nor.set(g.attributes.normal.array, off*3); off += g.attributes.position.count; g.dispose(); });
    const mg = new T.BufferGeometry(); mg.setAttribute('position', new T.BufferAttribute(pos,3)); mg.setAttribute('normal', new T.BufferAttribute(nor,3)); mg.computeBoundingSphere();
    const mm = new T.Mesh(mg, mat); mm.castShadow = cast; mm.receiveShadow = true; group.add(mm);
  });
  return group;
}

// labels / bubbles textures
const texCache = {};
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function labelTex(text, bg='#FFFBF2', fg='#3B3355'){
  const k = 'L'+text+bg; if(texCache[k]) return texCache[k];
  const c = document.createElement('canvas'); c.width = 256; c.height = 72; const g = c.getContext('2d');
  let fz = 38; g.font = 'bold 38px "PingFang SC","Microsoft YaHei",sans-serif';
  while(g.measureText(text).width > 212 && fz > 18){ fz -= 2; g.font = `bold ${fz}px "PingFang SC","Microsoft YaHei",sans-serif`; }
  const w = Math.min(244, g.measureText(text).width + 40);
  roundRect(g,(256-w)/2,6,w,60,30); g.fillStyle = bg; g.fill(); g.lineWidth = 5; g.strokeStyle = '#3B3355'; g.stroke();
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text,128,38);
  const t = new T.CanvasTexture(c); texCache[k] = t; return t;
}
function bubbleTex(emoji, style){
  const k = 'B'+emoji+style; if(texCache[k]) return texCache[k];
  const c = document.createElement('canvas'); c.width = 128; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = style==='want' ? '#FFF0C9' : '#FFFFFF'; g.strokeStyle = style==='want' ? '#D9A12A' : '#3B3355'; g.lineWidth = 6;
  g.beginPath(); g.arc(64,56,46,0,Math.PI*2); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(52,98); g.lineTo(64,122); g.lineTo(74,98); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.arc(64,56,43,0,Math.PI*2); g.fill();
  g.font = '52px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(emoji,64,60);
  const t = new T.CanvasTexture(c); texCache[k] = t; return t;
}

/* ---------------- character builder ---------------- */
function buildHair(look){
  const g = new T.Group(), c = look.hairColor, m = M(c, true);
  const cap = (tilt=-.35, len=Math.PI*.55, r=.67) => { const h = new T.Mesh(new T.SphereGeometry(r,24,16,0,Math.PI*2,0,len), m); h.rotation.x = tilt; h.castShadow = true; return h; };
  const onSphere = (pol, az, r) => new T.Vector3(Math.sin(pol)*Math.cos(az)*r, Math.cos(pol)*r, Math.sin(pol)*Math.sin(az)*r);
  switch(look.hair){
    case 'spiky': {
      g.add(cap(-.3));
      for(let i=0;i<7;i++){ const az = i/7*Math.PI*2, dir = onSphere(.55, az, 1).applyAxisAngle(new T.Vector3(1,0,0),-.3);
        const cn = new T.Mesh(G.cone(.17,.45,8), m); cn.position.copy(dir.clone().multiplyScalar(.66)); cn.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), dir); g.add(cn); }
      const topc = new T.Mesh(G.cone(.18,.5,8), m); topc.position.set(0,.8,-.1); g.add(topc);
      break; }
    case 'buns':
      g.add(cap(-.3));
      [-1,1].forEach(s=>{ const b = new T.Mesh(G.sph(.26), m); b.position.set(s*.5,.45,-.12); b.castShadow = true; g.add(b); });
      break;
    case 'long': {
      g.add(cap(-.22));
      const back = new T.Mesh(new T.CylinderGeometry(.62,.72,1.0,24,1,true,Math.PI/2,Math.PI), m); back.position.set(0,-.4,-.02); g.add(back);
      break; }
    case 'curly':
      g.add(cap(-.35, Math.PI*.45, .64));
      [[0,0],[.5,0],[.5,1.2],[.5,2.4],[.5,3.6],[.5,4.8],[1.0,.6],[1.0,1.8],[1.0,3.0],[1.05,4.2],[1.0,5.4],[1.45,4.0],[1.45,5.0]].forEach(([p,a])=>{
        const d = onSphere(p,a,1).applyAxisAngle(new T.Vector3(1,0,0),-.4); const s = new T.Mesh(G.sph(.24,10,8), m); s.position.copy(d.multiplyScalar(.62)); g.add(s); });
      break;
    case 'bob': {
      g.add(cap(-.28));
      const back = new T.Mesh(new T.CylinderGeometry(.66,.7,.5,24,1,true,Math.PI*.35,Math.PI*1.3), m); back.position.set(0,-.12,-.02); g.add(back);
      break; }
    case 'ponytail': {
      g.add(cap(-.3));
      g.add(mesh(G.sph(.12,10,8), M('#FF7A8A'), 0,.3,-.64));
      // a long, tapering tail that swings down past the shoulders
      const curve = new T.CatmullRomCurve3([[0,.3,-.7],[0,.05,-.9],[0,-.35,-.98],[0,-.8,-.9],[0,-1.2,-.8],[0,-1.45,-.74]].map(a=>new T.Vector3(...a)));
      for(let i=0;i<=22;i++){ const t = i/22, r = .2 - .15*t*t + .02*Math.sin(t*Math.PI), b = new T.Mesh(G.sph(r,12,10), m); b.position.copy(curve.getPoint(t)); b.scale.set(1,1.1,.85); b.castShadow = true; g.add(b); }
      break; }
    case 'midpart': {
      g.add(cap(-.3));
      // 八字刘海: bangs parted in the middle, sweeping out to both sides, with long side locks
      [-1,1].forEach(s=>{
        const sw = new T.Mesh(G.sph(.3,16,12), m); sw.position.set(s*.2,.44,.4); sw.scale.set(1.35,.42,.7); sw.rotation.set(-.3,0,s*-.55); g.add(sw);
        const lock = new T.Mesh(G.sph(.16,12,10), m); lock.position.set(s*.5,.08,.3); lock.scale.set(.75,2.2,.8); lock.rotation.z = s*.12; g.add(lock);
        const tip = new T.Mesh(G.sph(.1,10,8), m); tip.position.set(s*.53,-.28,.26); tip.scale.set(.9,1.4,.9); g.add(tip);
      });
      const back = new T.Mesh(new T.CylinderGeometry(.63,.7,.8,24,1,true,Math.PI*.55,Math.PI*.9), m); back.position.set(0,-.25,-.02); g.add(back);
      break; }
    case 'twintails':
      g.add(cap(-.3));
      [-1,1].forEach(s=>{ g.add(mesh(G.sph(.08,8,6), M('#FF7A8A'), s*.6,.18,-.18)); const t = new T.Mesh(G.sph(.16,12,10), m); t.position.set(s*.72,-.2,-.22); t.scale.set(1,2.4,1); t.rotation.z = s*.25; g.add(t); });
      break;
    case 'afro':
      g.add(cap(-.35, Math.PI*.5, .68));
      for(let p=0;p<3;p++) for(let i=0;i<9;i++){ const pol = .15 + p*.5, az = i/9*Math.PI*2 + p*.3; const d = onSphere(pol, az, 1).applyAxisAngle(new T.Vector3(1,0,0),-.45);
        if(d.z > .55 && d.y < .55) continue; const s = new T.Mesh(G.sph(.3,10,8), m); s.position.copy(d.multiplyScalar(.72)); g.add(s); }
      break;
    case 'mohawk': {
      g.add(cap(-.35, Math.PI*.18, .64));
      for(let i=0;i<6;i++){ const t = -.45 + i*.38, dir = new T.Vector3(0, Math.cos(t), -Math.sin(t));
        const cn = new T.Mesh(G.cone(.13,.42,8), m); cn.position.copy(dir.clone().multiplyScalar(.62)); cn.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), dir); cn.scale.set(.55,1,1); g.add(cn); }
      break; }
    case 'bald':
      break;
    case 'bangs': {
      g.add(cap(-.3));
      const fr = new T.Mesh(new T.SphereGeometry(.665,24,8,Math.PI*.18,Math.PI*.64,Math.PI*.2,Math.PI*.2), m); g.add(fr); // front band over the forehead
      const back = new T.Mesh(new T.CylinderGeometry(.65,.68,.3,24,1,true,Math.PI*.4,Math.PI*1.2), m); back.position.set(0,.02,-.02); g.add(back);
      break; }
    case 'sidepart': {
      g.add(cap(-.33));
      const sw = new T.Mesh(G.sph(.3,12,10), m); sw.position.set(-.16,.5,.4); sw.scale.set(1.6,.55,.75); sw.rotation.z = .35; g.add(sw);
      break; }
    default:
      g.add(cap(-.35));
      { const f = new T.Mesh(G.sph(.2,10,8), m); f.position.set(.28,.52,.36); f.scale.set(1.3,.7,.8); g.add(f); }
  }
  return g;
}
/* ---------------- painted face & clothing patterns ---------------- */
// The face is painted onto a thin shell just in front of the head, so eyes, brows, blush and face paint can be drawn in fine detail.
const FACE_R = .626, FACE_SPAN = 1.8, FT = 512, FK = FT/(FACE_SPAN*FACE_R); // FK: canvas px per head unit
const texCache2 = {};
function facePx(hx, hy){
  const th = Math.acos(clamp(hy/FACE_R,-1,1)), st = Math.max(.2, Math.sin(th)), ph = Math.acos(clamp(-hx/(FACE_R*st),-1,1)), a0 = Math.PI/2 - FACE_SPAN/2;
  return [(ph-a0)/FACE_SPAN*FT, (th-a0)/FACE_SPAN*FT];
}
function mixHex(a, b, k){ const c = new T.Color(a).lerp(new T.Color(b), k); return '#' + c.getHexString(); }
function rgba(hex, a){ const c = new T.Color(hex); return `rgba(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)},${a})`; }
// filled stroke that tapers from w0 to w1 along a quadratic curve p0→p1(control)→p2
function taper(g, p0, p1, p2, w0, w1, wm){
  const N = 16, L = [], R = [];
  for(let i=0;i<=N;i++){
    const t = i/N, u = 1-t;
    const x = u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], y = u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1];
    const dx = 2*u*(p1[0]-p0[0]) + 2*t*(p2[0]-p1[0]), dy = 2*u*(p1[1]-p0[1]) + 2*t*(p2[1]-p1[1]), l = Math.hypot(dx,dy) || 1;
    const w = (wm==null ? w0 + (w1-w0)*t : (t<.5 ? w0 + (wm-w0)*t*2 : wm + (w1-wm)*(t-.5)*2))/2;
    L.push([x - dy/l*w, y + dx/l*w]); R.push([x + dy/l*w, y - dx/l*w]);
  }
  g.beginPath(); g.moveTo(L[0][0], L[0][1]); L.forEach(p=>g.lineTo(p[0],p[1])); R.reverse().forEach(p=>g.lineTo(p[0],p[1])); g.closePath(); g.fill();
}

const EXCL = [{x:0,z:0,r:2.9},{x:6.8,z:-4.2,r:2.1},{x:0,z:-7,r:1.6}];

// push out of obstacles and slide around them toward dest
function avoidObstacles(pos, dest, step){
  for(const e of EXCL){
    if(Math.hypot(dest.x-e.x, dest.z-e.z) < e.r) continue; // heading inside (e.g. onto the stage)
    const ex = pos.x-e.x, ez = pos.z-e.z, ed = Math.hypot(ex,ez) || .001;
    if(ed < e.r){
      pos.x = e.x + ex/ed*e.r; pos.z = e.z + ez/ed*e.r;
      const tx = -ez/ed, tz = ex/ed, dir = ((dest.x-pos.x)*tx + (dest.z-pos.z)*tz) >= 0 ? 1 : -1;
      pos.x += tx*dir*step; pos.z += tz*dir*step;
    }
  }
}
function randomSpot(){
  for(let k=0;k<30;k++){
    const a = rand(0,6.28), r = rand(3.4, S && S.isleLevel ? isleR - 3 : 11.2), x = Math.cos(a)*r, z = Math.sin(a)*r;
    if(EXCL.some(e=>Math.hypot(e.x-x,e.z-z)<e.r+.4)) continue;
    if(SLOTS.some(s=>Math.hypot(s.x-x,s.z-z)<3.1)) continue;
    return new T.Vector3(x,0,z);

}

    if(d.nick) lines.push(`Everyone calls me "${d.nick}"`);
    if(d.outfit && d.outfit!=='tee') lines.push(`Do you like my ${OUTFITS[d.outfit].n}?`);
    const pt = d.partner && byId(d.partner);
    if(pt) lines.push(d.pType==='spouse' ? `Every day with ${pt.d.name} makes me so happy` : `I love ${pt.d.name} the most`, `I want to go on a date with ${pt.d.name} today`);
    if(d.kid){ const a = kidAge(d); lines.length = 0; if(a < 1) lines.push('Goo goo gaa gaa~','(chews on fingers)','Ah — ba ba!'); else if(a < 3) lines.push('Hug me!','Wanna eat yum yums','Mom and Dad are the best'); else if(a < 12) lines.push('When I grow up I\'ll be island chief!', parentsLine(d), 'I learned something new at school today', 'Let\'s play hide and seek'); else lines.push('So much homework...', 'I\'m not a little kid anymore!', 'Someday I want to travel the world'); }
    const best = residents.filter(o=>o!==r && !isFamily(r,o)).sort((x,y)=>(d.friends[y.d.id]||0)-(d.friends[x.d.id]||0))[0];
    if(best && (!d.kid || kidAge(d) >= 3) && (d.friends[best.d.id]||0) >= 50) lines.push(`${best.d.name} is my good friend`);
  }
  if(!d.kid && !w && fortuneOf(d) && Math.random() < .3) return withCatch(FORTUNES[fortuneOf(d)].say, c);
  if(d.crush && !w){ const co = byId(d.crush.id); if(co && Math.random() < .35) return withCatch(pick([`Lately I keep glancing at ${co.d.name}...`, `${co.d.name} — I wonder where they're off to today`, `(sneaks a peek at ${co.d.name})`]), c); }
  if(!d.kid && !(d.want && ['love','makeup','sick'].includes(d.want.type)) && Math.random() < .35){ const ml = memoryLine(r); if(ml) return withCatch(ml, c); }
  return withCatch(pick(lines), c);
}
function withCatch(line, c){ return line + (/[！？!?…~。.]$/.test(line) ? ' ' : ', ') + c; }

function startChat(a,b){
  a.state = b.state = 'chat'; a.timer = b.timer = rand(4,6); a.target = b; b.target = a;

}
function endChat(r, natural){

    o.target = null; o.state = 'idle'; o.timer = rand(1,2);

    if(fv0 >= 15 && (r.d.partner!==o.d.id || (Math.random() < .5 && S.day - (r.d.pSince||0) >= 3)) && !(r.d.made && r.d.made[o.d.id] === S.day) && !isFamily(r,o) && !hasSocialWant(r) && !hasSocialWant(o) && Math.random() < (compat(r,o)===1 ? .1 : .04) * fortuneK(r,o)){

    }

    r.d.mood = clamp(r.d.mood+4,0,100); o.d.mood = clamp(o.d.mood+4,0,100);
    if((r.d.friends[o.d.id]||0) >= 15){ const mid = r.p.root.position.clone().add(o.p.root.position).multiplyScalar(.5); mid.y = 2.6; burst(scene, mid, r.d.partner===o.d.id ? '💕' : '❤️', 2, .3); }
    // made up on their own
    const mk = (x,y)=>x.d.want && x.d.want.type==='makeup' && x.d.want.with===y.d.id;
    const cooled = x=>!x.d.want || x.d.want.since==null || S.day - x.d.want.since >= 2;
    if((mk(r,o) || mk(o,r)) && cooled(r) && cooled(o) && Math.random() < .3){ if(mk(r,o)) r.d.want = null; if(mk(o,r)) o.d.want = null; toast(`${r.d.name} and ${o.d.name} made up on their own`); logNews(`🤝 ${r.d.name} and ${o.d.name} got to chatting and made up`); }

    if(natural && r.d.partner===o.d.id && S.hour < 18.5 && !isNight() && Math.random() < .35){ const k = pick(dateLocs()); startDate(r, o, k); logNews(`💕 ${r.d.name} and ${o.d.name} went on a date at the ${LOCS[k].n}`); return; }

}
function decide(r){
  if(isNight()){ r.state = 'walk'; r.dest = doorPoint(homeSlot(r)); r.onArrive = 'home'; return; }
  if(r === selected){ r.state = 'idle'; r.timer = 1; return; }
  if(r.d.kid && kidAge(r.d) < 3){ const par = (r.d.parents||[]).map(byId).filter(x=>x && x.p.root.visible && x.state!=='home'); if(par.length){ const pp = pick(par).p.root.position; r.state = 'walk'; r.dest = new T.Vector3(pp.x + rand(-1.2,1.2), 0, pp.z + rand(-1.2,1.2)); r.onArrive = null; r.target = null; return; } }
  if(festivalNow()){
    if(!r.watching){ r.watching = true; r.state = 'walk'; r.dest = plazaSpot(); r.onArrive = null; r.target = null; return; }
    r.state = 'idle'; r.timer = rand(3,5); return;
  }
  r.watching = false;
  if(schoolAge(r.d) && schoolTime() && Math.random() < .6){ goHang(r, 'school'); r.working = true; return; }
  if(!r.d.kid && (r.d.age||0) >= 60){ r.speed = Math.min(r.speed, 1.55); if(Math.random() < .35){ goHang(r, pick(['chess','chess','beach','library'])); return; } }
  if(workTime() && !r.d.kid && !r.d.isPlayer && r.d.job && JOBS[r.d.job] && JOBS[r.d.job].loc && LOCS[JOBS[r.d.job].loc] && Math.random() < .45){ goHang(r, JOBS[r.d.job].loc); r.working = true; return; }
  if(weather()==='rain' && Math.random() < .25){ goHang(r, pick(['cafe','library','ramen'])); return; }
  if(campTime() && Math.random() < .3){ goHang(r, 'camp'); return; }
  if(Math.random() < .13){ const k = pick(HANG_LOCS); if(k==='petpark' && !pets.some(pw=>pw.d.owner===r.d.id)) goHang(r, 'park'); else goHang(r, k); return; }
  const roll = Math.random(), chatty = .22 + ((r.d.traits && r.d.traits.social) ?? 4)*.035;
  if(roll < chatty){
    const pt = r.d.partner && byId(r.d.partner);
    if(pt && isFree(pt) && Math.random() < .5){ r.state='walk'; r.target = pt; r.dest = pt.p.root.position.clone(); r.onArrive = 'chat'; return; }
    const mad = (x,y)=>x.d.want && x.d.want.type==='makeup' && x.d.want.with===y.d.id;
    const others = residents.filter(o=>o!==r && isFree(o) && !mad(r,o) && !mad(o,r));
    if(others.length){ r.state='walk'; r.target = pick(others); r.dest = r.target.p.root.position.clone(); r.onArrive = 'chat'; return; }
  }

  r.state = 'idle'; r.timer = rand(2,4);
}
function plazaSpot(){ for(let k=0;k<20;k++){ const a = rand(0,6.28), rr = rand(5,7.5); const v = new T.Vector3(Math.cos(a)*rr,0,Math.sin(a)*rr); if(!EXCL.some(e=>Math.hypot(e.x-v.x,e.z-v.z)<e.r+.3)) return v; } return new T.Vector3(0,0,6); }
function angleTo(from, to){ return Math.atan2(to.x-from.x, to.z-from.z); }
function turnTo(obj, ang, k){ let d = ang - obj.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); obj.rotation.y += d*Math.min(1,k); }

function animate(r, dt, t){
  const p = r.p; const st = r.state==='script' ? (r.moving ? 'walk' : (r.pose || 'idle')) : r.state;
  let bob = 0, armA = 0, legA = 0, headTilt = 0, raise = 0;
  if(st==='walk'){ r.phase += dt*r.speed*4.2; bob = Math.abs(Math.sin(r.phase))*.09; legA = Math.sin(r.phase)*.55; armA = Math.sin(r.phase)*.6; }
  else if(st==='chat'){ bob = Math.abs(Math.sin(t*6+r.d.slot))*.05; headTilt = Math.sin(t*3+r.d.slot)*.12; armA = Math.sin(t*5)*.25; }
  else if(st==='happy'){ bob = Math.abs(Math.sin(t*9))*.55; raise = 2.5; }
  else if(st==='sing'){ bob = Math.abs(Math.sin(t*6))*.06; headTilt = Math.sin(t*3)*.16; }
  else if(st==='eat'){ headTilt = 0; bob = Math.abs(Math.sin(t*10))*.03; p.mouth.scale.y = 1 + Math.abs(Math.sin(t*12))*1.4; }
  else { headTilt = Math.sin(t*1.3+r.d.slot)*.06; bob = Math.sin(t*2.2+r.d.slot)*.015; }
  if(st!=='eat') p.mouth.scale.y = 1;
  p.rig.position.y = bob;
  p.head.rotation.z = headTilt;
  p.legs[0].rotation.x = legA; p.legs[1].rotation.x = -legA;
  p.arms[0].rotation.x = -armA; p.arms[1].rotation.x = armA;
  p.arms[0].rotation.z = lerp(p.arms[0].rotation.z, -.18 - raise, .2);
  p.arms[1].rotation.z = lerp(p.arms[1].rotation.z, .18 + raise, .2);
  if(st==='sing'){ p.arms[1].rotation.x = -1.9; p.mouth.scale.y = 1 + Math.abs(Math.sin(t*9))*1.3; }
  const happyFace = r.d.mood >= 35 || st==='happy' || st==='sing';
  p.mouth.rotation.z = happyFace ? Math.PI : 0; p.mouth.position.y = happyFace ? -.2 : -.27;
  const bl = p.accSlot.children[0] && p.accSlot.children[0].userData.balloon; if(bl) bl.position.y = 1.35 + Math.sin(t*2)*.08;
}
function updateResident(r, dt, t){
  const pos = r.p.root.position;
  if(r.state==='home' || r.state==='visit' || r.state==='away'){ return; }
  r.timer -= dt;
  if(r.angryT > 0) r.angryT -= dt;
  if(r.state==='script'){
    r.moving = false;
    if(r.dest){
      const dx = r.dest.x-pos.x, dz = r.dest.z-pos.z, dist = Math.hypot(dx,dz);
      if(dist < .1) r.dest = null;
      else { const step = Math.min(dist, r.speed*dt); pos.x += dx/dist*step; pos.z += dz/dist*step; avoidObstacles(pos, r.dest, step); turnTo(r.p.root, Math.atan2(dx,dz), dt*8); r.moving = true; }
    } else if(r.face) turnTo(r.p.root, angleTo(pos, r.face.p.root.position), dt*6);
    else if(r.facePos) turnTo(r.p.root, angleTo(pos, r.facePos), dt*6);
  } else if(r.state==='hang'){
    const dw = r.dateWith && r.dateWith.state==='hang' ? r.dateWith : null, L = LOCS[r.hangLoc];
    if(dw) turnTo(r.p.root, angleTo(pos, dw.p.root.position), dt*5); else if(L) turnTo(r.p.root, angleTo(pos, L), dt*3);
    if(r.ride && dw && r.hangLoc==='park' && Math.random() < dt*1.2) burst(scene, new T.Vector3(LOCS.park.x + rand(-1.5,1.5), rand(3.5,6), LOCS.park.z + rand(-1,1)), pick(['💕','💖','✨']), 1, .5);
    if(r.timer<=0) endHang(r);
  } else if(r.state==='idle'){
    if(r===selected) turnTo(r.p.root, angleTo(pos, camera.position), dt*6);
    if(r.timer<=0) decide(r);
  } else if(r.state==='walk'){
    if(r.onArrive==='chat'){
      if(!r.target || !isFree(r.target) || isNight()){ r.state='idle'; r.timer=.5; r.target=null; }
      else r.dest.copy(r.target.p.root.position);
    }
    if(r.state==='walk'){
      const dx = r.dest.x-pos.x, dz = r.dest.z-pos.z, dist = Math.hypot(dx,dz);
      const stopAt = r.onArrive==='chat' ? 1.35 : .15;
      if(dist < stopAt){
        if(r.onArrive==='chat' && r.target){ startChat(r, r.target); }
        else if(r.onArrive==='hang'){ r.state = 'hang'; r.timer = r.working ? rand(14,20) : rand(6,10); r.onArrive = null; }
        else if(r.onArrive==='away'){ r.state = 'away'; r.p.root.visible = false; r.onArrive = null; if(selected===r) closeSheet(); }
        else if(r.onArrive==='visit'){ r.state = 'visit'; r.p.root.visible = false; r.onArrive = null; if(selected===r) closeSheet(); }
        else if(r.onArrive==='home'){ r.state='home'; r.p.root.visible=false; if(selected===r){ chooser = null; renderSheet(); toast(`${r.d.name} went home to sleep. You can still visit ${ta(r.d)} at home`); } }
        else if(r.onArrive==='feast'){ r.onArrive = null; r.state = 'eat'; r.timer = 3.2; r.eatEmoji = pick(['🍗','🍰','🍙','🍕','🍜','🍣']); r.after = ()=>beHappy(r, '😋', 1.6); turnTo(r.p.root, angleTo(pos, new T.Vector3(0,0,0)), 1); }
        else { r.state='idle'; r.timer = rand(1.5,4); }
      } else {
        const step = Math.min(dist, r.speed*dt); pos.x += dx/dist*step; pos.z += dz/dist*step;
        avoidObstacles(pos, r.dest, step);
        turnTo(r.p.root, Math.atan2(dx,dz), dt*8);
      }
    }
  } else if(r.state==='chat'){
    if(r.target) turnTo(r.p.root, angleTo(pos, r.target.p.root.position), dt*8);
    r.chatT -= dt; if(r.chatT<=0){ r.chatT = 1.1; r.topic = pick(CHAT_TOPICS); }
    convoTick(r, dt);
    if(r.timer<=0 || !r.target) endChat(r, true);
  } else if(r.state==='happy' || r.state==='eat'){
    if(r===selected) turnTo(r.p.root, angleTo(pos, camera.position), dt*6);
    if(r.timer<=0){ if(r.state==='eat' && r.after){ const a = r.after; r.after = null; a(); } else { r.state='idle'; r.timer = rand(1,2); } }
  }
  // bubble
  if(r.state==='script') setBubble(r, r.scriptTalk ? null : r.scriptBubble || null);
  else if(r.angryT > 0) setBubble(r, '💢');
  else if(r.state==='chat') setBubble(r, (r.tb && r.tb.visible) || (r.target && r.target.tb && r.target.tb.visible) ? null : r.topic || '💬');
  else if(r.state==='happy') setBubble(r, r.happyEmoji || '💖');
  else if(r.state==='eat') setBubble(r, r.eatEmoji || '😋');
  else if(r.state==='hang') setBubble(r, r.dateWith && r.dateWith.state==='hang' ? '💕' : r.working && jobOf(r.d) ? jobOf(r.d).e : (LOCS[r.hangLoc]||{}).e || '💬');
  else if(r.d.lvPending) setBubble(r, '⭐', 'want');
  else if(r.d.want) setBubble(r, wantEmoji(r.d.want), 'want');
  else if(r.d.mood < 30) setBubble(r, '💧');
  else if(festivalNow() && r.state==='idle') setBubble(r, '🎆');
  else setBubble(r, null);
  if(r.state!=='chat' && !(r.state==='script' && r.scriptTalk) && r.tb && r.tb.visible) setTalkBubble(r, null);
  r.bubble.position.y = 3.55 + Math.sin(t*3 + r.d.slot)*.08;
  // story wishes (birthdays, crushes, fights, level-ups) wobble so they're easy to spot from far away
  const urgent = r.bubble.visible && (r.d.lvPending || (r.d.want && ['bday','love','propose','makeup','sick','lost'].includes(r.d.want.type)) && r.state!=='script');
  const bs = urgent ? 1.05*(1.12 + Math.sin(t*6 + r.d.slot)*.1) : r.bubble.visible && r.d.want ? 1.05*(1 + Math.max(0, Math.sin(t*2.4 + r.d.slot))*.06) : 1.05;
  r.bubble.scale.set(bs, bs, 1);
  if(r.p.root.visible && !onScreen(pos)){ r.offT = (r.offT||0) + dt; if(r.offT < .25) return; dt = r.offT; r.offT = 0; }
  animate(r, dt, t);
}
function needsTick(r, secs){
  const d = r.d;
  if(r.state==='away') return;
  if(d.isPlayer){ if(!(d.want && d.want.type==='bday')) d.want = null; d.full = Math.max(d.full, 70); d.mood = Math.max(d.mood, 70); return; }
  if(d.want && d.want.with){ const o = byId(d.want.with); if(!o || (d.want.type==='love' && !canRomance(r,o)) || (d.want.type==='propose' && d.partner!==o.d.id)) d.want = null; }
  const kidK = d.kid ? .5 : 1; // little ones eat less
  if(r.state==='home'){ d.full = clamp(d.full - secs*.07*kidK, 0, 100); return; }
  d.full = clamp(d.full - secs*.22*kidK, 0, 100);
  // a hungry-wish that got filled some other way (a banquet, the canteen) just goes away
  if(d.want && d.want.type==='food' && d.full >= 75 && r.state!=='eat') d.want = null;
  // the island canteen feeds anyone who gets really hungry, once a day each
  if(projLv('canteen') && d.full < 30 && d.canteenDay !== S.day && (r.state==='idle' || r.state==='walk') && !d.isPlayer){ d.canteenDay = S.day; d.full = clamp(d.full + 50, 0, 100); if(d.want && d.want.type==='food') d.want = null; r.state = 'eat'; r.timer = 1.8; r.eatEmoji = '🍱'; r.after = null; }
  const target = d.full < 25 ? 25 : d.want && d.want.type==='sick' ? 30 : (d.want ? 50 : projLv('garden') ? 78 : 70);
  d.mood += (target - d.mood) * .01 * secs;
  if(d.full < 38 && (!d.want || ['pat','acc','furn','friend','play','cloth','ask','game','sleep','taste'].includes(d.want.type))){ d.want = {type:'food', item: Math.random()<.5 ? d.fav : null}; }
  if(!d.want && Math.random() < .008*secs){
    const opts = ['pat','acc','furn','play','cloth','ask','ask','game','game','sleep','taste'];
    if(residents.length > 1 && residents.some(o=>o!==r && (d.friends[o.d.id]||0) < 15)) opts.push('friend','friend');
    const ty = pick(opts);
    if(ty==='acc'){ const choices = Object.keys(ACCS).filter(k=>k!==d.acc); d.want = {type:'acc', item:pick(choices)}; }
    else if(ty==='cloth') d.want = {type:'cloth', item:pick(Object.keys(OUTFITS).filter(k=>k!=='tee' && k!==d.outfit))};
    else if(ty==='ask') d.want = {type:'ask', q:pickAsk(r)};
    else if(ty==='game') d.want = {type:'game', g:pick(Object.keys(GAMES))};
    else if(ty==='taste'){ const ch = Object.keys(FOODS).filter(k=>!(d.ate||[]).includes(k) && !FOODS[k].holiday); if(ch.length) d.want = {type:'taste', item:pick(ch)}; }
    else if(ty==='furn'){ const have = new Set(d.room.items.map(i=>i.type)); const ch = Object.keys(FURN).filter(k=>!have.has(k)); if(ch.length) d.want = {type:'furn', item:pick(ch)}; }
    else d.want = {type:ty};
  }
}

function locSpot(k){
  const L = LOCS[k];
  if(k==='beach'){ const d = Math.hypot(L.x,L.z), k2 = (isleR-1.8)/d; return new T.Vector3(L.x*k2+rand(-1,1), 0, L.z*k2+rand(-1,1)); }
  if(k==='petpark' || k==='sports') return new T.Vector3(L.x + rand(-1.6,1.6), 0, L.z + rand(-1.2,1.2));
  if(k==='camp'){ const a = rand(0, Math.PI*2); return new T.Vector3(L.x + Math.cos(a)*1.9, 0, L.z + Math.sin(a)*1.9); }
  const d = Math.hypot(L.x,L.z), ux = -L.x/d, uz = -L.z/d, px = -uz, pz = ux, off = L.r + (k==='cafe' ? 1.7 : 1.1), side = rand(-1.2,1.2);
  return new T.Vector3(L.x + ux*off + px*side, 0, L.z + uz*off + pz*side);
}
function dateLocs(){ const base = ['cafe','park','beach','tower','ramen','pool']; if(campTime()) base.push('camp'); return S.isleLevel ? base.concat('flower','spring') : base; }
function goHang(r, k){ r.state = 'walk'; r.target = null; r.onArrive = 'hang'; r.hangLoc = k; r.dest = locSpot(k); }
function startDate(a, b, k){
  k = k || pick(['cafe','park','beach','tower']);
  [a,b].forEach(x=>{ if(x.state==='chat'){ const o = x.target; x.target = null; if(o && o.target===x && o!==a && o!==b){ o.target = null; o.state = 'idle'; o.timer = 1; } } });
  goHang(a, k); goHang(b, k); b.dest = a.dest.clone().add(new T.Vector3(rand(-1,1),0,rand(-1,1)).setLength(1));
  a.dateWith = b; b.dateWith = a;
}
function endHang(r){

let show = null, musicHold = false;
const PARTY_C = new T.Vector3(0,0,7.2);
const HB = [[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],[67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2]];

function freeCast(except){ return residents.filter(o=>!except.includes(o) && o.p.root.visible && o.state!=='home' && !inEvent(o)); }
function buildCake(){
  const g = new T.Group(), c = new T.Group(); c.position.y = .74; g.add(c);
  g.add(mesh(G.cyl(.8,.8,.08,24), M('#FFF6E6'), 0,.7,0)); g.add(mesh(G.cyl(.08,.08,.7,8), M('#C98B62'), 0,.35,0));
  c.add(mesh(G.cyl(.5,.5,.35,24), M('#FFE3EA'), 0,.18,0)); c.add(mesh(G.cyl(.36,.36,.28,24), M('#FFFFFF'), 0,.48,0)); c.add(mesh(G.cyl(.37,.37,.05,24), M('#FF8FB1'), 0,.63,0));
  const flames = [];
  ['#6FA8FF','#FFC94D','#7ED957','#B48CFF','#FF7A8A'].forEach((col,i)=>{ const a = i/5*Math.PI*2; c.add(mesh(G.cyl(.025,.025,.22,6), M(col), Math.cos(a)*.22,.74,Math.sin(a)*.22)); const f = mesh(G.sph(.05,8,6), B('#FFB347'), Math.cos(a)*.22,.9,Math.sin(a)*.22, false); f.scale.y = 1.5; c.add(f); flames.push(f); });
  g.userData.flames = flames; g.position.copy(PARTY_C); return g;
}
function partySong(){
  const words = ['Hap py birth day to you','Hap py birth day to you','Hap py birth day my dear friend','Hap py birth day to you'], beat = .4, seq = [], lines = words.map(w=>w.split(' '));
  let at = 0, k = 0;
  lines.forEach((ln, li)=>ln.forEach((ch, pos)=>{ const [m, b] = HB[k++]; seq.push({ch, m, dur:b*beat, at, line:li, pos}); at += b*beat; }));
  return {title:'Happy Birthday', seq, lines, beat, total:at, genre:GENRES.pop};
}
function songSeq(song, d){
  const g = GENRES[song.genre] || GENRES.pop, beat = 60/g.bpm;
  const title = fillLyrics(song.title, d);
  const lines = fillLyrics(song.lyrics, d).split('\n').map(l=>l.split(/\s+/).map(w=>w.replace(/[，。、！？,.!?~～…“”"]/g, '')).filter(Boolean).slice(0,9)).filter(l=>l.length).slice(0,6);
  let seed = [...title].reduce((a,c)=>(a*31 + c.charCodeAt(0))>>>0, 7);
  const sr = ()=>{ seed = (seed*1103515245 + 12345)>>>0; return seed/4294967296; };
  const seq = []; let at = 0, idx = 3;
  lines.forEach((ln, li)=>{
    ln.forEach((ch, pos)=>{
      const last = pos===ln.length-1;
      idx = clamp(idx + Math.round((sr()-.5)*4), 0, g.scale.length-1);
      const dur = beat * (last ? 2 : sr() < .25 ? 1.5 : 1) * (song.genre==='rap' ? .7 : 1);
      seq.push({ch, m:60 + g.scale[last ? (li%2 ? 0 : 4) : idx], dur, at, line:li, pos}); at += dur;
    });
    at += beat;
  });
  return {title, seq, lines, beat, total:at, genre:g};
}
function playSungNote(n, voice){
  tone(mf(n.m), Math.min(.6, n.dur*.95), 'triangle', .05);
  if(!soundOn || !window.speechSynthesis || document.hidden || !document.hasFocus()) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(n.ch), v = pickVoice(voice); if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.pitch = clamp(natPitch(voice) * (.6 + (n.m-60)/22), .3, 2); u.rate = clamp(natRate(voice)*1.45, .8, 2);
    speechSynthesis.speak(u);
  }catch(e){}
}
function accompany(bi, song){
  const root = [48,45,41,43][Math.floor(bi/4)%4], saw = song.genre.wave==='sawtooth';
  tone(mf(root - 12 + (bi%4===2 ? 7 : 0)), song.beat*.9, saw ? 'sawtooth' : 'triangle', saw ? .035 : .05);
  if(bi%2===0) tone(65,.12,'sine',.14); else tone(3200,.03,'square',.012);
}
function applause(){ for(let i=0;i<30;i++) tone(rand(1500,4200), .03, 'square', .012, rand(0,1.6)); }
function karaoke(lines, li, pos, title){
  const el = $('#karaoke'); if(li < 0){ el.hidden = true; return; }
  el.innerHTML = `<small>♪ ${esc(title)}</small>${(lines[li]||[]).map((c,i)=>`<span class="${i<=pos?'on':''}">${esc(c)}</span>`).join(' ')}`; el.hidden = false;
}
function startParty(host){
  if(busy()) return;
  if(isNight() || host.state==='home'){ toast('Everyone\'s asleep, let\'s do it tomorrow'); return; }
  if(mode==='room') leaveRoom(); closeSheet(); closeModal();
  const guests = freeCast([host]).slice(0,7), all = [host, ...guests];
  all.forEach(castScript);
  const toCam = new T.Vector3(Math.sin(cam.yaw),0,Math.cos(cam.yaw)), phi = Math.atan2(toCam.z, toCam.x);
  host.dest = PARTY_C.clone().addScaledVector(toCam, -1.2); host.facePos = PARTY_C.clone();
  guests.forEach((g,i)=>{ const a = phi + Math.PI + (i+1)*Math.PI*2/(guests.length+1); g.dest = new T.Vector3(PARTY_C.x + Math.cos(a)*2.1, 0, PARTY_C.z + Math.sin(a)*2.1); g.facePos = PARTY_C.clone(); });
  const cake = buildCake(); scene.add(cake);
  show = {type:'party', host, cast:all, stage:0, t:0, cake, song:partySong(), voice:(guests[0]||host).d.voice};
  cam.goal.copy(PARTY_C); cam.distGoal = 16;
  toast(`Everyone came to celebrate ${host.d.name}'s birthday! 🎂`, 'pink');

function stageSpot(){ const st = LOC_G.stage; st.updateMatrixWorld(); const v = st.localToWorld(new T.Vector3(0,0,-.1)); v.y = 0; return v; }
function startConcert(host, song){
  if(busy()) return;
  if(isNight() || host.state==='home'){ toast('The stage is closed at night, come back tomorrow'); return; }
  if(mode==='room') leaveRoom(); closeSheet();
  const aud = freeCast([host]).slice(0,6), all = [host, ...aud];
  all.forEach(castScript);
  const L = LOCS.stage, dd = Math.hypot(L.x,L.z), ux = -L.x/dd, uz = -L.z/dd, px = -uz, pz = ux, spot = stageSpot();
  host.dest = spot.clone(); host.facePos = new T.Vector3(L.x + ux*6, 0, L.z + uz*6);
  aud.forEach((x,i)=>{ const k = aud.length > 1 ? i/(aud.length-1) - .5 : 0, row = i%2; x.dest = new T.Vector3(L.x + ux*(4.3+row*1.1) + px*k*4.4, 0, L.z + uz*(4.3+row*1.1) + pz*k*4.4); x.facePos = spot.clone(); });
  show = {type:'concert', host, cast:all, stage:0, t:0, song:songSeq(song, host.d), voice:host.d.voice};
  cam.goal.set(L.x + ux*2.2, 0, L.z + uz*2.2); cam.distGoal = 17; cam.yawGoal = Math.atan2(ux, uz); cam.pitchGoal = 1.02;

function updateShow(dt){
  const sh = show; if(!sh) return; sh.t += dt;
  if(sh.tick) return updateShow2(dt);
  if(sh.stage===0){
    if(!sh.cast.some(x=>x.dest) || sh.t > 9){
      sh.cast.forEach(x=>{ if(x.dest){ x.p.root.position.copy(x.dest); x.dest = null; } });
      sh.stage = 1; sh.t = 0; sh.next = 0; sh.beatI = -1; musicHold = true;
      if(sh.type==='party'){ sh.host.scriptBubble = '🎂'; sh.cast.forEach(x=>{ if(x!==sh.host){ x.pose = 'chat'; x.scriptBubble = '🎵'; } }); toast('Everyone sings Happy Birthday! 🎵'); }
      else { sh.host.p.root.position.y = .35; sh.host.pose = 'sing'; sh.host.scriptBubble = '🎤'; sh.cast.forEach(x=>{ if(x!==sh.host){ x.pose = 'chat'; x.scriptBubble = '🎶'; } }); }
    }
  } else if(sh.stage===1){
    const seq = sh.song.seq;
    while(sh.next < seq.length && seq[sh.next].at <= sh.t){
      const n = seq[sh.next++]; playSungNote(n, sh.voice); karaoke(sh.song.lines, n.line, n.pos, sh.song.title);
      if(sh.type==='concert' && Math.random() < .3) burst(scene, sh.host.p.root.position.clone().setY(3.1), pick(['🎵','🎶','✨']), 1, .4);
    }
    if(sh.type==='concert'){
      const bi = Math.floor(sh.t / sh.song.beat);
      if(bi !== sh.beatI){ sh.beatI = bi; accompany(bi, sh.song); sh.cast.forEach((x,i)=>{ if(x!==sh.host){ x.scriptBubble = (bi+i)%6===0 ? '👏' : '🎶'; x.pose = (bi+i)%6===0 ? 'happy' : 'chat'; } }); }
    }
    if(sh.t > sh.song.total + .4){ sh.stage = 2; sh.t = 0; karaoke(null, -1); finishShow(); }
  } else if(sh.stage===2 && sh.t > 3.2) endShow();
}

function mnote(m, t, dur, type, vol){
  const c = actx, o = c.createOscillator(), g = c.createGain();

  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.015); g.gain.exponentialRampToValueAtTime(.0008, t+dur);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+dur+.05);

function musicTick(){
  const c = actx;
  if(!c || c.state!=='running' || !musicOn || !soundOn || musicHold || document.hidden || festivalNow()){ mNext = 0; return; }
  if(!musicGain){ musicGain = c.createGain(); musicGain.gain.value = .55; musicGain.connect(audioOut || c.destination); }
  const h = S.hour, night = h >= 21 || h < 6, eve = h >= 18 && !night, th = musicTheme(), e8 = 60/(night ? 64 : eve ? th.bpm*.82 : th.bpm)/2;
  if(mNext < c.currentTime) mNext = c.currentTime + .05;
  while(mNext < c.currentTime + .35){
    const i = mStep % 64, [root, minor] = th.chords[Math.floor(i/8) % 4], third = minor ? 3 : 4;
    if(night){
      mnote(root + 24 + [0,third,7,12,7,third,0,7][i%8], mNext, e8*2.2, 'sine', .03);
      if(i%8===0) mnote(root + 12, mNext, e8*7, 'sine', .028);
    } else {
      if(i%2===0) mnote(root + (i%4===0 ? 0 : 7), mNext, e8*1.6, 'triangle', eve ? .05 : .06);
      if(i%4===2) [0,third,7].forEach(o=>mnote(root + 12 + o, mNext, e8*.8, 'triangle', .016));
      const m = th.mel[i]; if(m) mnote(eve ? m-12 : m, mNext, e8*1.5, eve ? 'sine' : th.lead, eve ? .035 : th.lead==='square' ? .02 : th.lead==='sawtooth' ? .014 : .035);
        if(th.bell && i%8===0) mnote(root + 36, mNext, e8*3, 'sine', .02);
      if(!eve && i%2===1) mnote(96, mNext, .03, 'square', .005);
    }
    mNext += e8; mStep++;
  }
}

/* ---------------- birth: a stork brings the baby ---------------- */
let birth = null; const birthQueue = [];
function buildStork(){
  const g = new T.Group(), W = M('#FFFFFF'), O = M('#FF9F1C'), K = M('#2A2438');
  const body = mesh(G.sph(.45,16,12), W, 0,0,0); body.scale.set(.8,.75,1.3); g.add(body);
  const neck = mesh(G.cyl(.08,.1,.6,8), W, 0,.4,.45); neck.rotation.x = .5; g.add(neck);
  g.add(mesh(G.sph(.2,12,10), W, 0,.68,.62));
  const beak = mesh(G.cone(.07,.55,8), O, 0,.64,.98); beak.rotation.x = Math.PI/2; g.add(beak);
  [-1,1].forEach(s=>g.add(mesh(G.sph(.035,6,5), K, s*.1,.74,.74)));
  const wings = [-1,1].map(s=>{ const w = new T.Group(); w.position.set(s*.3,.1,0); w.add(mesh(G.box(1.1,.06,.7), W, s*.55,0,0)); w.add(mesh(G.box(.3,.065,.7), K, s*1.05,0,0)); g.add(w); return w; });
  [-1,1].forEach(s=>{ const lg = mesh(G.cyl(.025,.025,.7,5), O, s*.12,-.5,-.35); lg.rotation.x = 1.1; g.add(lg); });
  const bundle = new T.Group(); bundle.position.set(0,.3,1.18);
  bundle.add(mesh(G.cyl(.012,.012,.36,4), M('#C9C9D6'), 0,.14,0));
  const cloth = mesh(G.sph(.3,14,10), M('#FFD3DA'), 0,-.2,0); cloth.scale.set(1,.85,1); bundle.add(cloth);
  bundle.add(mesh(G.cone(.15,.3,8), M('#FFD3DA'), 0,.08,0));
  bundle.add(mesh(G.sph(.12,10,8), M('#FFE3CC'), 0,-.12,.2));
  g.add(bundle); g.userData = {wings, bundle};
  g.scale.setScalar(1.4); return g;
}
function queueBirth(a, b, kid){ kid.state = 'script'; kid.dest = null; kid.p.root.visible = false; birthQueue.push({a, b, kid}); }
function birthBusy(r){ return (!!birth && (birth.a===r || birth.b===r || birth.kid===r)) || birthQueue.some(q=>q.kid===r); }
function startBirth(q){
  const {a, b, kid} = q;
  if(!byId(a.d.id) || !byId(b.d.id)){ kid.state = 'idle'; kid.p.root.visible = true; return; }
  if(mode==='room') leaveRoom(); if(selected) closeSheet();
  [a,b].forEach(castScript);
  const door = doorPoint(a.d.slot), d = Math.hypot(door.x, door.z) || 1, ux = -door.x/d, uz = -door.z/d, px = -uz, pz = ux;
  const L = new T.Vector3(door.x + ux*2.6, 0, door.z + uz*2.6);
  a.dest = new T.Vector3(L.x - px*1.1 - ux*.3, 0, L.z - pz*1.1 - uz*.3); b.dest = new T.Vector3(L.x + px*1.1 - ux*.3, 0, L.z + pz*1.1 - uz*.3);
  a.facePos = L.clone(); b.facePos = L.clone();
  kid.p.root.position.copy(L); kid.p.root.visible = false;
  const stork = buildStork(), from = new T.Vector3(L.x - ux*34 + px*10, 16, L.z - uz*34 + pz*10), hover = new T.Vector3(L.x, 5.2, L.z);
  stork.position.copy(from); scene.add(stork);
  birth = {a, b, kid, L, stork, from, hover, stage:0, t:0};
  cam.goal.set(L.x, 2.4, L.z); cam.distGoal = 17; cam.pitchGoal = .42; cam.yawGoal = Math.atan2(ux, uz); // look from the plaza side toward the house
  musicHold = true;
  toast('🕊️ Huh? What\'s that flying in the sky...', 'pink');
}
function flap(st, t, speed){ st.userData.wings.forEach((w,i)=>w.rotation.z = (i ? -1 : 1)*Math.sin(t*speed)*.7); }
function updateBirth(dt, t){
  if(!birth){ if(birthQueue.length && !ev && !show && !isNight() && mode==='island') startBirth(birthQueue.shift()); return; }
  const B = birth, st = B.stork; B.t += dt;
  if(B.stage===0){ // stork flies in while the parents gather
    const k = Math.min(1, B.t/5), e = 1 - Math.pow(1-k, 3);
    st.position.lerpVectors(B.from, B.hover, e); st.position.y += Math.sin(t*3)*.15;
    st.lookAt(B.hover.x, st.position.y, B.hover.z); flap(st, t, 9);
    if(k >= 1 && (!B.a.dest && !B.b.dest || B.t > 7)){
      [B.a,B.b].forEach(x=>{ if(x.dest){ x.p.root.position.copy(x.dest); x.dest = null; } x.pose = 'chat'; x.scriptBubble = '😮'; });
      B.stage = 1; B.t = 0; toast('It\'s the stork! It\'s carrying a little bundle...');
      const w = new T.Vector3(); B.stork.userData.bundle.getWorldPosition(w); scene.attach(B.stork.userData.bundle); B.bundle = B.stork.userData.bundle; B.drop = w;
      tone(880,.3,'sine',.05); tone(1175,.4,'sine',.04,.2);
    }
  } else if(B.stage===1){ // the bundle floats down
    flap(st, t, 5); st.position.y = B.hover.y + Math.sin(t*2)*.12;
    const k = Math.min(1, B.t/2.2);
    B.bundle.position.set(B.L.x + Math.sin(t*3)*.25*(1-k), lerp(B.drop.y, .45, k), B.L.z);
    B.bundle.rotation.z = Math.sin(t*3)*.25*(1-k);
    if(k >= 1){
      scene.remove(B.bundle); B.stage = 2; B.t = 0;
      B.kid.p.root.visible = true; B.kid.p.root.scale.setScalar(.01); B.kid.scriptBubble = '👶';
      burst(scene, B.L.clone().setY(1.2), '✨', 12, 1); confetti(scene, B.L); sfx.happy();
      [B.a,B.b].forEach(x=>{ x.pose = 'happy'; x.scriptBubble = '💖'; x.d.mood = 100; });
      [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.06,.5 + i*.18));
      toast(`👶 Baby ${B.kid.d.name} is born!`, 'pink'); { const nm = B.kid.d.name; setTimeout(()=>autoPhoto(`👶 Baby ${nm} is born`), 1200); }
    }
  } else if(B.stage===2){ // baby appears, stork leaves
    const k = Math.min(1, B.t/.8); B.kid.p.root.scale.setScalar(kidScale(B.kid.d)*(1 - Math.pow(1-k,3)) + .01);
    flap(st, t, 10); st.position.y += dt*3; st.position.x += dt*6; st.rotation.y += dt*.3;
    if(B.t > 4) endBirth();
  }
}
function endBirth(){
  const B = birth; if(!B) return;
  scene.remove(B.stork); if(B.bundle) scene.remove(B.bundle);
  [B.a,B.b,B.kid].forEach(x=>{ x.state = 'idle'; x.timer = rand(1,2.5); x.pose = null; x.scriptBubble = null; x.face = null; x.facePos = null; x.dest = null; });
  B.kid.p.root.scale.setScalar(kidScale(B.kid.d));
  birth = null; musicHold = false; cam.distGoal = null; cam.goal.y = 0; save();
  nameBaby(B.kid, B.a, B.b);
}
function nameBaby(kid, a, b){
  if($('#modalRoot').innerHTML) return; // don't cover something the player is doing
  const d = kid.d, g = gOf(kid)==='f' ? 'girl' : 'boy';
  openModal(modalHead('👶 A baby is born!') + `<p class="q-say">${esc(a.d.name)} and ${esc(b.d.name)} had a ${g}! Give the baby a name</p>\n    <div class="name-row"><input class="text-in" id="babyName" maxlength="12" value="${esc(d.name)}" autocomplete="off"><button class="toy pill-btn hot" data-bname="1">That's the name</button></div>`, bt=>{

const textTexCache = {};
function textBubbleTex(text){
  if(textTexCache[text]) return textTexCache[text];
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  let fz = 40, lines = [text]; g.font = 'bold 40px "PingFang SC","Microsoft YaHei",sans-serif';
  while(g.measureText(text).width > 448 && fz > 30){ fz -= 2; g.font = `bold ${fz}px "PingFang SC","Microsoft YaHei",sans-serif`; }
  if(g.measureText(text).width > 448){ const ws = text.split(' '); let best = 1, bd = 1e9; for(let i=1;i<ws.length;i++){ const d = Math.abs(g.measureText(ws.slice(0,i).join(' ')).width - g.measureText(ws.slice(i).join(' ')).width); if(d < bd){ bd = d; best = i; } } lines = [ws.slice(0,best).join(' '), ws.slice(best).join(' ')]; fz = 30; g.font = `bold ${fz}px "PingFang SC","Microsoft YaHei",sans-serif`; while(Math.max(...lines.map(l=>g.measureText(l).width)) > 456 && fz > 20){ fz -= 2; g.font = `bold ${fz}px "PingFang SC","Microsoft YaHei",sans-serif`; } }
  const w = Math.min(496, Math.max(...lines.map(l=>g.measureText(l).width)) + 48);
  roundRect(g, (512-w)/2, 8, w, 84, 30); g.fillStyle = '#FFFFFF'; g.fill(); g.lineWidth = 5; g.strokeStyle = '#3B3355'; g.stroke();
  g.beginPath(); g.moveTo(240,90); g.lineTo(256,118); g.lineTo(272,90); g.closePath(); g.fill(); g.stroke(); g.fillRect(238,82,36,10);
  g.fillStyle = '#3B3355'; g.textAlign = 'center'; g.textBaseline = 'middle'; if(lines.length > 1){ g.fillText(lines[0], 256, 52 - fz*.55); g.fillText(lines[1], 256, 52 + fz*.55); } else g.fillText(text, 256, 52);
  const t = new T.CanvasTexture(c); textTexCache[text] = t; trimTextTex(); return t;
}
// speech-bubble textures are made per sentence; keep only the most recent ones so long sessions don't pile them up
function trimTextTex(){
  const keys = Object.keys(textTexCache); if(keys.length <= 160) return;
  const inUse = new Set(residents.map(r=>r.tb && r.tb.material.map).filter(Boolean));
  for(const k of keys.slice(0, keys.length - 120)){ const t = textTexCache[k]; if(inUse.has(t)) continue; t.dispose(); delete textTexCache[k]; }
}
// free the GPU copies of a throwaway object tree; shared geometries and cached materials/textures are left alone
function disposeTree(root){

}

function shopPrice(tab, k){ const v = shopCat(tab)[k]; return S.shop && S.shop.special && S.shop.special.tab===tab && S.shop.special.key===k ? Math.round(v.p*(projLv('loyalty') ? .45 : .6)) : v.p; }

function partyNow(){ return S.party && S.party.day===S.day && S.hour >= 18 && S.hour < 20.5; }
function partyMorning(extra){
  if(Math.random() > .22) return;
  const hosts = residents.filter(r=>!r.d.kid && !r.d.isPlayer && residents.filter(o=>o!==r && (r.d.friends[o.d.id]||0) >= 40).length >= 2);
  if(!hosts.length) return;

  S.party = {day:S.day, host:h.d.id, guests:guests.map(g=>g.d.id)};
  extra.push(`🎉 ${h.d.name} is throwing a party at home at 6 PM tonight and invited ${guests.map(g=>g.d.name).join(', ')}`);
}
const partyNote = sprite(bubbleTexPlain('🎉'), 1.4, 1.4); partyNote.visible = false; scene.add(partyNote);
function partyHourly(prev){
  const P = S.party; if(!P || P.day !== S.day) return;
  const host = byId(P.host); if(!host) return;

    [host, ...P.guests.map(byId).filter(Boolean)].forEach(r=>{ if(inEvent(r) || r.state==='home') return; if(r.state==='chat') endChat(r); r.state = 'walk'; r.dest = doorPoint(host.d.slot); r.onArrive = r===host ? 'home' : 'visit'; r.visiting = host.d.id; r.target = null; });
    toast(`🎉 ${host.d.name}'s party has started! Tap ${taP(host.d)} house to take a look!`, 'pink');
  }
  if(prev < 20.5 && S.hour >= 20.5){
    const guests = residents.filter(r=>r.state==='visit' && r.visiting===host.d.id);
    guests.forEach(g=>{ g.state = 'idle'; g.timer = rand(.5,2); g.p.root.position.copy(doorPoint(host.d.slot)); g.p.root.visible = true; addFriend(host, g, 5); });
    for(let i=0;i<guests.length;i++) for(let j=i+1;j<guests.length;j++) addFriend(guests[i], guests[j], 3);
    if(guests.length) logNews(`🎉 ${host.d.name}'s party is lively, and ${guests.map(g=>g.d.name).join(', ')} all came`);
    if(mode==='room' && roomRes===host){ buildRoomKeepChar(); renderRoomBar(); }
  }

function designById(id){ return (S.designs||[]).find(x=>x.id===id); }
function designCanvas(ds, px){
  const c = document.createElement('canvas'); c.width = c.height = 16*px; const g = c.getContext('2d');
  for(let i=0;i<256;i++){ const k = parseInt(ds.px[i],16); if(!k) continue; g.fillStyle = DESIGN_PAL[k]; g.fillRect((i%16)*px, Math.floor(i/16)*px, px, px); }
  return c;
}
function designPatterns(){ return (S.designs||[]).map(ds=>({id:'d:'+ds.id, n:ds.name})); }

}
const posterTexCache = {};
function posterTex(id){ if(posterTexCache[id]) return posterTexCache[id]; const ds = designById(id); if(!ds) return null; const t = new T.CanvasTexture(designCanvas(ds, 16)); t.magFilter = T.NearestFilter; return posterTexCache[id] = t; }

    if(!b || b.dataset.dz===undefined) return;
    if(b.dataset.dz==='new') openDesignEditor(null); else openDesignEditor(list[+b.dataset.dz]);
  });
}
function openDesignEditor(ds){
  const draftD = ds ? {id:ds.id, name:ds.name, px:ds.px.split('')} : {id:'x'+Date.now().toString(36), name:'My design', px:Array(256).fill('0')};
  let col = 3, tool = 'pen', down = false;
  openModal(modalHead(ds ? '🎨 Edit design' : '🎨 New design') + `
    <div class="name-row" style="margin-bottom:10px"><input class="text-in" id="dzName" maxlength="16" value="${esc(draftD.name)}"></div>
    <div class="dz-wrap"><div class="dz-grid" id="dzGrid">${draftD.px.map((k,i)=>`<i data-px="${i}" style="background:${k==='0' ? '' : DESIGN_PAL[parseInt(k,16)]}"></i>`).join('')}</div>
    <div class="dz-side"><div class="dz-pal">${DESIGN_PAL.map((c,i)=>`<button data-col="${i}" class="${i===col?'on':''}" style="background:${i ? c : 'repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px'}" aria-label="Color ${i}"></button>`).join('')}</div>\n    <div class="row-btns"><button class="toy pill-btn" data-tool="pen">✏️ Pen</button><button class="toy pill-btn" data-tool="fill">🪣 Fill</button><button class="toy pill-btn" data-tool="clear">🧽 Clear</button></div></div></div>\n    <div class="row-btns" style="margin-top:12px"><button class="toy big-go" data-dzsave="1" style="flex:1">Save</button>${ds ? '<button class="toy pill-btn" data-dzdel="1">Delete</button>' : ''}</div>`, b=>{
    if(!b){ return; }
    if(b.dataset.col){ col = +b.dataset.col; document.querySelectorAll('[data-col]').forEach(x=>x.classList.toggle('on', x===b)); if(tool==='clear') tool = 'pen'; }
    if(b.dataset.tool==='clear'){ draftD.px.fill('0'); document.querySelectorAll('[data-px]').forEach(x=>x.style.background=''); }
    else if(b.dataset.tool) tool = b.dataset.tool;
    if(b.dataset.dzsave){
      draftD.name = ($('#dzName').value || 'My design').trim().slice(0,8);
      S.designs = S.designs || []; const out = {id:draftD.id, name:draftD.name, px:draftD.px.join('')}, idx = S.designs.findIndex(x=>x.id===draftD.id);
      if(idx >= 0) S.designs[idx] = out; else S.designs.push(out);
      invalidateDesign(out.id); save(); toast('🎨 Design saved!'); openDesigns();
    }
    if(b.dataset.dzdel){ S.designs = S.designs.filter(x=>x.id!==draftD.id); residents.forEach(r=>{ if(r.d.room && r.d.room.poster===draftD.id) r.d.room.poster = null; if(r.d.look.pattern==='d:'+draftD.id){ r.d.look.pattern = 'none'; rebuildChar(r); } }); invalidateDesign(draftD.id); save(); openDesigns(); }
  });
  const grid = $('#dzGrid');
  const paint = el=>{
    const i = +el.dataset.px; if(isNaN(i)) return; const k = col.toString(16);
    if(tool==='fill'){ const from = draftD.px[i]; if(from===k) return; const q = [i]; while(q.length){ const j = q.pop(); if(draftD.px[j]!==from) continue; draftD.px[j] = k; const x = j%16, y = Math.floor(j/16); if(x>0) q.push(j-1); if(x<15) q.push(j+1); if(y>0) q.push(j-16); if(y<15) q.push(j+16); } grid.querySelectorAll('[data-px]').forEach(c=>{ const v = draftD.px[+c.dataset.px]; c.style.background = v==='0' ? '' : DESIGN_PAL[parseInt(v,16)]; }); return; }
    draftD.px[i] = k; el.style.background = col ? DESIGN_PAL[col] : '';
  };
  grid.addEventListener('pointerdown', e=>{ down = true; grid.setPointerCapture(e.pointerId); const el = document.elementFromPoint(e.clientX, e.clientY); if(el && el.dataset && el.dataset.px) paint(el); });
  grid.addEventListener('pointermove', e=>{ if(!down || tool==='fill') return; const el = document.elementFromPoint(e.clientX, e.clientY); if(el && el.dataset && el.dataset.px) paint(el); });
  grid.addEventListener('pointerup', ()=>down = false);
}

function saveCode(json){ return btoa(unescape(encodeURIComponent(json))); }
function readCode(code){ try{ return decodeURIComponent(escape(atob(code.trim()))); }catch(e){ return null; } }

    if(b.dataset.sv==='copy'){ const code = saveCode(json); const done = ()=>toast('📋 Save code copied. Paste it somewhere safe'); if(navigator.clipboard) navigator.clipboard.writeText(code).then(done, ()=>{ $('#svCode').value = code; toast('Copy failed. The code is in the box below, please copy it by hand'); }); else { $('#svCode').value = code; toast('The code is in the box below, please copy it by hand'); } }

  });

function loadSaveText(text){
  let s = null; try{ s = JSON.parse(text); }catch(e){}
  if(!s || !Array.isArray(s.residents) || typeof s.day !== 'number'){ toast('This isn\'t a valid Heart Island save'); return; }
  try{ localStorage.setItem('xx_save', JSON.stringify(s)); }catch(e){ toast('Not enough browser storage, loading failed'); return; }
  toast(`Loaded: day ${s.day}, ${s.residents.length} residents`, 'gold'); setTimeout(()=>location.reload(), 700);
}

function stat(d, k){ return (d.stats && d.stats[k]) || 0; }
function bump(d, k, n=1){ d.stats = d.stats || {}; d.stats[k] = (d.stats[k]||0) + n; checkDream(d); }
const LIFE_DREAMS = {
  singer:{n:'Become a star singer', e:'🎤', goal:2, how:'Hold 2 concerts on the stage', val:d=>stat(d,'concerts')},
  gourmet:{n:'Taste all the island\'s food', e:'🍽️', goal:10, how:'Eat 10 different foods', val:d=>(d.ate||[]).length},
  traveler:{n:'Travel the world', e:'🌍', goal:2, how:'Go on 2 trips off the island', val:d=>stat(d,'trips')},
  fashion:{n:'Become a fashion icon', e:'👗', goal:4, how:'Wear 4 different outfits', val:d=>(d.worn||[]).length},
  popular:{n:'Be the most popular', e:'🌟', goal:4, how:'Have 4 good friends', val:d=>Object.keys(d.friends||{}).filter(id=>byId(id) && (d.friends[id]||0) >= 50).length},
  family:{n:'Start a happy family', e:'🏡', goal:1, how:'Get married and have a child', val:d=>{ const r = byId(d.id); return r && d.pType==='spouse' && residents.some(k=>k.d.parents && k.d.parents.includes(d.id)) ? 1 : 0; }},
  scholar:{n:'Become a scholar', e:'📚', goal:6, how:'Read at the library 6 times', val:d=>stat(d,'read')},
  athlete:{n:'Become a star athlete', e:'🏅', goal:3, how:'Win 3 races', val:d=>stat(d,'raceWins')},
  chef:{n:'Become a chef', e:'👨‍🍳', goal:3, how:'Eat 3 dishes you cooked', val:d=>stat(d,'dishes')},
  petfriend:{n:'Best friends with a pet', e:'🐾', goal:1, how:'Have a pet', val:d=>pets.some(pw=>pw.d.owner===d.id) ? 1 : 0}
};
function dreamOf(d){ return d.dream && LIFE_DREAMS[d.dream.id] ? d.dream : null; }
function giveDream(d){ if(d.isPlayer || d.kid) return; const used = d.dreamsDone || []; const ch = Object.keys(LIFE_DREAMS).filter(k=>!used.includes(k)); if(ch.length) d.dream = {id:pick(ch), since:S.day}; }
function checkDream(d){
  const dr = dreamOf(d); if(!dr || dr.done) return;
  const D = LIFE_DREAMS[dr.id]; if(D.val(d) < D.goal) return;
  dr.done = true; d.dreamsDone = (d.dreamsDone||[]).concat(dr.id);
  const r = byId(d.id); addCoins(100);
  toast(`🌟 ${d.name} achieved a dream: ${D.n}! +100 coins`, 'gold'); logNews(`🌟 ${d.name} achieved a life dream: ${D.n}`);
  if(r && r.p.root.visible && mode==='island'){ confetti(scene, r.p.root.position); if(!inEvent(r)) beHappy(r, '🌟', 2.5); cam.goal.copy(r.p.root.position); setTimeout(()=>autoPhoto(`🌟 ${d.name} achieved a dream`), 900); }
  sfx.happy(); milestone('dream');
}
function dreamHtml(d){
  const dr = dreamOf(d); if(!dr) return '';
  const D = LIFE_DREAMS[dr.id], v = Math.min(D.goal, D.val(d));
  return `<div class="dreambox"><b>${D.e} Dream: ${D.n}</b>${dr.done ? '<span class="dream-done">✨ Dream come true!</span>' : `<span class="dream-how">${D.how} (${v}/${D.goal})</span><div class="bar"><i style="width: ${v/D.goal*100}%;background:var(--sun)"></i></div>`}</div>`;
}

function updateSeen(){
  S.seen = S.seen || {food:{}, acc:{}, cloth:{}, furn:{}};
  ['food','acc','cloth','furn'].forEach(k=>Object.entries(S.inv[k]||{}).forEach(([id,n])=>{ if(n>0) S.seen[k][id] = 1; }));
  residents.forEach(r=>{ const d = r.d; if(d.acc) S.seen.acc[d.acc] = 1; if(d.outfit && d.outfit!=='tee') S.seen.cloth[d.outfit] = 1; (d.room && d.room.items || []).forEach(it=>S.seen.furn[it.type] = 1); (d.ate||[]).forEach(f=>S.seen.food[f] = 1); });
  const n = residents.length; if(n >= 10) milestone('pop10'); if(n >= 25) milestone('pop25'); if(n >= 50) milestone('pop50');
}

function openFamilyTree(){
  const P = r=>`<div class="ft-person"><img src="${portrait(r.d)}" alt=""><span>${r.d.isPlayer?'⭐':''}${esc(r.d.name)}</span><small>${r.d.kid ? kidTag(r.d) : (r.d.age ? r.d.age + ' yrs' : '')}</small></div>`;
  const kidsOf2 = (a,b)=>residents.filter(k=>k.d.parents && k.d.parents.includes(a.d.id) && (!b || k.d.parents.includes(b.d.id)));
  const seen = new Set();
  const unit = r=>{ // a person, their spouse/partner and their children, recursively
    if(seen.has(r)) return ''; seen.add(r);
    const pt = r.d.partner && byId(r.d.partner); if(pt) seen.add(pt);
    const kids = residents.filter(k=>k.d.parents && (k.d.parents.includes(r.d.id) || (pt && k.d.parents.includes(pt.d.id))));
    return `<div class="ft-unit"><div class="ft-couple">${P(r)}${pt ? `<span class="ft-link">${r.d.pType==='spouse' ? '💍' : '💕'}</span>${P(pt)}` : ''}</div>${kids.length ? `<div class="ft-kids">${kids.map(unit).join('')}</div>` : ''}</div>`;
  };
  const roots = residents.filter(r=>!(r.d.parents && r.d.parents.some(id=>byId(id))));
  const families = roots.filter(r=>r.d.partner || residents.some(k=>k.d.parents && k.d.parents.includes(r.d.id))).map(unit).filter(Boolean);
  const singles = roots.filter(r=>!seen.has(r));
  openModal(modalHead('👪 Family tree') + `<p class="tip">Each row is a generation: 💍 means married, 💕 means dating, and the row below is their kids.</p>\n ${families.length ? `<div class="ft">${families.join('')}</div>` : '<p class="empty">Nobody on the island has started a family yet.</p>'}
    ${singles.length ? `<div class="sec">Single islanders</div><div class="ft-singles">${singles.map(P).join('')}</div>` : ''}`);
}

function postcard(d, dest){
  const img = new Image();
  img.onload = img.onerror = ()=>{
    try{
      const c = document.createElement('canvas'); c.width = 640; c.height = 456; const g = c.getContext('2d');
      const gr = g.createLinearGradient(0,0,0,400); gr.addColorStop(0, dest.bg[0]); gr.addColorStop(1, dest.bg[1]); g.fillStyle = gr; g.fillRect(0,0,640,400);
      g.font = '210px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; g.textAlign = 'center'; g.fillText(dest.e, 420, 300);
      if(img.width){ g.save(); g.beginPath(); g.arc(170, 230, 110, 0, Math.PI*2); g.clip(); g.drawImage(img, 60, 120, 220, 220); g.restore(); g.lineWidth = 8; g.strokeStyle = '#FFFFFF'; g.beginPath(); g.arc(170,230,110,0,Math.PI*2); g.stroke(); }
      g.fillStyle = '#FFFBF2'; g.fillRect(0,400,640,56); g.fillStyle = '#D95466'; g.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif'; g.textAlign = 'left'; g.fillText(`✈️ ${d.name} in ${dest.n}`, 18, 437);
      g.fillStyle = '#6E6788'; g.font = '16px "PingFang SC","Microsoft YaHei",sans-serif'; g.textAlign = 'right'; g.fillText(`Heart Island · Day ${S.day}`, 622, 437);
      const ph = loadPhotos(); ph.unshift(c.toDataURL('image/jpeg', .75)); while(ph.length > 30) ph.pop();
      for(;;){ try{ localStorage.setItem('xx_photos', JSON.stringify(ph)); break; }catch(e){ if(ph.length <= 1) break; ph.pop(); } }
    }catch(e){}
  };
  img.src = portrait(d);
}

function residentCode(d){

function loadScript(src){ return new Promise((ok, no)=>{ const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function qrDataURL(text){

function memoryLine(r){
  const d = r.d, m = (d.mem||[]).filter(x=>S.day - x.day <= 20); if(!m.length) return null;
  const x = pick(m), ago = S.day - x.day <= 1 ? 'Yesterday' : 'Last time';
  if(x.k==='gift' && ACCS[x.v]) return d.acc===x.v ? `I wear the ${ACCS[x.v].n} you gave me every day` : `${ago} you gave me the ${ACCS[x.v].n}. I love it`;
  if(x.k==='cloth' && OUTFITS[x.v]) return d.outfit===x.v ? `I'm wearing the ${OUTFITS[x.v].n} you gave me, and everyone says it looks great` : `Thanks! ${ago} you gave me the ${OUTFITS[x.v].n}`;
  if(x.k==='food' && FOODS[x.v]) return FOODS[x.v].dish ? `The ${FOODS[x.v].n} you made yourself... I want more!` : x.v===d.fav ? `${ago}, the ${FOODS[x.v].n} you fed me was so tasty` : `${ago}'s ${FOODS[x.v].n} — thank you`;
  if(x.k==='love') return 'Thanks to your help with my confession, every day is so happy now';
  if(x.k==='makeup') return 'Thanks for helping us make up, or I\'d still be sulking';

function genMel(seed, scale, root, rest){
  let s = seed; const r = ()=>{ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
  const out = []; let idx = 3;
  for(let i=0;i<64;i++){ if(i%8===7 || r() < rest){ out.push(0); continue; } idx = clamp(idx + Math.round((r()-.5)*3.2), 0, scale.length-1); out.push(root + scale[idx]); }
  return out;
}

function homeSlot(r){ const p = r.d.moveTo && byId(r.d.moveTo); return p && p.d.partner===r.d.id && r.d.partner===p.d.id ? p.d.slot : r.d.slot; }
function divorce(a, b){
  a.d.partner = b.d.partner = null; a.d.pType = b.d.pType = null; a.d.moveTo = b.d.moveTo = null; a.d.ex = b.d.id; b.d.ex = a.d.id;
